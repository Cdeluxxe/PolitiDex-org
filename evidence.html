<!-- ═════════════════════════════════════════════════════════════════════════════
     evidence.html — THE EIGHTH SHELL. /evidence IS ITS OWN DOCUMENT.
     ────────────────────────────────────────────────────────────────────────────
     WHAT WAS WRONG. The Evidence Locker is a workspace — four views, a sticky
     quick-jump map, a filter toolbar, a bill-number search, a discovery
     showcase, a featured rail and a grid of every receipt on file. It had no
     address. A previous pass got it off the homepage's critical path by putting
     it behind a closed door and parking its 388 lines of markup in
     <template id="el-workspace-tpl">, and gave it /locker — but /locker was a
     200-rewrite to index.html, so "the receipts room" was still a 2.25 MB front
     page that mounted a workspace after it arrived. The reader paid for the
     homepage to read the locker, and the homepage carried the locker's whole
     workspace to serve a reader who mostly never opened it.

     WHAT THIS IS. The workspace, at its own address, served for /evidence by a
     single netlify.toml rewrite. The engine did not fork and did not move: this
     document loads the same /evidence-locker.js index.html loads, over the same
     markup, with the same ids, the same filter mirrors and the same CSS.

     WHAT CHANGED IN THE ENGINE — three small things, all of them the split:
       • _wantsLocker() now matches /evidence as well as /locker, so arriving
         here mounts the workspace instead of leaving the door shut;
       • _openLocker() treats a failed _mount() (no <template> in the document —
         which is now the homepage's state) as "go to /evidence", carrying the
         caller's filter in the query string. One change, and roughly fifteen
         call sites in index.html plus digital-library.js and my-profile.js
         became cross-document navigations without being touched;
       • _queryOpts() reads that query string back on arrival and hands it to the
         same _applyOpen() every in-page deep link already used, so the filter a
         link was made from is the filter the reader lands on.

     WHY THE ENGINE STAYS ON THE HOMEPAGE TOO. It is not only a workspace. It
     also publishes _pdxEvidenceOnRecord, _pdxEvidenceCountForPeople,
     _pdxEvidenceDepthForPerson, _pdxEvidenceDepthPill and _pdxEnhanceDepthPills,
     which the People's Mandate reform cards, the profile depth pills and My
     Team's evidence tallies all read — every one of those surfaces is elsewhere
     on the front page. And _init() returns early when #evidence-locker is
     absent, so removing the section would starve those counts rather than tidy
     the page. So index.html keeps the module, keeps the section and keeps the
     door, and lost exactly one thing: the <template>. That is what makes a
     locker grid unmountable on '/' and what turns every door into an address.

     WHAT THIS DOCUMENT CARRIES. The workspace markup (verbatim — see THE COPIED
     BLOCKS below), the quick-jump nav script that lives inside it, the evidence
     engine, and the data the engine reads:
       • the Firebase anonymous-roster chain, because the receipts ARE the live
         per-member `spotlight` documents. Without _pdxEnsureFullProfile, _load()
         calls finish() immediately and _build() folds in only the bundled
         SPOTLIGHT_DATA map — a locker that renders, and under-reports. A
         receipts room that under-reports is worse than one that is slow;
       • cmp-data.js (the light roster _roster() scans alongside PROFILES) and
         spotlight-cards-data.js (the bundled SPOTLIGHT_DATA the live docs are
         folded on top of);
       • the stance corpus + stance-helpers.js, for window._polPositionMap —
         one of exactly TWO unguarded global reads in the whole engine (lines
         3272 and 3821);
       • one inline copy of window.PDXStance, for the other one (lines 3256 and
         3850, _elStancePill and _issueFocusStanceChip);
       • issue-map.js and issue-colors.js for the issue vocabulary the filters,
         category headers and chips are built from;
       • spotlight-index.js, so a receipt that belongs to an Issue Spotlight can
         open it at /issue/<slug> — the index (86 KB), never the 1.2 MB corpus;
       • profile-evidence.js for window.PDXProfilePid, the alias table _canonPid
         reads: without it a retired or aliased id files its receipts under a
         second person row, and a duplicate person on an accountability surface
         is a wrong claim, not a cosmetic bug;
       • person-link.js, because a receipt names a person and a person is /p/<pid>.

     WHAT IT DELIBERATELY DOES NOT CARRY. app.css (986 KB — see THE DRESS below),
     the homepage hero and Who Represents Me, the full Stance Library grid (that
     is /stances, and the one line pointing at it is below), compare-hub.js,
     profiles-full.js and the profile modal, my-stances.js, the Archive, the
     Mandate, the forum, the account graph beyond the anonymous roster read,
     pdx-lazy-data.js and pdx-stability.js, and no service-worker registration
     (the ballot.html / me.html / spotlight.html precedent).

     THE DRESS. The workspace markup is verbatim, which means it still carries
     the ~30 Tailwind utilities and two app.css classes it shipped with. So this
     document loads /css/tailwind.css (78 KB — the compiled build, custom colours
     and fonts included) and /app-2.css (98 KB — the locker's own stylesheet, 561
     .el- selectors, self-sufficient: every var() it reads has a literal
     fallback). It does NOT load app.css for the two remaining classes; those are
     declared locally below, which is 4 lines against 986 KB. Total CSS here is
     176 KB, where the homepage's locker cost 1.16 MB.

     NEVER A SCORE, NEVER A PARTY SORT. Every number on this document is a COUNT
     of receipts on file, and the only orderings are the ones the toolbar offers.
     Nothing here prints a percentage, a party weight, a lean or a match figure.

     THE RULE THIS DOCUMENT LIVES BY: EVERY SAME-ORIGIN PATH IS ROOT-ABSOLUTE.
     /evidence/ is served with HTTP 200 at a trailing-slash path, so a bare src
     of evidence-locker.js would resolve to /evidence/evidence-locker.js, the
     rewrite would catch it, and the browser would be handed this document and
     told to parse HTML as JavaScript. A leading slash is correct at every depth.
     scripts/test-evidence-shell.mjs fails on a relative src or href here.

     THIS IS A PUBLIC BROWSE ROOM, so unlike /ballot and /me it is indexable, it
     carries a real canonical on www.politidex.fyi, and it is listed in
     sitemap.xml. No JSON-LD: index.html's WebSite/Organization block describes
     the front page, and a browse room is not the front page.
     ═══════════════════════════════════════════════════════════════════════════════ -->

  <!-- The share tags, in share-preview.ts's attribute order (`property` then
       `content`, `rel` then `href`) for the same reason the other shells carry
       them that way — that edge function rewrites by an attribute-ordered
       regex, so a reshuffle here would be a silent no-op there rather than an
       error, on the day /evidence is added to its config.path. -->
  <title>Evidence locker &middot; PolitiDex</title>
  <link rel="canonical" href="https://www.politidex.fyi/evidence" />
  <meta name="description" content="The receipts, in one place — recorded floor and committee video, posts, statements and official bill records, searchable by person, issue and bill number." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PolitiDex" />
  <meta property="og:title" content="Evidence locker &middot; PolitiDex" />
  <meta property="og:description" content="The receipts, in one place — recorded floor and committee video, posts, statements and official bill records, searchable by person, issue and bill number." />
  <meta property="og:url" content="https://www.politidex.fyi/evidence" />
  <meta property="og:image" content="https://www.politidex.fyi/og-image.png" />
  <meta property="og:image:alt" content="PolitiDex — the evidence locker" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Evidence locker &middot; PolitiDex" />
  <meta name="twitter:description" content="The receipts, in one place — searchable by person, issue and bill number." />
  <meta name="twitter:image" content="https://www.politidex.fyi/og-image.png" />
  <meta name="theme-color" content="#0a0f1e" />

  <!-- The engine and the stylesheet a first paint waits on. -->
  <link rel="preload" as="script" href="/evidence-locker.js" />
  <link rel="preload" as="style" href="/app-2.css" />

  <!-- Barlow / Bebas Neue, non-blocking, with the same swap index.html,
       person.html, issue.html, spotlight.html, ballot.html, me.html and
       stances.html use. A swap written differently on one document is a visible
       font flash on exactly one URL shape. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" onload="this.rel='stylesheet'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" /></noscript>

  <!-- THE WORKSPACE'S DRESS, in the order index.html and person.html declare it.
       tailwind.css first (the utilities and the compiled custom palette),
       app-2.css second (the locker's own 561 .el- rules), so a .el- rule still
       wins a tie against a utility exactly as it does on the other documents. -->
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/app-2.css" />

  <style>
    /* THE FIXED CHROME, MEASURED ONCE. Same contract person.html, issue.html,
       spotlight.html, ballot.html, me.html and stances.html answer for their own
       chrome, and for the same reason: a custom property that is never declared
       invalidates every calc() that reads it. This document's chrome is ONE row
       — the locker has its own search, its own filter toolbar and its own sticky
       quick-jump map, and a second search field in the bar would be two boxes
       for one grid. The @supports guard is the one every other shell carries: a
       custom property accepts any token sequence, so an engine that cannot parse
       env() would swallow the declaration and invalidate every calc() reading
       it; an engine without env() also has no notch. */
    :root { --pdx-chrome: 3.25rem; color-scheme: dark; }
    @supports (padding-top: env(safe-area-inset-top)) {
      :root { --pdx-chrome: calc(3.25rem + env(safe-area-inset-top, 0px)); }
    }
    /* No app.css here, so the page's own ground colour is declared rather than
       inherited from a 986 KB stylesheet this document does not load. */
    html, body { background: #070b16; color: #e7eefb; }
    body {
      margin: 0;
      font-family: 'Barlow', system-ui, -apple-system, sans-serif;
      padding-top: var(--pdx-chrome);
    }

    /* THE TWO CLASSES THE WORKSPACE USES THAT LIVE IN app.css, DECLARED LOCALLY.
       The workspace markup below is verbatim, so it still names them. These are
       the only two app.css selectors it reaches for, and they are four lines —
       which is the whole argument for not loading 986 KB to get them.

       .animate-on-scroll is app.css's own default state, opacity:1, with the
       comment "JS adds visible class - but we default to visible so nothing
       hides." That default is the one that matters here: index.html has an
       IntersectionObserver that adds .visible and this document does not, so a
       rule that started hidden would leave four blocks of the workspace
       permanently invisible. Copied at its visible value, without the
       transition, because there is nothing here to transition from. */
    .section-title { font-size: clamp(2rem, 10vw, 3.5rem); }
    .animate-on-scroll { opacity: 1; transform: none; }

    /* The one-row shell bar. Static: no search field, no account menu, no layout
       observer, no measurement pass, nothing that reads the viewport. Two
       destinations: the way home, and the OTHER room — one item per room, which
       is the whole point of the split. */
    .pdx-ev-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1200;
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; height: 3.25rem; padding: env(safe-area-inset-top, 0px) 1rem 0;
      background: rgba(10, 15, 30, 0.86); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .pdx-ev-bar a { text-decoration: none; }
    .pdx-ev-wordmark {
      font-family: 'Bebas Neue', 'Barlow Condensed', sans-serif;
      font-size: 1.15rem; letter-spacing: 0.12em; color: #fff;
    }
    .pdx-ev-wordmark span { color: #e0273f; }
    .pdx-ev-links { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
    .pdx-ev-link {
      font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem;
      letter-spacing: 0.14em; text-transform: uppercase; color: #9fb4d4;
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 0.5rem;
      padding: 0.3rem 0.65rem; white-space: nowrap; cursor: pointer;
      background: transparent;
    }
    .pdx-ev-link--room { color: #93c5fd; border-color: rgba(96, 165, 250, 0.32); }

    /* The one line out of this room and into the other one. A real anchor, so it
       works before any JavaScript runs. */
    .pdx-ev-seam {
      max-width: 80rem; margin: 0 auto; padding: 1.4rem 1rem 0; text-align: center;
      font: 800 0.8rem/1.5 'Barlow Condensed', sans-serif;
      letter-spacing: 0.14em; text-transform: uppercase; color: #8aa0c4;
    }
    .pdx-ev-seam a { color: #93c5fd; border-bottom: 1px solid rgba(147, 197, 253, 0.45); }
    .pdx-ev-seam a:hover, .pdx-ev-seam a:focus-visible { color: #dbeafe; }

    /* The only thing a reader sees if JavaScript never runs. */
    .pdx-ev-note {
      max-width: 40rem; margin: 2.5rem auto; padding: 0 1.1rem;
      font: 400 1rem/1.6 'Barlow', system-ui, sans-serif; color: #9fb4d4;
    }
    .pdx-ev-note a { color: #f5d77a; }
  </style>

  <!-- ══ MOVED HERE FROM index.html (the locker-only half of the People's
          Mandate style injector, its lines 27054–27177) ══════════════════════
       ANOTHER MOVE, NOT A COPY. index.html builds a CSS string inside its
       People's Mandate block and appends it to <head> at runtime. That string
       was two stylesheets in one: the .pdx-mandate-* rules that dress the
       reform rail on the front page, and the .el-* rules below, which dress
       surfaces that only ever existed inside the Evidence Locker — the reform,
       Compare and "Relevant to Me" filter banners, the single-politician
       context header, the by-issue receipt grouping, and the power badge.

       None of these selectors are in app-2.css. They were only ever here in
       that injected string, so when the workspace moved to this document the
       rules would have stayed behind and matched nothing: /evidence would paint
       an unstyled banner over the grid the moment a reader arrived with
       ?mandate=, ?pol= or the relevant-to-me toggle on, and every power badge
       would render as bare text. Moving them keeps the pairing that made them
       work and deletes ~55 dead rules from the front page.

       A PLAIN <style> RATHER THAN THE INJECTOR. The JavaScript around them on
       index.html existed to decorate Mandate cards, not to deliver CSS; the
       appendChild put the block last in <head>, after app-2.css, which is
       exactly where this element sits. Same cascade position, no script. -->
  <style id="pdx-ev-mandate-css">
    /* mandate reform pills inside the Evidence Locker's connected view */
    .el-mandate-pill{display:inline-flex;align-items:center;gap:0.25rem;font-family:"Barlow Condensed",sans-serif;
      font-weight:700;font-size:0.62rem;letter-spacing:0.03em;color:#f5c842;background:rgba(245,200,66,0.12);
      border:1px solid rgba(245,200,66,0.38);border-radius:999px;padding:0.14rem 0.5rem;line-height:1.25;}
    /* per-reform filter banner shown atop the Evidence Locker results */
    .el-mandate-filter{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin:0 0 1rem;padding:0.55rem 0.8rem;
      border-radius:0.6rem;background:linear-gradient(135deg,rgba(245,200,66,0.12),rgba(30,53,96,0.4));
      border:1px solid rgba(245,200,66,0.32);}
    .el-mandate-filter-ico{font-size:0.95rem;flex-shrink:0;}
    .el-mandate-filter-txt{flex:1 1 auto;min-width:0;font-family:"Barlow Condensed",sans-serif;font-size:0.78rem;
      letter-spacing:0.02em;color:#cbd9ec;}.el-mandate-filter-txt strong{color:#f5c842;}
    .el-mandate-filter-clear{flex-shrink:0;cursor:pointer;font-family:"Barlow Condensed",sans-serif;font-weight:700;
      font-size:0.62rem;letter-spacing:0.05em;text-transform:uppercase;color:#f5c842;background:rgba(245,200,66,0.12);
      border:1px solid rgba(245,200,66,0.4);border-radius:999px;padding:0.2rem 0.6rem;transition:background 0.15s;}
    .el-mandate-filter-clear:hover{background:rgba(245,200,66,0.24);}
    /* compare-context banner — same shape as the reform banner, but in the
       blue-violet Compare accent so the "you came from a comparison" cue reads
       as distinct from a People's Mandate reform filter */
    .el-compare-filter{background:linear-gradient(135deg,rgba(167,139,250,0.16),rgba(30,53,96,0.42));
      border-color:rgba(167,139,250,0.4);}
    .el-compare-filter .el-mandate-filter-txt strong{color:#c4b5fd;}
    .el-compare-filter .el-mandate-filter-clear{color:#c4b5fd;background:rgba(167,139,250,0.16);
      border-color:rgba(167,139,250,0.45);}
    .el-compare-filter .el-mandate-filter-clear:hover{background:rgba(167,139,250,0.28);}
    /* "Relevant to Me" toggle chip — sits with the type chips in the toolbar so
       it inherits .el-chip, but its active state reads in the Evidence-blue/gold
       blend (your saved team) to set it apart from the plain gold type chips. */
    .el-relevant-toggle{gap:0.32rem;}
    .el-relevant-toggle:hover{border-color:rgba(245,200,66,0.55);color:#fad96a;}
    .el-relevant-toggle:focus-visible{outline:2px solid rgba(96,165,250,0.85);outline-offset:2px;}
    .el-chip.el-relevant-toggle.is-active{color:#0a0f1e;
      background:linear-gradient(135deg,#9ec5ff,#fad96a);border-color:rgba(245,200,66,0.9);
      box-shadow:0 0 0 1px rgba(96,165,250,0.3),0 4px 14px rgba(96,165,250,0.22);}

    .el-chip.el-relevant-toggle.is-active:focus-visible{outline-color:rgba(245,200,66,0.9);}
    /* relevant-context banner — same shape as the reform/Compare banners, in the
       Evidence-blue accent so "narrowed to your people" reads distinct from the
       gold Mandate filter and the violet Compare filter. */
    .el-relevant-filter{background:linear-gradient(135deg,rgba(96,165,250,0.18),rgba(30,53,96,0.42));
      border-color:rgba(96,165,250,0.4);}
    .el-relevant-filter .el-mandate-filter-ico{color:#fad96a;}
    .el-relevant-filter .el-mandate-filter-txt strong{color:#93c5fd;}
    .el-relevant-filter .el-mandate-filter-clear{color:#bfdbfe;background:rgba(96,165,250,0.16);
      border-color:rgba(96,165,250,0.45);}
    .el-relevant-filter .el-mandate-filter-clear:hover{background:rgba(96,165,250,0.3);}
    /* Single-politician context header — the Evidence-blue band that turns the

    .el-pol-ctx-card{display:flex;align-items:center;gap:0.9rem;flex-wrap:wrap;padding:0.85rem 1rem;border-radius:0.7rem;

    .el-pol-ctx-main{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:0.12rem;}

    .el-pol-ctx-name{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.18rem;line-height:1.1;color:#eaf2ff;}

    /* Power/position pill on evidence cards — the gold accent that flags an

      box-shadow:0 0 0 1px rgba(245,200,66,0.12),0 1px 6px rgba(245,200,66,0.18);
      max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

           and skip the clone — and it would have forked the document from

           the same order, as every other entry point — and means the markup can
           stay byte-for-byte identical and be pinned by a test.

       the rule that acts on it (#evidence-locker.el-closed .el-shell{display:none})

       THE QUICK-JUMP NAV, and it is a MOVE rather than a copy. It lives INSIDE
       the workspace — it powers #el-jump, which is an element of the template
       above — so it had to travel with it, and once it had travelled there was
       nothing left on index.html for it to wire: no #el-jump, and no
       `pdx:locker:mounted` event, because _mount() cannot succeed on a document
       with no template. It is deleted there.

       It is the definer of window.rebuildEvidenceNav, which the engine's
       _render() and _setView() call after every filter change and tab switch, so
       a document with the workspace and without this script would have a pill
       bar whose counts never move. Wired on `pdx:locker:mounted` for the same
       reason it always was: there is no #el-jump to wire until _mount() has
       cloned the template.

       scripts/test-evidence-shell.mjs asserts this block is here AND that
       index.html no longer carries it, so the two cannot drift back apart.
       ══════════════════════════════════════════════════════════════════════ -->
  <script>
  // ════════════════════════════════════════════════════════════
  // EVIDENCE LOCKER — QUICK-JUMP NAV (sticky map + scroll-spy)
  // Powers the #el-jump pill bar under the locker's header/tabs. Gates any pill
  // whose target block is missing or empty, keeps the live counts (Categories,
  // All Evidence) fresh, smooth-scrolls on click (respecting prefers-reduced-
  // motion), and highlights the section currently in view. The locker's render
  // path (_render → filters/sync) and tab switcher (_setView) call the exposed
  // window.rebuildEvidenceNav() so counts + gating track content changes:
  // new receipts, filter/search changes, cross-device sync merges, tab switches.
  // Scoped to #evidence-locker; no external dependencies.
  //
  // WIRED ON MOUNT, NOT ON ARRIVAL. The pill bar lives inside the locker
  // workspace, which is now inert markup in a <template> until the door opens —
  // so there is no #el-jump to wire while the door is shut, and a one-shot
  // lookup at parse time would leave rebuildEvidenceNav() undefined forever.
  // setup() therefore runs on the `pdx:locker:mounted` event that _mount()
  // fires, is idempotent (one wiring per nav element), and still runs eagerly
  // once at parse time so nothing changes for a page that already has the bar.
  // ════════════════════════════════════════════════════════════
  (function () {
  function setup() {
    const nav = document.getElementById('el-jump');
    if (!nav || nav.__pdxJumpWired) return;
    nav.__pdxJumpWired = true;
    const pills = Array.from(nav.querySelectorAll('.el-jump-pill'));
    const reduceMotion = () =>
      !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    // A target "has content" when it exists and is actually rendered (not inside
    // a hidden tab/collapsed showcase). Two targets also carry a live count that
    // must be > 0 to matter: Categories (chips) and All Evidence (visible cards).
    function targetInfo(id) {
      const el = document.getElementById(id);
      if (!el) return { el: null, count: null, hasContent: false };
      const rendered = el.getClientRects().length > 0 || el.offsetParent !== null;
      if (id === 'el-results') {
        const n = el.querySelectorAll('.el-card').length;
        return { el, count: n, hasContent: rendered && n > 0 };
      }
      if (id === 'el-quickcats') {
        const n = el.querySelectorAll('.el-qc').length;
        return { el, count: n, hasContent: rendered && n > 0 };
      }
      return { el, count: null, hasContent: rendered };
    }

    let visiblePills = [];

    // (Re)build: show only pills with real targets, refresh the live counts, and
    // reveal the bar only when there are at least two places to jump to — a
    // one-item map isn't worth the space (non-intrusive self-gating). When the
    // locker is on another tab (All Evidence view hidden) every target gates out,
    // so the bar hides itself entirely.
    function build() {
      visiblePills = [];
      pills.forEach(pill => {
        const info = targetInfo(pill.dataset.target);
        pill.hidden = !info.hasContent;
        if (info.hasContent) visiblePills.push(pill);
        const c = pill.querySelector('[data-count]');
        if (c && info.count != null) c.textContent = info.count;
      });
      nav.hidden = visiblePills.length < 2;
    }

    function setActive(pill) {
      pills.forEach(p => {
        const on = p === pill;
        p.classList.toggle('is-active', on);
        if (on) p.setAttribute('aria-current', 'true');

    }

    // measured --pdx-chrome — keeps the landing clear of the fixed bar. Motion
    // collapses to an instant jump under reduced motion.
    function jumpTo(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
    }

    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        setActive(pill);
        // Keep the scroll-spy's memo in step with a click-driven change, so the
        // spy can never mistake the clicked pill for a state it already applied.
        lastSpyPill = pill;
        jumpTo(pill.dataset.target);
      });
    });

    // Scroll-spy: the active pill is the last visible target whose top has crossed
    // the readable line just beneath the global nav + sticky jump bar.
    var lastSpyPill = null;
    function syncActiveByScroll() {
      if (nav.hidden || !visiblePills.length) return;
      // Same cheap gate as the Mandate rail: one rect read instead of one per
      // pill, so scrolling anywhere outside the Evidence Locker costs nothing.
      var nr = nav.getBoundingClientRect();
      var vh = window.innerHeight || 800;
      if (nr.bottom < -240 || nr.top > vh + 240) return;
      const line = 150; // px from viewport top — just below global nav + jump bar
      let current = visiblePills[0];
      visiblePills.forEach(pill => {
        const el = document.getElementById(pill.dataset.target);
        if (el && el.getBoundingClientRect().top - line <= 0) current = pill;
      });

      // Mandate rail above for why this matters on a document this large.
      if (current === lastSpyPill) return;
      lastSpyPill = current;
      setActive(current);
    }

    let ticking = false;
    window.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(() => { syncActiveByScroll(); ticking = false; });
    }, { passive: true });

    // Rebuild hook — the locker's _render() and _setView() call this after the
    // grid, filters, showcase or active tab change so counts + gating stay current.
    window.rebuildEvidenceNav = function () { build(); syncActiveByScroll(); };

    build();
    syncActiveByScroll();
  }
  document.addEventListener('pdx:locker:mounted', setup);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup);
  else setup();
  })();
  </script>

  <!-- ══ MOVED HERE FROM index.html ═══════════════════════════════════════════
       THE CARD-DENSITY SWITCH, and it is a MOVE rather than a copy. It toggles
       `is-compact` on the results grid (#el-results) and remembers the choice in
       localStorage under pdx-el-density — a preference a reader sets once and
       expects to find again. Both the grid and the .el-density-btn controls are
       elements of the workspace template above, so the only document that can
       ever satisfy this script is this one: on index.html, after the template
       left, `restore()` polled 40 times for an #el-results that can no longer
       exist and the delegated click listener matched nothing. It is deleted
       there and lives here, unchanged, including the `pdx:locker:mounted`
       re-apply — which still matters, because the workspace is a template on
       this document too and the grid does not exist until _mount() clones it.

       scripts/test-evidence-shell.mjs asserts this block is here AND that
       index.html no longer carries it, so the two cannot drift back apart.
       ══════════════════════════════════════════════════════════════════════ -->
  <script>
  /* Evidence Locker density switch — additive, self-contained. Toggles a compact
     layout on the results grid (#el-results) and remembers the choice, so a
     visitor who prefers to scan more per screen isn't stuck scrolling. Uses event
     delegation so it works no matter when the lazily-built locker renders. */
  (function () {
    function apply(mode) {
      var grid = document.getElementById('el-results');
      if (grid) grid.classList.toggle('is-compact', mode === 'compact');
      var btns = document.querySelectorAll('.el-density-btn');
      for (var i = 0; i < btns.length; i++) {
        var on = btns[i].getAttribute('data-density') === mode;
        btns[i].classList.toggle('is-active', on);
        btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
      }
      try { localStorage.setItem('pdx-el-density', mode); } catch (e) {}
    }
    document.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest && e.target.closest('.el-density-btn');
      if (!btn) return;
      apply(btn.getAttribute('data-density') || 'comfortable');
    });
    function restore(tries) {
      var saved = null;
      try { saved = localStorage.getItem('pdx-el-density'); } catch (e) {}
      if (saved !== 'compact') return;              // comfortable is the default
      if (document.getElementById('el-results')) { apply('compact'); return; }
      if ((tries || 0) < 40) setTimeout(function () { restore((tries || 0) + 1); }, 250);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { restore(0); });
    else restore(0);
    // The grid only exists once the locker workspace is mounted, which may be
    // long after those retries gave up — so re-apply the saved density the
    // moment the door opens.
    document.addEventListener('pdx:locker:mounted', function () { restore(0); });
  })();
  </script>

       unguarded global reads in evidence-locker.js. _elStancePill (line 3256)
       and _issueFocusStanceChip (line 3850) both call
       window.PDXStance.stancePill(window.PDXStance.resolveStance(…)) with no
       `typeof` check and no try/catch, so its absence is not a missing pill —
       it is a TypeError inside a render pass, which takes the receipt card with
       it. It is an inline copy rather than a shared file for the same reason
       spotlight.html, person.html and stances.html carry one: index.html
       declares it inline, mid-document, and moving it into a script file there
       would change the order it runs in relative to everything that reads it on
       the front page. This split does not touch index.html's copy.

       scripts/test-evidence-shell.mjs pins this block to index.html's line for
       line, so a fix applied to one document cannot silently skip the other.
       ══════════════════════════════════════════════════════════════════════ -->
  <script>
  // ── PDXStance — shared canonical stance language (single source of truth) ────
  // Lifted out of the Issue Spotlight "Who Stands Where" module so every surface
  // (Profile Key Issue Stances, Compare, My Priorities, Hot Topics, Evidence
  // Locker) can speak the exact same four-state language instead of maintaining
  // its own divergent copy. Read-only over existing stance records — no new data.
  //
  // Four canonical states (LOCKED — do not add a fifth):
  //   supported → teal   #4fd6b3   "Supported"
  //   opposed   → orange #ff9d84   "Opposed"
  //   mixed     → amber  #f3cb5c   "Mixed / Nuanced"
  //   none      → gray   #a4b4cc   "No Clear Position"
  //
  // Legacy/older vocabularies collapse into these on resolution:
  //   "Researching" / "On record" / tracking / unknown / missing → none
  //   "Top Priority" is NOT a stance color — it is a separate emphasis marker,
  //   surfaced via PDXStance.isTopPriority() (the visual star is handled later).
  //
  // The pill markup + colors mirror the .pdxis-stance-* CSS exactly, so callers
  // get the calm Who Stands Where look (thin border, low-saturation fill, small
  // "STANCE" caption + color dot) for free.
  (function () {
    'use strict';
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Canonical state definitions. `cls` maps to the .pdxis-stance-<cls> CSS.
    // `color` is the accent (dot + text); `fill`/`border` mirror that CSS so a
    // surface building bespoke markup can match Who Stands Where without guessing.
    var STATES = {
      supported: { key:'supported', label:'Supported',         cls:'supported', color:'#4fd6b3', fill:'rgba(45,212,164,.13)', border:'rgba(45,212,164,.42)' },
      opposed:   { key:'opposed',   label:'Opposed',           cls:'opposed',   color:'#ff9d84', fill:'rgba(248,113,90,.13)', border:'rgba(248,113,90,.42)' },
      mixed:     { key:'mixed',     label:'Mixed / Nuanced',   cls:'mixed',     color:'#f3cb5c', fill:'rgba(245,193,66,.13)', border:'rgba(245,193,66,.42)' },
      none:      { key:'none',      label:'No Clear Position', cls:'none',      color:'#a4b4cc', fill:'rgba(140,156,182,.1)', border:'rgba(140,156,182,.3)' }
    };
    var ORDER = ['supported', 'opposed', 'mixed', 'none'];

    // Raw string → canonical key. Recognizes the canonical keys/labels plus the
    // legacy vocabularies scattered across the older renderers (posMeta,
    // _prioStanceDir, STANCE_META, _POL_STANCE_META). Returns null when nothing
    // matches so callers can fall through before defaulting to `none`. Note:
    // "Top Priority"/"priority" deliberately do NOT resolve here — they are
    // emphasis, not a stance (see isTopPriority).
    var ALIASES = {
      'supported':'supported', 'support':'supported', 'supports':'supported', 'for':'supported', 'yes':'supported', 'favor':'supported', 'favors':'supported',
      'opposed':'opposed', 'oppose':'opposed', 'opposes':'opposed', 'against':'opposed', 'no':'opposed',
      'mixed':'mixed', 'nuanced':'mixed', 'mixed / nuanced':'mixed', 'mixed record':'mixed', 'partial':'mixed', 'conditional':'mixed', 'complicated':'mixed',
      'none':'none', 'no clear position':'none', 'no position':'none', 'unknown':'none', 'unclear':'none',
      'researching':'none', 'tracking':'none', 'on record':'none'
    };
    function _norm(raw) {
      if (raw == null) return null;
      var v = String(raw).trim().toLowerCase();
      if (!v) return null;
      if (STATES[v]) return v;
      return Object.prototype.hasOwnProperty.call(ALIASES, v) ? ALIASES[v] : null;
    }

    // resolveStance(record[, override]) → one of the four canonical keys.
    // `record` may be a stance record ({issueStance|pos|stance|text}) or a raw
    // string. `override` (optional) is an explicit stance pinned by the surface
    // (e.g. a Spotlight person's `stance`) and wins when recognized. Mirrors the
    // original Who Stands Where derivation exactly:
    //   explicit override → issueStance/pos → any sourced text ⇒ mixed → none.
    function resolveStance(record, override) {
      var o = _norm(override);
      if (o) return o;
      if (record == null) return 'none';
      if (typeof record === 'string') { return _norm(record) || 'none'; }
      var raw = record.issueStance || record.pos || record.stance || record.dir || '';
      var n = _norm(raw);
      if (n) return n;
      if (record.text) return 'mixed';   // a sourced position we can't cleanly classify
      return 'none';
    }

    // Full state descriptor for a record/key (label, cls, color, fill, border).
    function stanceState(keyOrRecord) {
      var key = (typeof keyOrRecord === 'string' && STATES[keyOrRecord])
        ? keyOrRecord
        : (STATES[_norm(keyOrRecord)] ? _norm(keyOrRecord) : resolveStance(keyOrRecord));
      return STATES[key] || STATES.none;
    }

    // original Who Stands Where markup. Accepts a canonical key or a raw record.
    function stancePill(keyOrRecord) {
      var s = STATES[keyOrRecord] || stanceState(keyOrRecord);
      return '<span class="pdxis-stance pdxis-stance-' + s.cls + '" title="Position on this issue: ' + esc(s.label) + '">' +
        '<span class="pdxis-stance-dot" aria-hidden="true"></span>' +
        '<span class="pdxis-stance-k">Stance</span>' + esc(s.label) + '</span>';
    }

    // Emphasis marker, kept strictly separate from the stance color. Detects the
    // legacy "Top Priority" flag/label so surfaces can render a star later without
    // polluting the four-state stance vocabulary.
    function isTopPriority(record) {
      if (record == null) return false;
      if (record === true) return true;
      if (typeof record === 'object') {
        if (record.priority === true || record.topPriority === true) return true;
        record = record.priority || record.emphasis || record.stance || record.tag || record.pos || '';
      }
      return /top\s*priority/i.test(String(record));
    }

    window.PDXStance = {
      STATES: STATES,          // canonical state definitions (label/cls/color/fill/border)
      ORDER: ORDER,            // stable render order of the four states
      resolveStance: resolveStance,
      stanceState: stanceState,
      stancePill: stancePill,
      normalize: _norm,        // raw string → canonical key or null
      isTopPriority: isTopPriority,
      esc: esc
    };
  })();
  </script>

  <!-- ══ COPIED VERBATIM FROM person.html LINES 2006–2030 (= index.html 2012–2035)

  <!-- ══ THE SEAMS ═══════════════════════════════════════════════════════════
       A document boundary is only real if every in-page gesture that used to
       move a reader inside index.html now moves them to an ADDRESS. The
       workspace's taps were written against homepage globals — a profile modal,
       a bill detail panel, a Full Stance Record overlay, a sign-in modal — and
       every one of those reads is `typeof f === 'function'` or `X && typeof
       X.open === 'function'` guarded, which is exactly what makes them
       redefinable here.

       The seams are installed THREE TIMES — now, on DOMContentLoaded and on
       load — for the reason ballot.html states for its own: the modules below
       are deferred, they execute after this inline script, and if any of them
       ever assigns one of these names, the later passes take it back. A seam
       installed once is a seam that a future script load can quietly remove.

       WHAT IS DELIBERATELY NOT SEAMED. window._pdxOpenEvidenceLocker is NOT
       redefined here — evidence-locker.js itself owns that name on this
       document, and the engine's own in-page deep links (a category header, an
       issue chip) have to keep filtering THIS grid rather than navigating to
       the address they are already standing at. The same is true of
       PDXEvidenceLocker.

       location.assign(), never history.replaceState(): these are real trips to
       real documents, so Back has to come back here.
       ═══════════════════════════════════════════════════════════════════ -->
  <script>
  (function () {
    'use strict';

    function go(to) {
      if (!to) return false;
      try { location.assign(to); return true; } catch (e) {}
      try { location.href = to; return true; } catch (e2) {}
      try { location.replace(to); return true; } catch (e3) {}
      return false;
    }

    // ── SEAM 1 — a person is an address ───────────────────────────────────
    // Every receipt names somebody, and the locker's person links call
    // openModal(pid) (or the older showProfile spelling). There is no profile
    // modal on this document, so both become the navigation the modal was
    // always a preview of. closeModal is a real no-op rather than absent
    // because _pdxOpenEvidenceLocker calls it before applying a filter, and a
    // missing function there would throw inside a click handler and eat the tap.
    function seamPerson() {
      var open = function (id, ev) {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        var pid = id ? String(id) : ''; if (!pid) return false;
        var to = '';
        try {
          var PL = window.PDXPersonLink;
          if (PL && typeof PL.href === 'function') to = PL.href(pid) || '';
        } catch (e) {}
        if (!to) to = '/p/' + encodeURIComponent(pid);
        return go(to);
      };
      window.openModal = open;
      window.showProfile = open;
      window.closeModal = function () {};
      // The single-politician context header's "Back to … Full Stance Record"
      // button (engine line 4137) reopens an overlay that layers above the
      // profile modal. Neither exists here, so the honest answer to "back to
      // their record" is their record: the person file, which is where the Full
      // Stance Record's own contents now live.
      window._pdxOpenStanceRecord = open;
      window._pdxCloseStanceRecord = function () {};
    }

    // ── SEAM 2 — a measure is an address ──────────────────────────────────
    // The workspace's bill doors (data-el-bill) try PDXBillDetail.open first and
    // fall back to PDXBills.open. Neither module ships here — bill-detail.js is
    // a panel and bills.js's own fallback opens the source PDF in a new tab,
    // which is not the bill's PolitiDex record. /b/<number> IS that record, and
    // it is spelled here exactly as share-links.js spells it (line 361):
    // sitting first when there is one, because a bill number repeats every
    // congress and every state session, and dropping the sitting is what makes
    // two different measures share a link.
    function billHref(ref, sitting) {
      var n = String(ref == null ? '' : ref);
      if (!n) return '';
      var sit = String(sitting == null ? '' : sitting);
      return '/b/' + (sit ? encodeURIComponent(sit) + '/' : '') + encodeURIComponent(n);
    }
    function seamBills() {
      // PDXBillDetail is the name the engine reaches for FIRST, so defining it
      // is what makes a bill tap one navigation instead of two guesses.
      window.PDXBillDetail = {
        open: function (ref, sitting) { return go(billHref(ref, sitting)); },
        close: function () {}
      };
      window.PDXBills = {
        open: function (ref, sitting) { return go(billHref(ref, sitting)); },
        url: billHref
      };
    }

    // ── SEAM 3 — the asks this document cannot answer ─────────────────────
    // openAuthModal is the sign-in gate behind "save this receipt to a
    // collection" (engine line 4059). There is no account UI here and stubbing
    // one would be a lie: a button that opens nothing is better than a button
    // that pretends to sign somebody in. So it is a trip to the front page,
    // where the real modal lives, and the collections lane itself keeps working
    // locally — _saveColls() writes through PDXStore when present and falls back
    // to localStorage, so a signed-out reader's collections persist in this
    // browser exactly as they did on the homepage.
    function seamAccount() {
      window.openAuthModal = function () { return go('/#account'); };
    }

    // ── SEAM 4 — the hashes that used to land somewhere ───────────────────
    // #evidence-locker is THIS document (the engine's _wantsLocker reads it and
    // _wireRoutes re-opens on it), so it is deliberately absent from the table.
    // The rest are homepage sections reachable from the workspace's cross-links,
    // and #stance-library is the other room.
    var HASH_HOME = { 'open-forum': 1, 'agenda': 1, 'issue-front-door': 1, 'all-spotlights': 1 };
    function onHash() {
      var h = String(location.hash || '').replace(/^#/, '');
      if (!h) return;
      if (h === 'stance-library') { go('/stances'); return; }
      if (h === 'all-spotlights') { go('/stances#all-spotlights'); return; }
      if (HASH_HOME[h]) { go('/#' + h); return; }
    }

    function seams() { seamPerson(); seamBills(); seamAccount(); }

    seams();
    document.addEventListener('DOMContentLoaded', seams);
    window.addEventListener('load', seams);
    // Registered AFTER evidence-locker.js's own hashchange listener would be, so
    // #evidence-locker still reaches _wireRoutes first; this one only acts on the
    // hashes that are not this document.
    window.addEventListener('hashchange', onHash);
    document.addEventListener('DOMContentLoaded', onHash);

    // The wordmark and the Home chip are already real anchors; these handlers
    // exist only so a modified click (cmd/ctrl/shift/alt, middle button) keeps
    // the browser's own behaviour instead of being swallowed.
    ['pdx-ev-home', 'pdx-ev-home-mark'].forEach(function (id) {
      var a = document.getElementById(id);
      if (!a) return;
      a.addEventListener('click', function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
        e.preventDefault(); go('/');
      });
    });
  })();
  </script>
