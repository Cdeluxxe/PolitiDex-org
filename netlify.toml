# `netlify database status` for this site answers "No database branch found for
# agent-6a9e3b6a78a2173787bd8c9a", so once again CREATION is what returns 500 rather
# than a re-request of a live or half-built branch. And branch_id is the deploy ALIAS
# — the agent session id — so it is the same value on every retry inside this session,
# which is why the correction further up this file matters: the clean-deploy touch is
# right for the upload and timeout failures, and it cannot move this stage. That is
# still where the lever is missing: @netlify/config exposes exactly one database key,
# database.migrations.path, and there is no provisioning opt-out, retry knob or
# context override to set. This edit is the clean-deploy touch and this block is its
# audit trail.

# Ninth occurrence, same session alias, same stage, same 500 — and this pass read the
# call site line by line instead of trusting the block above it. The step is
# @netlify/build 36.4.6's `db_provision` core step (plugins_core/db_setup/index.js).
# Its whole body is: resolve the migrations directory, read its entries, log their
