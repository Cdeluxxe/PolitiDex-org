#     standalone version-8 snapshot carrying no prevId, so hand-setting the directory
#     stamp to 20261029000000 breaks no drizzle linkage. The stamp is one version after
#     the current tail (20261028000000_vr_federal_wave_f11) because `drizzle-kit generate`
