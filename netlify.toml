# agent-<session>", so creation is what 500s, not a re-request of a live branch.
# @netlify/config exposes exactly one database key, database.migrations.path;
# there is no provisioning opt-out, no retry knob and no context override to set.
# Conclusion unchanged and now source-backed: no repo-side lever exists on this
