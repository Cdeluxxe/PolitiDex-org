# statements are applied later and elsewhere; even copying them into the deploy is a
# separate onBuild step (db_migrations_copy) that this build never reached.
#
# The phase-0 changed set was re-verified here rather than declared innocent:
#   • The migration tree, with the new directory in it, passes Netlify's OWN validator
