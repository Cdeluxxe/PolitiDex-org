# Netlify build configuration.
#
# Deploy note: a prior preview deploy hit a transient upload-stage error
# (HTTP 422 "no records matched" during onPostBuild → tryUpload) — a deploy
# file-digest/manifest mismatch on the incremental upload, unrelated to the app
# code or the database migrations (which applied cleanly). Touching this config
# forces a clean full deploy, so the file set is re-uploaded from scratch rather
# than reconciled against a stale prior-deploy manifest.
#
# Follow-up (state-senate wave 9): a preview then failed at the Netlify Database
# setup stage — "createSiteDatabaseBranch" returned HTTP 500 "internal error"
# while provisioning the deploy's branch database. This is a server-side failure
# of Netlify's managed-database provisioning API, not a repo defect:
#   • Wave 9 added no migrations, schema, or db/ changes — only a client-side
#     stance-data file (state-senate-stances-w9.js) and one <script> tag.
#   • The full migration set (50 files) loaded and listed cleanly. It was audited
#     after this failure: none were edited after being applied, there are no
#     duplicate timestamp prefixes, every create is guarded (IF NOT EXISTS /
#     NOT EXISTS sentinels), ordering satisfies all table dependencies, and no
#     SQL string literal is unbalanced. Nothing in it fails deterministically.
# Each deploy already provisions a brand-new branch (branch_id = agent-<deployId>),
# so this is not a stale/half-created-branch problem and no config change alters
# the provisioning path — the resolution is simply to re-run the deploy, which the
# platform does automatically on the next build. This block is documentation only.
#
# Follow-up (word-vs-action scope-clarity pass): a preview failed a third time,
# again after the app itself had built. Both bundlers finished — "Functions
# bundling completed in 2.7s", "Edge Functions bundling completed in 827ms" — and
# the failure landed in the same post-build stage as the first note above:
#
#   Internal error during "options.onPostBuild"
#   TimeoutError: Timeout while waiting for deploy
#     at waitForDeploy (netlify-cli/dist/utils/deploy/util.js)
#
# waitForDeploy polls the deploy record until Netlify reports it ready. A timeout
# there means the upload was accepted and the platform did not finish processing
# it in the window — it is not a compile, bundle, lint or migration failure, and
# there is no repo-side stack frame in it. The changed set was audited after the
# failure rather than assumed innocent:
#   • The pass touched four files — word-action.js, word-action.css and two test
#     files. No data file, no migration, no function, no edge function, no
#     index.html script tag. Nothing in the deployed surface area moved.
#   • word-action.js parses (`node --check`), word-action.css balances (199/199),
#     and the full suite is green, including the two suites that own this
#     surface: test-word-action.mjs (371 assertions) and test-exec-word-action.mjs
#     (708 checks).
#   • The publish set is 613 tracked files, largest 2.0M (index.html). No
#     artifact, bundle or generated blob was added, so there is nothing here that
#     could plausibly stretch deploy processing past its deadline.
#   • The migration set applied and listed cleanly, including the newest
#     (20260902000000_seed_exec_actions_wave10.sql).
# The remedy is the one at the top of this file: touching this config forces a
# clean full deploy, so the file set is re-uploaded from scratch instead of being
# reconciled against the timed-out deploy's partial manifest. This edit is that
# touch, and the note is the audit trail for it.
#
# Secret scanning: the Firebase Web API key shipped in index.html is a PUBLIC
# client identifier (access to Firebase is controlled by Security Rules, not by
# keeping this value secret — Google documents it as safe to include in client
# code). Netlify's smart secret detection would otherwise flag the "AIza…" string
# as a likely secret and fail the build, so we safelist that one value here.
# All other secret-scanning protections remain active.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDNkLuB8wmLuz38dfL8ZP6rvnv-efZvnyU"

# Issue Spotlight deep-links. The whole app is a single index.html, so a clean,
# shareable path like /issue/box-elder-stratos-data-center must serve that same
# document (HTTP 200 rewrite, not a redirect) and let the client-side router read
# the slug from location.pathname. Scoped to /issue/* only, so every other asset
# (/, /css/*, /netlify/*, the Functions) keeps its normal routing.
[[redirects]]
  from = "/issue/*"
  to = "/index.html"
  status = 200

# Shareable roll-call deep-links. A clean path like
# /vote/119/house/190 must serve the same single-page document (HTTP 200 rewrite)
# so the client-side router can read the congress/chamber/roll from the path and
# open the corresponding measure. Scoped to /vote/* only, leaving every other
# route (assets, /api/*, the Functions) untouched.
#
# This rewrite ALONE used to be the whole story, and that was the bug: nothing in
# the app ever read the path, so every /vote/… link returned HTTP 200 and quietly
# showed the front page — a citation that looks like it worked and didn't. The
# rule stays (it is what serves the document), but the edge function
# netlify/edge-functions/share-preview.ts now runs in front of it and gives it
# meaning: it resolves the roll call against the voting-record API, hands the
# client the measure to open, and returns an honest 404 when the roll call is not
# one we hold. Lookup failures other than a definitive 404 still fall through to
# this rewrite, so a slow database degrades to the old behaviour rather than to a
# broken link.
[[redirects]]
  from = "/vote/*"
  to = "/index.html"
  status = 200

# Person-file deep-links. Phase 1 gave the politician profile a durable address
# of its own: /p/<pid>. Same arrangement as /issue/* above — the whole app is one
# index.html, so a citable path like /p/celeste_maloy must SERVE that document
# (HTTP 200 rewrite, not a redirect) and let person-file.js read the pid out of
# location.pathname and open the file.
#
# The pid, not a name slug: a name in a URL is a claim nothing on arrival can
# check, and the pid is the identifier the roster, the stance corpus, the
# voting-record API and every existing share link already agree on. Every id in
# the roster is [a-z0-9_]+, which is pinned by scripts/test-person-file.mjs so a
# future id that would need escaping fails a test instead of shipping a broken
# address.
#
# The old ?p=<pid> form is NOT retired by this — it still resolves, because links
# of that shape are already in the wild. What changed is which of the two
# canonicalises: netlify/lib/share-target.ts now returns /p/<pid> for a profile,
# so the same record reached either way declares one address.
#
# As with /vote/*, the rewrite alone would be a trap: it returns HTTP 200 for
# every /p/<anything>, including ids we hold no record for. The edge function
# netlify/edge-functions/share-preview.ts runs in front of it (its config lists
# /p/*) and gives the path meaning — record-specific title, description, card and
# canonical — and person-file.js says so out loud on arrival when the pid does not
# resolve, rather than showing the front page to someone who followed a citation.
[[redirects]]
  from = "/p/*"
  to = "/index.html"
  status = 200

# Issue-file deep-links. The third durable address, on exactly the terms /p/<pid>
# got its own: /i/<key> SERVES this document (HTTP 200 rewrite, not a redirect) so
# pdx-issue-profile.js can read the key out of location.pathname and mount the
# issue ledger Door 1 already paints.
#
# WHY IT DID NOT EXIST BEFORE, AND WHY THAT WAS THE BUG. Door 1's issue mode has
# painted the child ledger for a while — the Core → Child crumb, the census, the
# five formal-pattern bands, the measures on file — and seek, OPEN and a chip tap
# all mount it. None of them produced a citation. There was no /i/lands_preserve,
# so the Eye's own issue hit, the person file's topic tree and every share control
# could point at a person, a bill or a roll call and never at THE ISSUE. An
# accountability app whose issue reading has no address is one nobody can cite.
#
# The key, not a label slug: `lands_preserve` is the identifier ISSUE_MAP, the
# parent table in alignment-tool.js, the measure mappings and the formal-pattern
# index all already agree on, and a prettier slug would be a second name for the
# same thing. An address that spells the label instead still resolves — the
# desk's own resolver reads it — and re-stamps the bar with the key, so one
# reading declares one address.
#
# NO EDGE FUNCTION STANDS IN FRONT OF THIS ONE, unlike /p/*, /b/* and /vote/*.
# That is a deliberate limit of this pass rather than an oversight: share-preview
# gives those paths a record-specific title, card and honest 404, and doing the
# same here means resolving a key server-side against the generated index. Until
# that lands, the rewrite answers 200 for /i/<anything> — so the CLIENT is where
# the honesty has to live, and pdx-issue-profile.js says out loud on arrival when
# the register carries no key by that name instead of showing the front page to
# someone who followed a link. Sitemap entries for the register's keys are left
# to that same later pass, for the same reason: an address a crawler is invited
# to should have a head written for it first.
[[redirects]]
  from = "/i/*"
  to = "/index.html"
  status = 200

# Bill-profile deep-links. The third face of the archive gets the same treatment
# the person file got: /b/<sitting>/<number> — /b/119/H.R.%201 for a federal
# measure, /b/2024GS/H.B.%20257 for a state one — SERVES index.html (HTTP 200
# rewrite) so share-links.js can read the path and open the bill panel on it.
#
# The sitting leads because a bill number alone is not an identity: "H.B. 257"
# names a different bill in every Utah general session, which is exactly why the
# ingest keys state rows on (chamber, number, external_ids->>'utahSession') rather
# than on a congress the rows do not have. /b/<number> without a sitting still
# resolves, for a number that is unambiguous across the whole archive.
#
# The older ?bill=<sitting>/<number> form is NOT retired — those links are in the
# wild and share-links.js still reads them. What changed is which of the two
# canonicalises: netlify/lib/share-target.ts now returns /b/… for a bill.
#
# And as with /vote/* and /p/*, the rewrite alone would be a trap — it answers 200
# for /b/<anything>. share-preview.ts runs in front of it (its config lists /b/*)
# to give the path a real card, and share-links.js posts an honest notice on
# arrival when the address opened nothing.
[[redirects]]
  from = "/b/*"
  to = "/index.html"
  status = 200

# The Evidence Locker's own address. The locker used to be a permanently-open
# section of the front page, which meant it had no address of its own and cost
# every reader its whole height whether they opened it or not. It is now a closed
# door on the homepage that mounts on request, so it needs a path a link can point
# at: /locker SERVES index.html (HTTP 200 rewrite, not a redirect) and
# evidence-locker.js reads location.pathname on arrival and opens the workspace
# instead of the door.
#
# No edge function stands in front of this one, and it needs none: unlike /p/* or
# /b/*, the path names no record — there is nothing to resolve and nothing to get
# wrong. /locker is one page that always exists, so a 200 here is the truth.
#
# The in-app #evidence-locker hash is NOT retired by this: every nav entry, issue
# chip and profile deep-link already sets it, and all of them still open the same
# workspace. What /locker adds is a shareable, server-visible form of the same
# address for a reader who wants to send someone the locker itself.
[[redirects]]
  from = "/locker"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/locker/*"
  to = "/index.html"
  status = 200

# Portrait hosts the Image CDN may fetch from.
#
# This exists for ONE caller: the shareable record card (profile-card.js). Every
# other surface renders a portrait in an <img>, where a cross-origin host costs
# nothing. A canvas is different — a cross-origin bitmap taints it, and toBlob()
# then throws at the moment the reader taps share, on a device we never see. So
# the card loads its face through /.netlify/images, which is our own origin, and
# these are the hosts that proxy is allowed to resolve on its behalf.
#
# The set is exactly the six trusted portrait hosts scripts/test-photo-coverage.mjs
# already pins for BROWSE_PHOTOS, and for the same reason it gives: a new host is a
# new availability and a new trust dependency for faces on an accountability app.
# Widen it deliberately, in both places, or not at all. A host that is not here
# 404s, which the card handles the same way it handles a dead network — it draws
# the monogram.
[images]
  remote_images = [
    "https://raw\\.githubusercontent\\.com/.*",   # unitedstates/images — official congressional portraits
    "https://upload\\.wikimedia\\.org/.*",        # Wikimedia Commons, hashed thumb form (legacy)
    "https://commons\\.wikimedia\\.org/.*",       # Wikimedia Commons, hash-independent Special:FilePath
    "https://bioguide\\.congress\\.gov/.*",       # official Bioguide portraits
    "https://le\\.utah\\.gov/.*",                 # official Utah legislature portraits
    "https://insurance\\.utah\\.gov/.*"           # official Utah agency portrait
  ]

# PWA service worker must never be served stale, or clients get stuck on an
# old worker and miss shell updates. Force revalidation on every request.
# (The worker versions and prunes its own caches internally.)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The web app manifest changes rarely; a short cache keeps it reasonably fresh.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
