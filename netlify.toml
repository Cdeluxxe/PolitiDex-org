# The provisioning API was probed again from the sandbox and answers exactly as the
# earlier notes record: `netlify database status` says "No database branch found for
# agent-6a9e3b6a78a2173787bd8c9a", so CREATION is what returns 500 rather than a
# re-request of a live or half-built branch, and both getSiteDatabase and
# listSiteDatabaseBranches answer Unauthorized, so the branch inventory cannot be read or
# pruned from inside a build. branch_id is the deploy ALIAS — the agent session id — so it
