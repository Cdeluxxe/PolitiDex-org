# ═════════════════════════════════════════════════════════════════════════════
# THE DISTRICT FINDER GETS ITS OWN DOCUMENT: /find -> find.html
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS ADDRESS FIXES, AND IT IS NOT THE MAP. The finder's two own defects —
# a keyed Carto basemap and a modal that fetched and painted 75 State House
# polygons just to open — were fixed in place, and the freeze stayed. It had to,
# because the third cause was never in the map controller: the finder's HOST was
# index.html. Every "Change on map", every "set my location", every empty-state
# control on /voice pointed at /#who-represents-me, so a location tap meant
# parsing 1.6 MB of front page — hero, Door 1's work layer, the Evidence Locker
# template, the ballot workspace, the archive listings — before the picker could
# move, and then rebuilding all of it BEHIND the modal covering the page being
# rebuilt. PDXFinder's gate could defer that rebuild. Nothing could un-parse the
# document.
#
# So the picker is a document. /find carries the location modal, the map modal
# and the controller that used to sit in the front page's body, and index.html
# now carries none of them: no Leaflet, no UGRC layer fetch, no district-map
# controller. A location tap costs the finder.
#
# SAME SHAPE AS /mandate, /voice AND /money, ON THE PATTERN /me AND /courts SET:
# no app.css, no compare-hub.js, no ballot-breakdown.js, no cmp-data.js, no
# roster, no Key Races, no Door 1 work layer, no ballot workspace and no
# homepage hero. It loads voter-hub-location.js — which is the whole point, that
# file being the ONE owner of the location record, the modal gate, the geocode
# ceiling and pdxRepsForMe() — the shared bar sheet, and the smallest auth
# surface that can answer "is somebody signed in", which is shell-account-chip.js
# at 9 KB against compare-hub.js's 758 KB.
#
# /#who-represents-me IS NOT BEING REPLACED AND IS NOT AN ALIAS FOR THIS. The
# band on the front page is where a reader READS their seats, and it still is —
# its reps list, its location header and its ballot band never moved, and the nav
# rows across the app still point at it. /find is where a location is SET. Two
# different jobs that happened to share a document, and the sharing was the bug.
# Which is also why there is no redirect from the fragment: a fragment never
# reaches the server, so the forwarding is done by the controls themselves, each
# of which now points at this path with its return intent in the query.
#
# WHY THIS SPELLING AND NO SECOND ONE. /find is the whole set. No /finder, no
# /districts, no /district-finder, no /who-represents-me and no alias for any of
# them: two live 200 spellings of one document split the canonical, which is the
# ambiguity the /locker -> /evidence 301 below exists to remove. The return
# intent is a QUERY (/find?next=/voice, whose value PDXReturn holds to an
# allow-list of /, /voice, /me, /ballot and /district/<slug>), never a segment,
# so there is nothing for a /find/* rule to answer and none is declared.
#
# ORDER: TWO EXACT PATHS, NO PREFIX, NO SPLAT — AND THE POSITION IS A STATED
# NO-OP, on the same terms as /me, /courts and the three lanes above. Both are
# disjoint by inspection of the literal strings from /p/*, /i/*, /issue/*,
# /ballot, /me, /stances, /evidence, /courts, /mandate, /voice, /money,
# /community, /vote/*, /d/*, /b/* and /locker, so declaring them here is correct
# and would also have been correct anywhere else in the file. THE INVARIANT
# WRITTEN DOWN FOR THE NEXT PERSON TO ADD A RULE ABOVE: nothing that matches
# /find or /find/ may be declared earlier, and the day a prefix rule or a
# catch-all appears — an SPA "rewrite everything to index.html" is the one that
# would silently eat both — these exact paths must stay in front of it.
# scripts/test-finder-basemap.mjs asserts this pair is present, is a 200, points
# at find.html, and is not preceded by anything that matches it.
# ═════════════════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/find"
  to = "/find.html"
  status = 200

# The trailing-slash form, declared rather than left to a redirect, so a pasted
# /find/ is the finder instead of a hop. It is ALSO why every same-origin path
# inside find.html is root-absolute, with no exceptions: served at /find/, a
# bare src="voter-hub-location.js" resolves to /find/voter-hub-location.js, this
# rule answers that with the HTML document, the browser parses HTML as
# JavaScript, and the reader gets a finder that cannot find anything and no error
# that names the cause. scripts/test-finder-basemap.mjs fails the build if a
# relative same-origin path ever appears in that document.
[[redirects]]
  from = "/find/"
  to = "/find.html"
  status = 200

# ═════════════════════════════════════════════════════════════════════════════
# THE TWO COMMUNITY TRACKS GET ONE DOCUMENT
#   /community -> community.html
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS ADDRESS FIXES. The Community Evidence Exchange and the Open
# Discussion board were two sections of index.html, each with a ~20 KB inline
# <style> block over it and a ~1,300-line and ~550-line inline controller under
# it. Every reader of a two-megabyte front page paid for all four blocks,
# including the reader who arrived to answer "who represents me" and nothing
# else — and a reader who wanted to post, read a thread, or send someone a
# conversation had nothing to bookmark, nothing to share and nothing that
# survived a reload. #community-exchange and #open-forum were scroll positions,
# not places.
#
# ONE DOCUMENT FOR BOTH, NOT ONE EACH, and that is deliberate. The two tracks
# are defined by their separation — verified vs open, with no promotion path
# from the second into the first — and each section's markup says so and links
# across to the other. Two documents would turn those two cross-links into two
# navigations and would publish two addresses for one idea. They are two <section>s
# on one page, exactly as they were on the front page, and for the first time
# their fragments resolve to elements the reader is actually on.
#
# SAME SHAPE AS /mandate, /voice AND /money, ON THE PATTERN /me AND /courts SET:
# no app.css, no compare-hub.js, no profiles-full.js, no ballot-breakdown.js, no
# alignment-tool.js, no Door 1 work layer, no Evidence Locker template, no Who
# Represents Me card, no ballot workspace and no homepage hero. The room loads
# its own two controllers, the issue vocabulary they label with, the shared bar
# sheet, and the smallest auth surface that can answer "is somebody signed in" —
# shell-account-chip.js, 9 KB against compare-hub.js's 758 KB.
#
# THE FRONT PAGE KEEPS THE DOOR. The Community dropdown stays exactly where it
# was, in the desktop nav and in the mobile menu; its two items point at this
# address instead of at two fragments. Education, Submit a lead and Donate are
# NOT in this move — they are surfaces of / and they stay there.
#
# WHY THIS SPELLING AND NO SECOND ONE. /community is the whole set. No
# /exchange, no /forum, no /community-exchange, no /open-forum and no alias for
# any of them: two live 200 spellings of one document split the canonical, which
# is the ambiguity the /locker -> /evidence 301 below exists to remove. The two
# section fragments and the two query forms (?issue= and ?topic=, which
# community-link.js writes and the controllers read) are the rest of the surface,
# and neither is a path.
#
# THE SPLAT IS HERE ON PURPOSE, AND IT IS THE ONE DIFFERENCE FROM /money. The
# three lanes above are declared as exact pairs because nothing has ever been
# published under them. This room has six modules across the site handing
# intents to it (gaps.js, evidence-locker.js, profiles-full.js,
# spotlight-engine.js, stance-library.js and digital-library.js, all of them
# through community-link.js), plus two section fragments and two query forms, so
# a stray or hand-typed /community/<anything> is a real shape a reader can
# arrive at — and a 404 on the room's own prefix is a worse answer than the room
# itself. The document reads its own query and fragment, so a deeper path lands
# on the boards rather than on nothing. THIS IS ALSO WHY EVERY SAME-ORIGIN PATH
# IN community.html IS ROOT-ABSOLUTE, WITHOUT EXCEPTION: served at /community/,
# a bare src="community-exchange.js" resolves to
# /community/community-exchange.js, this splat answers that with the HTML
# document, the browser parses HTML as JavaScript, and the reader gets two empty
# boards with no error that names the cause.
#
# ORDER: THREE PATHS, AND THE POSITION IS A STATED NO-OP. All three are disjoint
# by inspection of the literal strings from /p/*, /i/*, /issue/*, /ballot, /me,
# /stances, /evidence, /courts, /mandate, /voice, /money, /vote/*, /d/*, /b/* and
# /locker, so declaring them here is correct and would also have been correct
# anywhere else in the file. /api/community and /api/forum are a different prefix
# and are untouched by all three. THE INVARIANT, unchanged from the block above:
# nothing that matches these paths may be declared earlier, and the day a
# catch-all appears — an SPA "rewrite everything to index.html" is the one that
# would silently eat them — these must stay in front of it. There is no
# catch-all in this file today; that is a property to preserve.
# ═════════════════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/community"
  to = "/community.html"
  status = 200

# The trailing-slash form, declared rather than left to a redirect, so a pasted
# /community/ is the room instead of a hop.
[[redirects]]
  from = "/community/"
  to = "/community.html"
  status = 200

# And the prefix, so nothing under the room's own address 404s the document. See
# the note above for why this one lane carries a splat and the other three do
# not.
[[redirects]]
  from = "/community/*"
  to = "/community.html"
  status = 200

# ═════════════════════════════════════════════════════════════════════════════
# THE DIGITAL LIBRARY GETS ITS OWN DOCUMENT
#   /library  -> library.html
#   /library/ -> library.html
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS ADDRESS FIXES. The Digital Library was the section #digital-library
# in the body of index.html: the searchable archive, the collection tiles, the
# type and issue filters and the Legislation tab, plus the ~97 KB controller that
# draws all of it. Every reader of a two-megabyte front page paid for the whole
# warehouse, including the reader who arrived to answer "who represents me" and
# nothing else — and a reader who wanted the archive, or wanted to send someone a
# bill catalog, had nothing to bookmark and nothing that survived a reload.
# #digital-library was a scroll position, not a place. It was also the room whose
# deepest door suffered most for it: "Legislation / Bills" had to select a tab
# inside a section the same page kept re-rendering underneath it, which is why
# that entrance kept landing readers back on the archive.
#
# ONE DOCUMENT FOR THE WHOLE ROOM, NOT ONE PER TAB. Explore and Legislation are
# two modes of ONE controller over one search box and one grid — the tab strip is
# digital-library.js's own, it has always been, and splitting it would publish two
# addresses for one idea and duplicate the module behind both. They are two tabs
# on one page, exactly as they were on the front page, and ?mode=legislation is
# how the nav asks for the second one.
#
# SAME SHAPE AS /money AND /community, ON THE PATTERN /me AND /courts SET: no
# app.css, no /css/tailwind.css, no compare-hub.js, no profiles-full.js, no
# ballot-breakdown.js, no alignment-tool.js, no evidence-locker.js, no
# bill-detail.js, no Door 1 work layer, no Who Represents Me card, no ballot
# workspace and no homepage hero. The room loads the module that draws it, the
# spotlight registry its archive is floored on, the contracts dataset and the
# bills client its two lists read, the issue vocabulary and colour system its
# chips are tinted from, the shared bar sheet, and the smallest auth surface that
# can answer "is somebody signed in" — shell-account-chip.js, 9 KB against
# compare-hub.js's 758 KB. It links no room stylesheet at all, because
# digital-library.js injects its own (#dlib-css) and every class on the document
# is .dlib-*.
#
# THE FRONT PAGE KEEPS THE DOOR. The Explore & Discover menu stays exactly where
# it was, in the desktop nav and in the mobile menu; its "Digital Library" and
# "Legislation / Bills" items point at this address instead of at one fragment.
# The H.R.1 / Omnibus Showcase is NOT in this move — it is a Door 1 surface with
# its own entrances and its own module, and folding a single-measure showcase
# into the catalog of every measure would be a second bill product, which is the
# one thing this pass refuses to build.
#
# WHY THIS SPELLING. /library is the archive and it is the whole set: no
# /archive, no /digital-library, no /bills, no /legislation and no alias for any
# of them, because two live 200 spellings of one room split the canonical — the
# ambiguity the /locker -> /evidence 301 further down exists to remove. Note that
# the /stances block above says "/stances, not /library" — that was a decision
# about what to call the STANCE shelf, made when /library was unclaimed, and it
# is why this name was free. The archive's modes and filters are the query string
# (?mode=, ?q=, ?type=, ?issue=, ?category=, ?phase=, ?sort=, ?followed=, all of
# them read by library.html's arrive seam and handed to the focus() call the room
# already published), and not one of them is a path.
#
# NO SPLAT, AND THAT IS THE DIFFERENCE FROM /community. That room carries
# /community/* because six modules across the site hand it intents and readers
# have published deeper paths under it. Nothing has ever been served under
# /library: the room is new, every door to it is a link this pass wrote, and
# every one of them lands on /library or /library?<query>. An exact pair is the
# honest declaration for that, and a /library/* that answered any depth with this
# HTML would also answer /library/digital-library.js with it — HTML parsed as
# JavaScript, an empty room, and no error naming the cause. EVERY SAME-ORIGIN
# PATH IN library.html IS ROOT-ABSOLUTE REGARDLESS, without exception, so the
# trailing-slash form below is safe and a splat could be added later without
# breaking a single asset.
#
# ORDER: TWO PATHS, AND THE POSITION IS A STATED NO-OP. Both are disjoint by
# inspection of the literal strings from /p/*, /i/*, /issue/*, /ballot, /me,
# /stances, /evidence, /courts, /mandate, /voice, /money, /community*, /vote/*,
# /d/*, /b/* and /locker, so declaring them here is correct and would also have
# been correct anywhere else in the file. /api/* is a different prefix and is
# untouched by both. THE INVARIANT, unchanged from the blocks above: nothing that
# matches these paths may be declared earlier, and the day a catch-all appears —
# an SPA "rewrite everything to index.html" is the one that would silently eat
# them — these must stay in front of it. There is no catch-all in this file
# today; that is a property to preserve.
# ═════════════════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/library"
  to = "/library.html"
  status = 200

# The trailing-slash form, declared rather than left to a redirect, so a pasted
# /library/ is the room instead of a hop. Same root-absolute rule as /money and
# /community: served at /library/, a bare src="digital-library.js" would resolve
# to /library/digital-library.js.
[[redirects]]
  from = "/library/"
  to = "/library.html"
  status = 200

# THE OLD LOCKER ADDRESS, NOW AN ALIAS. /locker was a 200 rewrite to index.html
# from the pass that first put the locker behind a door: the front page was the
# only document that held the workspace, so /locker had to be the front page,
# and evidence-locker.js read location.pathname on arrival to open it. The
# workspace now lives at /evidence, so serving index.html here would hand the
# reader a 2.25 MB document whose grid no longer mounts.
#
# 301, NOT A 200 REWRITE TO evidence.html, and the difference is the point: a
# permanent redirect tells the reader's browser and every crawler that the room
# has exactly one address and /locker is not it. Two live 200 spellings would
# split the canonical, which is the ambiguity this pass removes. The splat form
# is kept for the same reason the exact form is: a /locker/anything link in the
# wild should land in the room, not on a 404, and the query string survives the
# hop untouched, so /locker?issue=lands_preserve still arrives filtered.
[[redirects]]
  from = "/locker"
  to = "/evidence"
  status = 301

[[redirects]]
  from = "/locker/*"
  to = "/evidence"
  status = 301

# ═════════════════════════════════════════════════════════════════════════════
# /admin — THE CURATOR'S ROOM. THE ONE ADDRESS NOTHING ON THE SITE LINKS TO.
#
# WHAT MOVED AND WHY THERE IS A RULE AT ALL. The Bulk Import / Database
# Expansion tool and the Politician Manager were 650 lines of markup on
# index.html, gated three ways so no reader would see them. Three locks that
# work are still three locks on a room built in the lobby, so the room moved to
# admin.html and the front page no longer contains the markup, the allow-list,
# or a link. This pair is how the curator gets there.
#
# NO SPLAT, AND IT IS THE SAME ARGUMENT /library MAKES, WITH MORE AT STAKE. The
# gate on that document injects /admin-politician-manager.js and
# /expansion-controller.js — 451 KB of JavaScript — by createElement, from
# root-absolute paths. A /admin/* rule would answer /admin/expansion-controller.js
# with admin.html: HTML handed to the browser as JavaScript, a tool that never
# mounts, and no error naming the cause. Every same-origin path in admin.html is
# root-absolute regardless, without exception, which is what makes the
# trailing-slash form below safe; scripts/test-admin-shell.mjs fails the build on
# a relative one and on any splat under this prefix.
#
# NOT INDEXED, THREE WAYS, none of which depends on the other two: admin.html
# says noindex,nofollow in its own head, robots.txt is generated and does not
# name it, and the header block further down sends X-Robots-Tag on this path.
# There is no canonical on the document because a canonical publishes an
# address, and this one is not published. It is also deliberately absent from
# sw.js's SHELL_ASSETS — no reader's phone should precache the curator's door.
#
# ORDER: TWO PATHS, AND THE POSITION IS A STATED NO-OP. Both are disjoint by
# inspection of the literal strings from /p/*, /i/*, /issue/*, /ballot, /me,
# /stances, /evidence, /courts, /mandate, /voice, /money, /community*, /library,
# /locker*, /vote/*, /d/* and /b/*, so declaring them here is correct and would
# also have been correct anywhere else in the file. /api/* is a different prefix
# and is untouched by both. THE INVARIANT, unchanged from the blocks above:
# nothing that matches these paths may be declared earlier, and the day a
# catch-all appears — an SPA "rewrite everything to index.html" is the one that
# would silently eat them — these must stay in front of it. There is no catch-all
# in this file today; that is a property to preserve.
# ═════════════════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# The trailing-slash form, declared rather than left to a redirect, so a pasted
# /admin/ is the room instead of a hop. Same root-absolute rule as /money,
# /library and /community: served at /admin/, a bare src of a controller file
# would resolve under that path and 404.
[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200

# /api/votes IS RETIRED, AND ON PURPOSE THERE IS NO RULE FOR IT HERE.
#
# Netlify's top-resources-not-found report for Aug 12 - Sep 11 put /api/votes at
# 169,076 requests, the loudest dead path on the site. It was never a Function:
# nothing in netlify/functions has ever declared that path, and the formal record
# has only ever been served by /api/voting-record. The 404s came from four client
# emitters (index.html's agenda handler, like-dislike.js's like/dislike writes,
# and a read fallback in like-dislike.js that issued one GET per politician in the
# roster whenever a Firestore per-document listener errored). All four are gone,
# and scripts/test-no-legacy-votes-api.mjs fails the build if the string returns
# to shipped code or if a Function claims the path.
#
# A 410 (Gone) was the preferred edge answer and was skipped after reading the
# parser: @netlify/redirect-parser only allows `to` to be omitted for FORWARD
# rules (from ending in /* with a 2xx status), so a 410 rule needs a `to` and
# therefore a body file to point it at. The only body already on disk is the 2 MB
# app shell, and rewriting a dead API path into that shell is precisely the
# mistake this site already made once at /p/person-file.js - it converts a cheap,
# honest 404 into a 2 MB response that tells a client the endpoint exists. So the
# path keeps Netlify's built-in 404, which is the correct answer for a route that
# never existed, and this block is the record of the decision rather than a rule.
# If a body file is ever added for other reasons, a `from = "/api/votes"` /
# `status = 410` rule pointed at it is the right follow-up.

# Portrait hosts the Image CDN may fetch from.
#
# This exists for ONE caller: the shareable record card (profile-card.js). Every
# other surface renders a portrait in an <img>, where a cross-origin host costs
# nothing. A canvas is different — a cross-origin bitmap taints it, and toBlob()
# then throws at the moment the reader taps share, on a device we never see. So
# the card loads its face through /.netlify/images, which is our own origin, and
# these are the hosts that proxy is allowed to resolve on its behalf.
#
# The set is exactly the six trusted portrait hosts scripts/test-photo-coverage.mjs
# already pins for BROWSE_PHOTOS, and for the same reason it gives: a new host is a
# new availability and a new trust dependency for faces on an accountability app.
# Widen it deliberately, in both places, or not at all. A host that is not here
# 404s, which the card handles the same way it handles a dead network — it draws
# the monogram.
[images]
  remote_images = [
    "https://raw\\.githubusercontent\\.com/.*",   # unitedstates/images — official congressional portraits
    "https://upload\\.wikimedia\\.org/.*",        # Wikimedia Commons, hashed thumb form (legacy)
    "https://commons\\.wikimedia\\.org/.*",       # Wikimedia Commons, hash-independent Special:FilePath
    "https://bioguide\\.congress\\.gov/.*",       # official Bioguide portraits
    "https://le\\.utah\\.gov/.*",                 # official Utah legislature portraits
    "https://insurance\\.utah\\.gov/.*"           # official Utah agency portrait
  ]

# THE CURATOR'S ROOM IS NOT CRAWLABLE, SAID AT THE EDGE AS WELL AS IN THE HEAD.
# admin.html carries <meta name="robots" content="noindex, nofollow"> and the
# generated robots.txt does not name the path. This is the third statement, and
# it is the only one of the three a crawler gets before it parses anything — a
# fetcher that reads headers and skips the body still learns the answer. Both
# spellings, because both are live 200s.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# PWA service worker must never be served stale, or clients get stuck on an
# old worker and miss shell updates. Force revalidation on every request.
# (The worker versions and prunes its own caches internally.)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The web app manifest changes rarely; a short cache keeps it reasonably fresh.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ═════════════════════════════════════════════════════════════════════════════
# HSTS — THE SECOND HALF OF THE ONE-ORIGIN FIX, AND THE HALF THE REDIRECTS
# CANNOT DO.
#
# The three rules at the top of this file catch a cleartext request once it
# arrives. This header stops it being SENT. After one successful HTTPS
# response, the browser refuses to issue a plain-HTTP request to this name for
# a year — it rewrites the scheme internally and never opens port 80 at all.
# That matters here specifically because of how the flag was earned: an
# in-app-browser tap on http://www.politidex.fyi got scored by a security
# filter on the shape of the cleartext hop. A redirect turns that hop into a
# 301; HSTS removes the hop. A reader who has been here once cannot generate
# the request that got flagged, no matter what spelling the link they tapped
# used.
#
# for = "/*" so it rides every response, not just the document — a header
# scoped to one path teaches the browser nothing about the rest of the origin.
#
# includeSubDomains covers www, which is the whole point: www is a name we
# still answer on (it has to be, or the 301 above has nothing to serve from),
# so it is a name a reader can still be sent to over cleartext. This directive
# is what makes a warm browser upgrade that link before it leaves the device.
#
# NO preload. Deliberately, and this pass does not add it — see the long note
# in the redirect block at the top of this file. max-age + includeSubDomains is
# reversible by lowering max-age and waiting; preload is not reversible on any
# timescale we would want to be committed to on a domain this young. The
# ordering is: canonicalize, watch it hold, then consider the one-way door.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
