# Secret scanning: the Firebase Web API key shipped in index.html is a PUBLIC
# client identifier (access to Firebase is controlled by Security Rules, not by
# keeping this value secret — Google documents it as safe to include in client
# code). Netlify's smart secret detection would otherwise flag the "AIza…" string
# as a likely secret and fail the build, so we safelist that one value here.
# All other secret-scanning protections remain active.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDNkLuB8wmLuz38dfL8ZP6rvnv-efZvnyU"

# ═════════════════════════════════════════════════════════════════════════════
# ONE PUBLIC ORIGIN: https://politidex.fyi. EVERY OTHER SPELLING 301s HERE IN
# ONE HOP, AND THESE THREE RULES ARE FIRST IN THE FILE FOR THAT REASON.
#
# WHAT WENT WRONG. A tap from inside the Facebook in-app browser opened
# http://www.politidex.fyi/?fbclid=… — plain HTTP, on the www spelling, of a
# young .fyi domain — and Xfinity Advanced Security (safebrowse.io) painted
# "This site could be risky." Desktop Chrome and incognito were fine, which is
# the tell: nothing is wrong with the site's content. What the interstitial
# reacted to is the SHAPE of the first hop. A cleartext request to a
# recently-registered domain, arriving from an in-app webview with a click id
# attached, is the profile those filters score on, and every extra hop before
# the reader reaches TLS is another sample they get to score.
#
# So the fix is not a content change, it is removing the cleartext hop and the
# second hostname. There is one origin now, it is the apex on HTTPS, and the
# three rules below are the complete set of other spellings that can reach us.
#
# ONE HOP, NOT TWO, AND THE :splat IS WHY. Each rule names a FULL URL in `from`
# — scheme and host — and sends the request straight to its final address on
# https://politidex.fyi. http://www does NOT go via http://apex or via
# https://www; it lands on the canonical origin in a single 301. A chain like
# http://www → http://apex → https://apex would hand a scanner two cleartext
# requests to look at instead of one, which is the thing this block exists to
# stop.
#
# 301 AND force, ON ALL THREE. 301 because the move is permanent and a 302
# tells a crawler to keep asking at the old spelling — and keep re-earning the
# interstitial. `force` because these rules have to beat the static file that
# would otherwise answer: '/' and '/index.html' exist in the publish
# directory, so without it a request on the wrong host would be served the
# document at 200 and no redirect would ever happen. With it, port 80 never
# returns HTML — only a Location header.
#
# THESE RULES MUST STAY AT THE TOP. Netlify evaluates this table in order and
# the first match wins. Every rewrite below is path-only in `from`, so it
# matches on ANY host: move these down and a request to
# http://www.politidex.fyi/vote/119/house/190 would match /vote/* first and be
# served index.html at 200 over cleartext on the non-canonical host — exactly
# the first hop that got flagged.
#
# NO preload, DELIBERATELY. The HSTS header at the bottom of this file carries
# max-age and includeSubDomains but not `preload`, because preload is a
# one-way door: submission bakes the whole name — every current and future
# subdomain — into browser binaries, and removal takes months to propagate.
# That is a commitment to make after this canonicalization has been observed
# working, not in the same pass that introduces it.
#
# NOT HANDLED HERE, BECAUSE IT IS NOT A REPO SETTING: the apex and www must
# both be assigned to the site in Netlify's domain management with a
# certificate covering both names, and "Force HTTPS" left on. The www name has
# to keep resolving and keep its cert — a host that stops answering cannot
# serve the redirect that retires it, and the flagged link would start failing
# to connect instead of arriving.
[[redirects]]
  from = "http://politidex.fyi/*"
  to = "https://politidex.fyi/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.politidex.fyi/*"
  to = "https://politidex.fyi/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.politidex.fyi/*"
  to = "https://politidex.fyi/:splat"
  status = 301
  force = true

# Shareable roll-call deep-links. A clean path like
# /vote/119/house/190 must serve the same single-page document (HTTP 200 rewrite)
# so the client-side router can read the congress/chamber/roll from the path and
# open the corresponding measure. Scoped to /vote/* only, leaving every other
# route (assets, /api/*, the Functions) untouched.
#
# This rewrite ALONE used to be the whole story, and that was the bug: nothing in
# the app ever read the path, so every /vote/… link returned HTTP 200 and quietly
# showed the front page — a citation that looks like it worked and didn't. The
# rule stays (it is what serves the document), but the edge function
# netlify/edge-functions/share-preview.ts now runs in front of it and gives it
# meaning: it resolves the roll call against the voting-record API, hands the
# client the measure to open, and returns an honest 404 when the roll call is not
# one we hold. Lookup failures other than a definitive 404 still fall through to
# this rewrite, so a slow database degrades to the old behaviour rather than to a
# broken link.
[[redirects]]
  from = "/vote/*"
  to = "/index.html"
  status = 200

# Person-file deep-links. Phase 1 gave the politician profile a durable address
# of its own: /p/<pid>. A citable path like /p/celeste_maloy must SERVE a document
# (HTTP 200 rewrite, not a redirect) and let person-file.js read the pid out of
# location.pathname and open the file.
#
# THE DOCUMENT IT SERVES IS NOW /person.html, NOT /index.html. This is the whole
# of the first split. Every other rewrite in this file still points at index.html
# — /, /vote/*, /d/*, /b/* and /locker are unchanged — because those addresses
# really are the one-document app. (/i/* and /issue/* later got documents of
# their own too, on the same terms; see the two blocks below.) A person file is
# not: it opens
# one record, and it was paying 2.3 MB of markup and ~114 script tags (~11.9 MB)
# for the homepage civic OS, the account graph, Compare, the Archive, the Evidence
# Locker and both Doors, none of which appear on the page a reader asked for and
# all of which ran on the main thread underneath it. That is what froze the tab.
# /person.html is the person lane alone: 234 KB of markup, 59 modules.
#
# THE ORDER OF THE TWO RULES IS NOT LOAD-BEARING — /p/* and the index.html
# fallbacks match disjoint paths — but the ROOT-ABSOLUTE ASSET PATHS IN
# person.html ARE. /p/<pid> is two segments deep and this rule returns 200 for
# anything under it, so a relative src="person-file.js" on that document would
# resolve to /p/person-file.js, match this rule, and hand the browser an HTML
# document to parse as JavaScript. scripts/test-person-shell.mjs fails the build
# on a relative same-origin path anywhere in person.html for that reason.
#
# The pid, not a name slug: a name in a URL is a claim nothing on arrival can
# check, and the pid is the identifier the roster, the stance corpus, the
# voting-record API and every existing share link already agree on. Every id in
# the roster is [a-z0-9_]+, which is pinned by scripts/test-person-file.mjs so a
# future id that would need escaping fails a test instead of shipping a broken
# address.
#
# The old ?p=<pid> form is NOT retired by this — it still resolves, because links
# of that shape are already in the wild. What changed is which of the two
# canonicalises: netlify/lib/share-target.ts now returns /p/<pid> for a profile,
# so the same record reached either way declares one address.
#
# As with /vote/*, the rewrite alone would be a trap: it returns HTTP 200 for
# every /p/<anything>, including ids we hold no record for. The edge function
# netlify/edge-functions/share-preview.ts runs in front of it (its config lists
# /p/*) and gives the path meaning — record-specific title, description, card and
# canonical — and person-file.js says so out loud on arrival when the pid does not
# resolve, rather than showing the front page to someone who followed a citation.
#
# ── AND THE QUERY ON THIS PATH BELONGS TO THE DOCUMENT ────────────────────────
# /p/<pid>?issue=<key> and /p/<pid>?record=<pid>~<key> are the issue dossier's
# addresses, and they need nothing here: a query string does not participate in
# rule matching, so both are served by this same rewrite and read on the client
# by person-file.js. That is the point of them — the dossier used to be a HASH on
# the front page (#record=<pid>~<key>), which meant it painted over index.html,
# never had a history entry, and left Back with nothing to close. It is now a
# layer on the one document that holds the record it is about.
#
# FIRST-MATCH-WINS, AND WHERE THIS SITS IN IT. Netlify takes the first rule whose
# `from` matches, so the practical question is only ever "what else could claim
# this path". Nothing can: /p/* is disjoint from /ballot and /ballot/ (which are
# exact, above), from /i/*, /issue/*, /b/* and /vote/*, and from the index.html
# fallbacks at the foot of this file. Moving this block above or below any of
# them is a no-op — which is worth writing down precisely because it LOOKS
# load-bearing next to a note insisting something else is. The thing that is
# genuinely load-bearing on this path is the root-absolute asset rule above.
[[redirects]]
  from = "/p/*"
  to = "/person.html"
  status = 200

# Issue-file deep-links. The third durable address, on exactly the terms /p/<pid>
# got its own: /i/<key> SERVES this document (HTTP 200 rewrite, not a redirect) so
# pdx-issue-profile.js can read the key out of location.pathname and mount the
# issue ledger Door 1 already paints.
#
# WHY IT DID NOT EXIST BEFORE, AND WHY THAT WAS THE BUG. Door 1's issue mode has
# painted the child ledger for a while — the Core → Child crumb, the census, the
# five formal-pattern bands, the measures on file — and seek, OPEN and a chip tap
# all mount it. None of them produced a citation. There was no /i/lands_preserve,
# so the Eye's own issue hit, the person file's topic tree and every share control
# could point at a person, a bill or a roll call and never at THE ISSUE. An
# accountability app whose issue reading has no address is one nobody can cite.
#
# The key, not a label slug: `lands_preserve` is the identifier ISSUE_MAP, the
# parent table in alignment-tool.js, the measure mappings and the formal-pattern
# index all already agree on, and a prettier slug would be a second name for the
# same thing. An address that spells the label instead still resolves — the
# desk's own resolver reads it — and re-stamps the bar with the key, so one
# reading declares one address.
#
# NO EDGE FUNCTION STANDS IN FRONT OF THIS ONE, unlike /p/*, /b/* and /vote/*.
# That is a deliberate limit of this pass rather than an oversight: share-preview
# gives those paths a record-specific title, card and honest 404, and doing the
# same here means resolving a key server-side against the generated index. Until
# that lands, the rewrite answers 200 for /i/<anything> — so the CLIENT is where
# the honesty has to live, and pdx-issue-profile.js says out loud on arrival when
# the register carries no key by that name instead of showing the front page to
# someone who followed a link. Sitemap entries for the register's keys are left
# to that same later pass, for the same reason: an address a crawler is invited
# to should have a head written for it first.
#
# share-preview.ts IS NOT BEING EXTENDED TO /i/* IN THIS PASS EITHER, and for a
# sharper version of the same reason: its path list carries /issue/*, and adding
# /i/* would put the edge in front of an address it cannot resolve. With no
# server-side key lookup it would rewrite the tags with nothing to say and emit
# the generic site card on every issue file — worse than the honest untouched
# head issue.html already ships, because a wrong card looks authoritative. The
# og:*, twitter:*, <title> and canonical anchors on issue.html are carried in
# share-preview's exact tag shape, and scripts/test-issue-shell.mjs pins each one
# against the regexes that function actually uses, so the day a resolver lands
# the edge can be pointed here without touching the document.
#
# ── WHAT CHANGED: /i/* NOW SERVES ITS OWN DOCUMENT ────────────────────────────
# This rule used to answer /index.html, and that quietly undid the person-file
# split one tap downstream. Every "Issue file" control on a person record is an
# <a href="/i/<key>"> — consistency.js's gap-sheet title, stance-tree.js's leaf
# row, word-action.js's shape row, stance-helpers.js's mandate-chip fallback — so
# a reader on /p/lee who tapped Issue File was handed the 2.3 MB homepage shell:
# the homepage grids, Compare Hub, the account graph, Door 2, the Archive, the
# Locker and the spotlight fuel, none of it on the page they asked for. /i/* now
# serves /issue.html, which carries the ledger lane and nothing else.
#
# /issue/* IS NOT THIS ADDRESS, and the block below it is not this document.
# /i/<key> is the Issue File — the dossier ledger over a vocabulary key.
# /issue/<slug> is an Issue Spotlight — one long curated writeup. They share a
# prefix in spelling only, they are different products, and each now has a
# document of its own. /, /vote/*, /d/*, /b/* and /locker are untouched: none of
# them is an Issue File URL on a person record.
[[redirects]]
  from = "/i/*"
  to = "/issue.html"
  status = 200

# Issue Spotlight deep-links — THE THIRD SPLIT. A clean, shareable path like
# /issue/box-elder-stratos-data-center must SERVE a document (HTTP 200 rewrite,
# not a redirect) and let the page read the slug out of location.pathname.
#
# THE DOCUMENT IT SERVES IS NOW /spotlight.html, NOT /index.html. A Spotlight is
# one curated writeup, and the writeups live in spotlights-data.js — 1.2 MB. That
# payload sat on the front page, so every homepage visit paid to parse 60 long
# articles the reader had not asked for, while the Spotlight itself arrived
# wrapped in the whole app: Compare Hub, the alignment tool, Door 2, the ballot
# workspace, the person-file spine. spotlight.html carries the corpus, the engine
# and the one stylesheet it paints with, and nothing else. The front page keeps
# ordinary links to this address plus spotlight-index.js (~86 KB of slug, title,
# place and blurb) — never the corpus.
#
# ORDER MATTERS, AND THIS BLOCK IS DELIBERATELY LAST OF THE THREE. Netlify is
# first-match-wins, so /i/* and /p/* are declared above: /i/<key> keeps the Issue
# File and /p/<pid> keeps the person file, and neither can be swallowed by a
# broader Spotlight rule. /issue/* takes only its own prefix — /, /vote/*, /d/*,
# /b/* and /locker are untouched. NO SLUG IS ENUMERATED HERE: an unknown slug is
# answered inside the document (spotlight-engine.js hops once to /i/<key>,
# carrying ?pid= if it arrived), not by a growing list of rules in this file.
[[redirects]]
  from = "/issue/*"
  to = "/spotlight.html"
  status = 200

# ─────────────────────────────────────────────────────────────────────────────
# DOOR 2 — THE BALLOT WORKSPACE GETS ITS OWN DOCUMENT: /ballot -> ballot.html
# ─────────────────────────────────────────────────────────────────────────────
# THE FIFTH SHELL. Door 2 is where a voter resolves their seats: open one seat,
# read the field on the formal record, pick, move to the next undecided seat.
# It was a section of index.html, which meant a voter who came to work their
# ballot downloaded the 2.24 MB front page — the hero, Who Represents Me,
# Compare Hub, the Spotlight directory, the Archive, the Locker, the account
# graph — and then scrolled past all of it to reach the desk.
#
# ballot.html carries the record lane and nothing else: the desk, where this
# voter votes, the field for a seat, the stance corpus the record ruler reads,
# and the one side-by-side overlay. .netlify/results.md lists what it drops.
#
# THIS IS ONE PATH, NOT A PREFIX. Two exact rules and no wildcard, because
# /ballot has no sub-addresses: the seat is a query (/ballot?seat=<key>), not a
# segment, so there is nothing for a /ballot/* rule to match that a typo would
# not also match. An unknown seat key is answered inside the document — the desk
# honours ?seat= only when it names a seat on THIS voter's own resolved list,
# and falls through to their first undecided seat otherwise.
#
# ORDER MATTERS AND THIS BLOCK IS AFTER ALL THREE OTHER SHELLS. Netlify is
# first-match-wins: /p/* (the person file), /i/* (the Issue File) and /issue/*
# (the Spotlight) are declared above and none of them can be swallowed by the
# rules here, which take two exact paths and no prefix. /vote/*, /d/*, /b/*
# and /locker are untouched, and so is / — the front page is still index.html,
# and Who Represents Me is still the front step on it. /me is claimed by the
# block immediately below, which is declared after these two for the reason
# stated there.
[[redirects]]
  from = "/ballot"
  to = "/ballot.html"
  status = 200

# The trailing-slash form of the same address, declared rather than left to a
# redirect, so a pasted /ballot/ is the workspace instead of a hop. It is also
# why every same-origin path inside ballot.html is root-absolute: served at
# /ballot/, a bare src would resolve one directory down, this rule would answer
# it, and the browser would be handed the document to parse as JavaScript.
[[redirects]]
  from = "/ballot/"
  to = "/ballot.html"
  status = 200

# ═════════════════════════════════════════════════════════════════════════════
# THE VOTER'S OWN FILE GETS ITS OWN DOCUMENT: /me -> me.html
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS ADDRESS FIXES. The reader's own file had no address. The account
# menu's "Your file" was the hash #your-file, which opened an overlay on
# whatever document the reader was standing on — and since that menu only
# exists on the front page, it was always the front page. The menu's "My Views"
# was a scroll to a different region of that same front page. Ballot picks were
# a third place (/ballot) and starred issues a fourth. One person, four
# addresses, not one of them linkable, bookmarkable or Back-able, and two live
# editors of the same eight answers — a pair that can drift.
#
# So /me is the desk and /me is the only address for it. Both account-menu
# controls are now plain <a href="/me">, the Who Represents Me action row's
# "Your file" button is the same link, and #your-file still WORKS — your-file.js
# replace-hops it here exactly once, because a bookmark a reader made last year
# is not a thing to break — but it is no longer a place where the eight answers
# can be edited.
#
# WHAT IT COSTS TO SERVE, WHICH IS THE OTHER HALF OF THE POINT. index.html is
# 2.24 MB of front page: the hero, Who Represents Me, Compare Hub, the alignment
# engine, the consistency lane, the voting-record prefetch for 757 members, the
# whole Door 2 apparatus. me.html carries four inline store blocks and seven
# scripts, and not one of them is an engine — because a desk that shows a reader
# what they already hold does not need the machine that compares it, and the
# reader who wants that machine has a text link to it.
#
# /me HAS NO SUB-ADDRESSES. A region on the desk is a QUERY (/me?tab=positions,
# stars, ballot, saved), not a segment, so there is nothing for a /me/* rule to
# match that a typo would not also match. A query string does not participate in
# rule matching at all, so ?tab= needs no rule of its own and cannot be broken
# by one.
#
# ORDER: THIS BLOCK IS AFTER /ballot AND /p/*, WHICH THE BRIEF REQUIRED — AND
# THE POSITION IS A STATED NO-OP. Netlify is first-match-wins, and these two
# rules take two exact paths with no prefix and no splat, so there is no pattern
# above or below them that /me or /me/ can also match: /me is disjoint from
# /p/*, /i/*, /issue/*, /ballot, /ballot/, /vote/*, /d/*, /b/* and /locker by
# inspection of the literal strings. Declaring it here is therefore correct and
# would also have been correct anywhere else in the file. It is written down so
# that the next person to add a rule ABOVE this one knows the invariant they
# have to preserve: nothing that matches /me may be declared earlier, and the
# day a prefix rule like /m/* or a catch-all appears, these two exact paths must
# stay in front of it.
[[redirects]]
  from = "/me"
  to = "/me.html"
  status = 200

# The trailing-slash form of the same address, declared rather than left to a
# redirect, so a pasted /me/ is the desk instead of a hop. It is ALSO why every
# same-origin path inside me.html is root-absolute, with no exceptions: served
# at /me/, a bare src="me-desk.js" resolves to /me/me-desk.js, this rule answers
# that with the HTML document, the browser parses HTML as JavaScript, and the
# reader gets a blank desk with no error that names the cause. ballot.html
# carries the same rule for the same reason.
[[redirects]]
  from = "/me/"
  to = "/me.html"
  status = 200

# THE STANCE STUDIO GETS ITS OWN DOCUMENT: /my-stances -> my-stances.html
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS ADDRESS FIXES. Setting a position had no address. The editor lived
# inside the homepage as <section id="my-stances">, so every module that wanted
# to say "go set a side" said it as a scroll — PDXStances.open() called
# scrollTo('my-stances'), and eight callers fell back to location.hash =
# '#my-stances' when the module was absent. On any document that is not the
# homepage that fallback is a no-op or, worse, a jump to whatever the homepage
# happens to render at that offset: /#my-stances landed a reader in
# Relevant-to-me. /ballot's "Set your positions" opened nothing at all, because
# ballot.html deliberately does not carry my-stances.js. A surface that eight
# other surfaces point at needs a URL, not an offset.
#
# WHY A DOCUMENT AND NOT A BETTER ANCHOR. The thing at this address teaches
# itself: on a first visit it is a tutorial that walks one issue from "what do
# you care about" to a saved side, and on every visit after it is the library of
# what is on file. That is a page, it is linkable (?issue=<key>, ?add=1), it is
# shareable, and it must be reachable from documents that will never load the
# homepage. /stances, /evidence and /courts moved out of the homepage body for
# the same reason and this follows their pattern exactly.
#
# ORDERING. Netlify is first-match-wins and this file declares exact paths only,
# so /my-stances cannot be shadowed by /me above it. The invariant for whoever
# adds a rule above this one: nothing matching /my-stances may be declared
# earlier, and the day a prefix rule like /m/* or a catch-all appears, these two
# exact paths must stay in front of it.
[[redirects]]
  from = "/my-stances"
  to = "/my-stances.html"
  status = 200

# The trailing-slash form, declared rather than left to a redirect, so a pasted
# /my-stances/ is the studio instead of a hop. It is ALSO why every same-origin
# path inside my-stances.html is root-absolute, with no exceptions: served at
# /my-stances/, a bare src="stance-studio.js" resolves to
# /my-stances/stance-studio.js, this rule answers that with the HTML document,
# the browser parses HTML as JavaScript, and the reader gets a studio that never
# paints and no error that names the cause. ballot.html, me.html, stances.html
# and evidence.html carry the same rule for the same reason.
[[redirects]]
  from = "/my-stances/"
  to = "/my-stances.html"
  status = 200

# District Room deep-links. THIS BLOCK FIXES THE URL SHAPE FOR THE ROOM, and it
# is the only shape used anywhere in this pass:
#
#     /d/<districtKey>/<issueKey>      e.g. /d/ut-house-2/lands_preserve
#
# Two segments, both of them keys the database already holds: <districtKey> is
# dd_districts.district_id (<state>-<house|statesenate|statehouse>-<number>) and
# <issueKey> is dd_issue_keys.issue_key. A room is (district, issue) and nothing
# else, so its address is (district, issue) and nothing else — there is no pid in
# this path and there never will be, because the room is not a comment thread on
# whoever currently holds the seat. When the seat changes hands the address does
# not move.
#
# Serves index.html at 200 (a rewrite, not a redirect) so district-room.js can
# read both keys out of location.pathname and open the room on arrival, exactly
# the arrangement /p/*, /i/* and /b/* already use.
#
# NO EDGE FUNCTION STANDS IN FRONT OF THIS ONE, for the same reason /i/* has
# none: a district-and-issue-specific title and an honest 404 would mean
# resolving both keys server-side before first byte, and this pass does not
# invent that. So the rewrite answers 200 for /d/<anything>/<anything> and the
# CLIENT carries the honesty — district-room.js refuses to open on a key of the
# wrong shape, and the room it does open says out loud when the pair names no
# district or no issue the tables hold. No sitemap entry: a district's room is
# for the people who live in it, not a page to invite crawlers to.
# THE SHORT SPELLING OF A SEAT, NORMALIZED AT THE EDGE, BEFORE THE REWRITE.
# /d/ut-hd-68 and /d/ut-statehouse-68 are one place: the same district row, the
# same file, the same rooms. The client already knows that — district-file.js and
# district-voice.js both normalize every spelling before anything looks at it —
# but the client only gets to know it if the client loads, and a URL people paste
# into a message, a print-out or a QR code has to survive a cold visit where the
# rewrite is all that runs. A 301 here means the SERVER settles which spelling is
# the address, so the short form cannot fall through to the front page and cannot
# leave a second URL for one seat sitting in somebody's history or in a search
# index.
#
# 301 rather than 200 on purpose: the alias is not a page, it is a nickname, and
# the reader should end up standing at the canonical URL rather than reading the
# canonical file at a non-canonical address. The client's own normalization stays
# exactly as it is — it still moves the bar for a reader who arrived on the short
# form by some route this rule never saw, and it is what keeps a two-segment room
# address honest — so the two agree instead of one covering for the other.
#
# EXACT PATHS, ONE PER SHIPPED SEAT, and no wildcard. A pattern that rewrote
# /d/:state-hd-:n wholesale would promise an address for every alias of every
# district in the country, and only one seat has a file. Adding a seat is adding
# a pair of rules here next to the line it needs in SHIPPED.
#
# BEFORE the /d/* rewrite below, because order decides in this file and the
# wildcard would otherwise swallow the alias and serve it index.html at 200 — the
# exact "two spellings, two addresses" outcome this rule exists to prevent.
[[redirects]]
  from = "/d/ut-hd-68"
  to = "/d/ut-statehouse-68"
  status = 301
  force = true

[[redirects]]
  from = "/d/ut-hd-68/*"
  to = "/d/ut-statehouse-68/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/d/*"
  to = "/index.html"
  status = 200

# Bill-profile deep-links. The third face of the archive gets the same treatment
# the person file got: /b/<sitting>/<number> — /b/119/H.R.%201 for a federal
# measure, /b/2024GS/H.B.%20257 for a state one — SERVES index.html (HTTP 200
# rewrite) so share-links.js can read the path and open the bill panel on it.
#
# The sitting leads because a bill number alone is not an identity: "H.B. 257"
# names a different bill in every Utah general session, which is exactly why the
# ingest keys state rows on (chamber, number, external_ids->>'utahSession') rather
# than on a congress the rows do not have. /b/<number> without a sitting still
# resolves, for a number that is unambiguous across the whole archive.
#
# The older ?bill=<sitting>/<number> form is NOT retired — those links are in the
# wild and share-links.js still reads them. What changed is which of the two
# canonicalises: netlify/lib/share-target.ts now returns /b/… for a bill.
#
# And as with /vote/* and /p/*, the rewrite alone would be a trap — it answers 200
# for /b/<anything>. share-preview.ts runs in front of it (its config lists /b/*)
# to give the path a real card, and share-links.js posts an honest notice on
# arrival when the address opened nothing.
[[redirects]]
  from = "/b/*"
  to = "/index.html"
  status = 200

# ═════════════════════════════════════════════════════════════════════════════
# THE BROWSE ROOMS GET THEIR OWN DOCUMENTS: /stances -> stances.html
#                                            /evidence -> evidence.html
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THESE TWO ADDRESSES FIX. The front page was hosting two full research
# desks in its own body. The Stance Library — search, bundle chips, folded
# shelves, one card per issue — was the section #stance-library, and the whole
# Issue Spotlight collection was the shelf #all-spotlights directly beneath it,
# which meant the same reader was offered two labels in the nav ("Issues &
# Stances" and "All Spotlights") for one continuous shelf. The Evidence Locker
# was the section #evidence-locker. Neither had an address. Every link to either
# was a hash — a scroll to a region of a 2.25 MB document that the reader had to
# download in full to reach a grid, with no way to bookmark it, send it, or
# press Back out of it.
#
# So /stances is the desk where positions live and /evidence is the desk where
# receipts live, and each is the only address for its room. The nav now offers
# one item per room instead of two labels for the same shelf. The homepage keeps
# one thin door to each and hosts neither grid.
#
# ONE SPELLING EACH, CHOSEN AND USED EVERYWHERE. /stances, not /library; and
# /evidence, not /locker. /locker shipped earlier as a 200 rewrite to index.html
# and is kept — as a 301 to /evidence, below — because links a reader made to it
# are in the wild, and because two live 200 spellings of one room is exactly the
# ambiguity this pass exists to remove.
#   /library IS LIVE NOW, AND IT IS NOT THIS ROOM. Declining it here was a
# decision about what to call the STANCE shelf, taken when the name was
# unclaimed — and it is exactly why the name was free when the Digital Library
# needed it. /library answers with library.html, the searchable archive and the
# Legislation catalog over it (see its own block further down). Nothing about
# this room moved: the stance shelf is /stances and only /stances, and no
# /library rule points at stances.html under any status.
#
# WHY THE ENGINES ARE NOT DUPLICATED. stance-library.js, spotlight-hub.js and
# evidence-locker.js are unchanged modules loaded by the new documents the same
# way ballot.html loads ballot-workspace.js. evidence-locker.js also STAYS on
# the homepage, because other front-page surfaces read the depth pills and
# per-person counts it publishes — what left the homepage is its workspace
# <template>, so the grid can no longer mount there, and the engine's own
# navigation path answers a failed mount by going to /evidence with the filters
# that were asked for.
#
# WHAT THEY COST TO SERVE, WHICH IS THE OTHER HALF OF THE POINT. index.html is
# 2.25 MB. stances.html is 50 KB of shell and carries no locker grid, no
# Compare Hub, no alignment engine, no voting-record prefetch. evidence.html is
# 82 KB of shell and carries no stance-library grid. A reader who wants one desk
# is charged for one desk.
#
# NEITHER ROOM HAS SUB-ADDRESSES. A position belongs to an issue, and an issue
# already has its own address (/issue/<slug>, /i/<slug>); a receipt belongs to a
# person or a bill, and those already have /p/<pid> and /b/<number>. So a card
# tap on either desk LEAVES the desk for an address that already exists — no
# third issue page was invented — and there is nothing for a /stances/* or
# /evidence/* rule to match that a typo would not also match. Filters are
# QUERIES (/evidence?issue=<key>, /stances?issue=<key>), and a query string does
# not participate in rule matching at all, so ?issue= needs no rule of its own
# and cannot be broken by one.
#
# ORDER: FOUR EXACT PATHS, NO PREFIX, NO SPLAT — AND THE POSITION IS A STATED
# NO-OP. Netlify is first-match-wins. /stances, /stances/, /evidence and
# /evidence/ are disjoint by inspection of the literal strings from /p/*, /i/*,
# /issue/*, /ballot, /me, /vote/*, /d/*, /b/* and /locker, so declaring them
# here is correct and would also have been correct anywhere else in the file.
# It is written down so that the next person to add a rule ABOVE this one knows
# the invariant they have to preserve: nothing that matches these four paths may
# be declared earlier, and the day a prefix rule like /s/* or /e/* or a
# catch-all appears, these four exact paths must stay in front of it.
[[redirects]]
  from = "/stances"
  to = "/stances.html"
  status = 200

# The trailing-slash form of the same address, declared rather than left to a
# redirect, so a pasted /stances/ is the desk instead of a hop. It is ALSO why
# every same-origin path inside stances.html is root-absolute, with no
# exceptions: served at /stances/, a bare src="stance-library.js" resolves to
# /stances/stance-library.js, this rule answers that with the HTML document, the
# browser parses HTML as JavaScript, and the reader gets an empty shelf with no
# error that names the cause. ballot.html, me.html and evidence.html carry the
# same rule for the same reason.
[[redirects]]
  from = "/stances/"
  to = "/stances.html"
  status = 200

[[redirects]]
  from = "/evidence"
  to = "/evidence.html"
  status = 200

[[redirects]]
  from = "/evidence/"
  to = "/evidence.html"
  status = 200

# THE THIRD BRANCH GETS ITS OWN DOCUMENT: /courts -> courts.html
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS ADDRESS FIXES. The homepage was hosting the whole judicial branch in
# its own body: a page head, the retention questions resolved for the reader's
# location, and beneath them the complete Utah courts archive — every judge on
# file, by court, under an "ARCHIVE · UTAH COURTS · NOT A BALLOT" banner. That
# is a two-hundred-name list shipped in the first paint of a 2 MB document to
# every visitor, located or not, on a page whose job is "who represents me" and
# "find the record". It had no address, so there was nothing to bookmark and no
# way to send somebody the courts without sending them the homepage.
#
# /courts is that room, and courts.html is 22 KB of shell: no locker grid, no
# Compare Hub, no alignment engine, no stance library, no voting-record
# prefetch, and no store at all — this is a public read surface, so it carries
# neither PDXStore nor PDXSaved nor Firebase.
#
# TWO REGIONS, LABELLED SO THEY CANNOT BE READ AS ONE. A · On your ballot holds
# only the questions the resolver can defend for the location saved in this
# browser; B · Archive holds every retention record on file, stating that a
# listing there is not a claim the question is on anybody's ballot. The
# fail-closed rule is unchanged and is the reason the split has to be visible:
# the district, juvenile and justice courts have no map, so the archive may name
# every judge on them while region A names nobody as the reader's. The homepage
# keeps one card — a count and a door — and hosts neither region.
#
# NO SUB-ADDRESSES, AND NO PER-JUDGE URL IN THIS PASS. A judge is a person, and
# a person already has /p/<pid>; a court is not a document. There is nothing for
# a /courts/* rule to match that a typo would not also match, and the location
# is not in the path at all — it is the reader's saved location, read by
# voter-hub-location.js, which is why /courts is one address for everybody and
# still answers differently for each reader.
#
# ORDER: TWO EXACT PATHS, NO PREFIX, NO SPLAT — AND THE POSITION IS A STATED
# NO-OP, on the same terms as the four above. /courts and /courts/ are disjoint
# by inspection of the literal strings from /p/*, /i/*, /issue/*, /ballot, /me,
# /stances, /evidence, /vote/*, /d/*, /b/* and /locker, so declaring them here
# is correct and would also have been correct anywhere else in the file. The
# invariant written down for the next person to add a rule above: nothing that
# matches these two paths may be declared earlier, and the day a prefix rule
# like /c/* or a catch-all appears, these two exact paths must stay in front.
[[redirects]]
  from = "/courts"
  to = "/courts.html"
  status = 200

# The trailing-slash form, declared rather than left to a redirect, so a pasted
# /courts/ is the room instead of a hop. It is ALSO why every same-origin path
# inside courts.html is root-absolute, with no exceptions: served at /courts/, a
# bare src="judicial-ballot.js" resolves to /courts/judicial-ballot.js, this rule
# answers that with the HTML document, the browser parses HTML as JavaScript, and
# the reader gets an empty room with no error that names the cause.
# scripts/test-courts-shell.mjs fails the build if a relative same-origin path
# ever appears in that document. ballot.html, me.html, stances.html and
# evidence.html carry the same rule for the same reason.
[[redirects]]
  from = "/courts/"
  to = "/courts.html"
  status = 200

# ═════════════════════════════════════════════════════════════════════════════
# THE THREE SIDE LANES GET THEIR OWN DOCUMENTS
#   /mandate -> mandate.html   /voice -> voice.html   /money -> money.html
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THESE ADDRESSES FIX. The front page was hosting three whole rooms in its
# own body. The People's Mandate was a 112 KB section, an 8 KB submit modal and
# 62 KB of inline script; Follow the Money was a 11 KB section over 64 KB of
# inline tracker; District Voice had no front-page address at all — it was a
# block inside a district file, and /d/<seat-key> is itself a rewrite to
# index.html. So every reader of a two-megabyte document paid for all three,
# including the reader who arrived to answer "who represents me" and nothing
# else, and a reader who wanted one of the three had nothing to bookmark, nothing
# to send, and nothing that survived a reload. #agenda and #follow-the-money were
# scroll positions, not places, and a District Voice reader had to already know
# their seat key.
#
# THREE ROOMS, THREE DOCUMENTS, ON THE PATTERN /me AND /courts ALREADY SET: no
# app.css, no compare-hub.js, no ballot-breakdown.js, no Door 1 work layer, no
# Evidence Locker template, no Who Represents Me card, no ballot workspace and no
# homepage hero on any of the three. Each loads its own lane's module(s), the
# shared bar sheet, and the smallest auth surface that can answer "is somebody
# signed in" — which is shell-account-chip.js, 9 KB against compare-hub.js's
# 758 KB, answering the identical three-state contract.
#
# THE FRONT PAGE KEEPS THE DOORS. A short card that names the lane and links to
# it, exactly as it keeps one for /courts and one for /evidence — and the card
# prints no count: a tally on the front page is a read the door does not need
# and a second place for one number to be wrong. The room moved; the door
# stayed.
#
# WHY THESE THREE SPELLINGS AND NO FOURTH. /mandate, /voice and /money are the
# whole set. No /peoples-mandate, no /district-voice, no /follow-the-money and no
# alias for any of them: two live 200 spellings of one document split the
# canonical, which is the ambiguity the /locker -> /evidence 301 below exists to
# remove. The old front-page hashes are not redirected here either — they cannot
# be, because a fragment never reaches the server. index.html forwards a reader
# who lands on #agenda, #follow-the-money or #district-voice to the room that
# now owns it (see the LANE table in its <head>, and the same table in
# stances.html and evidence.html), and on arrival the fragment is handled by the
# room: #agenda is a real element id inside mandate.html, so the browser's own
# anchor handling lands it, and money-room.js clears the stale
# #follow-the-money with replaceState in one hop so the address bar settles on
# /money. /voice has no inbound hash to answer — District Voice never had a
# front-page fragment; that is the reason the address exists.
#
# ORDER: SIX EXACT PATHS, NO PREFIX, NO SPLAT — AND THE POSITION IS A STATED
# NO-OP, on the same terms as /me and /courts above. All six are disjoint by
# inspection of the literal strings from /p/*, /i/*, /issue/*, /ballot, /me,
# /stances, /evidence, /courts, /vote/*, /d/*, /b/* and /locker, so declaring
# them here is correct and would also have been correct anywhere else in the
# file. THE INVARIANT WRITTEN DOWN FOR THE NEXT PERSON TO ADD A RULE ABOVE:
# nothing that matches these six paths may be declared earlier, and the day a
# prefix rule or a catch-all appears — an SPA "rewrite everything to index.html"
# is the one that would silently eat all six — these exact paths must stay in
# front of it, exactly as /me's and /courts' do. There is no catch-all in this
# file today; that is a property to preserve, not an accident to rely on.
# scripts/test-mandate-shell.mjs, test-voice-shell.mjs and test-money-shell.mjs
# each assert their own pair is present, is a 200, points at its own .html, and
# is not preceded by anything that matches it.
# ═════════════════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/mandate"
  to = "/mandate.html"
  status = 200

# The trailing-slash form, declared rather than left to a redirect, so a pasted
# /mandate/ is the room instead of a hop. It is ALSO why every same-origin path
# inside mandate.html is root-absolute, with no exceptions: served at /mandate/,
# a bare src="mandate-lane.js" resolves to /mandate/mandate-lane.js, this rule
# answers that with the HTML document, the browser parses HTML as JavaScript, and
# the reader gets an empty room with no error that names the cause.
# scripts/test-mandate-shell.mjs fails the build if a relative same-origin path
# ever appears in that document. ballot.html, me.html, stances.html, evidence.html
# and courts.html carry the same rule for the same reason.
[[redirects]]
  from = "/mandate/"
  to = "/mandate.html"
  status = 200

# DISTRICT VOICE, AND THE SEAT FILE IS NOT BEING REPLACED. /d/<seat-key> is
# still where a SEAT is read and it still rewrites to index.html; /voice is where
# a READER is placed — it asks district-voice.js which seats the reader's own
# saved location resolves and lists them, one card each, with a door to the seat's
# board where one exists and the plain sentence that there is not one where it
# does not. One owner answers both addresses, so the two can never disagree.
#
# IT IS A HALLWAY, NOT A ROOM, which is why there is no wildcard anywhere near
# it. /voice mounts no board of its own; the boards live at their own addresses
# and /voice links the one or two that exist for the seats a particular reader
# votes in. Adding a board is a row in district-voice.js's allow-list and an
# exact rewrite below it — never a splat, because a splat answers 200 for every
# district slug a stranger can type and turns "we have not built that room" into
# a blank page that looks broken.
[[redirects]]
  from = "/voice"
  to = "/voice.html"
  status = 200

# The trailing-slash form. Same root-absolute rule as above, for the same reason:
# served at /voice/, a bare src="district-voice.js" would be answered with this
# HTML document. scripts/test-voice-shell.mjs fails the build on a relative
# same-origin path in voice.html.
[[redirects]]
  from = "/voice/"
  to = "/voice.html"
  status = 200

# ═════════════════════════════════════════════════════════════════════════════
# THE DISTRICT VOICE READERS: /district/<alias> -> district-<alias>.html
# ─────────────────────────────────────────────────────────────────────────────
# FIVE ADDRESSES, FIFTEEN RULES, AND NOT ONE WILDCARD.
#
#   /district/ut-sd-3   Utah Senate District 3    North Ogden, Weber County
#   /district/ut-hd-16  Utah House District 16    Layton, Davis County
#   /district/ut-sd-7   Utah Senate District 7    Layton, Davis County
#   /district/ut-cd-2   Utah's 2nd Congressional  the court-ordered 2026 map
#   /district/ut-hd-15  Utah House District 15    Layton, Davis County
#
# WHAT THESE ADDRESSES ARE. A district read as a PLACE rather than as a person.
# /p/<pid> is a sitting member's file and /voice is where a reader is placed at
# whatever seat their own saved location names. Neither of those is an address
# you can hand to a neighbour and say "this is our district". These are.
#
# WHY FLAT FILES AND NOT A PATTERN — THE SAME ANSWER AT FIVE ROWS AS AT ONE.
# The obvious rule here was /district/* to one template that reads the seat off
# the path, and it is deliberately NOT what this is. A splat would publish an
# address for all 29 Utah senate seats, all 75 house seats, all four
# congressional districts and anything else anybody typed, and every one of
# those pages would load, render three bands and print zeroes — a board that
# exists at every address in the state on the night five boards opened.
# /api/district-board answers a seat that is not on its allow-list with 404 for
# the same reason, and district-voice.js's BOARD_ROUTES grew from one row to
# five rather than into a regex. FIVE DISTRICTS HAVE A READER, SO FIVE
# DISTRICTS HAVE AN ADDRESS; the sixth is three more lines in this file, and
# those three lines are the record that a decision was made. The moment this
# block is shorter than the list of boards, one of them is a 404 and the other
# is a lie. HD-15 was the fifth and it cost exactly three lines, which is the
# whole argument for writing them by hand.
#
# THREE SPELLINGS PER DOCUMENT. The bare path is canonical and the only one
# printed anywhere — in district-board.js's BOARDS table, in the control on the
# sitting member's person file, in /voice's Open-board link, and in the
# <link rel="canonical"> of the document itself. The trailing slash is declared
# rather than left to Netlify's own 301 so a pasted /district/ut-hd-16/ is the
# page instead of a hop; it is ALSO the reason every same-origin path inside
# each district-*.html is root-absolute with no exceptions, because served at
# /district/ut-hd-16/ a bare src="district-board.js" resolves to
# /district/ut-hd-16/district-board.js, these rules answer that with the HTML
# document, and the browser is handed HTML and told to parse it as JavaScript.
# The .html form is declared because /voice, /money and /my-stances all serve
# an .html file from an extensionless path, so a reader who guesses the
# underlying filename guesses THIS shape — and a guess that 404s teaches
# nothing. The suite asserts, for every one of the five aliases, that all three
# spellings are present, all three are 200, all three point at that alias's own
# document, and nothing above them matches.
#
# ONE DOCUMENT PER SEAT, NOT ONE DOCUMENT FOR FIVE SEATS. The five files are
# the same shell with a different seat declared in the head and on the host
# element; district-board.js is parameterised by that seat and was not forked.
# The reason the rewrites do not collapse to a single `to` is the service
# worker: sw.js precaches each document and serves the offline shell PER PATH,
# so /district/ut-cd-2 offline is the UT-2 document and not SD-3's heading over
# UT-2's URL.
#
# ORDER: FIFTEEN EXACT PATHS, NO PREFIX, NO SPLAT. Disjoint by inspection of the
# literal strings from every rule above — /d/* is a different first segment
# from /district/, which is the one collision worth saying out loud, since
# /d/ut-sd-3 and /district/ut-sd-3 name the same seat and are two different
# documents on purpose: the former is the seat file inside index.html, this is
# the board. The invariant for whoever adds a rule above: nothing matching
# /district/<one of those five aliases> may be declared earlier, and the day a
# /district/* or a catch-all appears these fifteen must stay in front of it.
# ═════════════════════════════════════════════════════════════════════════════

# ── Utah Senate District 3 ───────────────────────────────────────────────────
[[redirects]]
  from = "/district/ut-sd-3"
  to = "/district-ut-sd-3.html"
  status = 200

# The trailing-slash form — see the root-absolute rule above, which exists
# because of this line specifically.
[[redirects]]
  from = "/district/ut-sd-3/"
  to = "/district-ut-sd-3.html"
  status = 200

# The filename a reader might guess from the extensionless path. Same document,
# not a second canonical: district-ut-sd-3.html's <link rel="canonical"> names
# the bare /district/ut-sd-3 and nothing on the site links this spelling. The
# same is true of the .html row under each of the four aliases below.
[[redirects]]
  from = "/district/ut-sd-3.html"
  to = "/district-ut-sd-3.html"
