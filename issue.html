<!-- ═════════════════════════════════════════════════════════════════════════════
     issue.html — THE THIRD SHELL. /i/<key> IS ITS OWN DOCUMENT.
     ────────────────────────────────────────────────────────────────────────────
     WHAT WAS WRONG. The first split gave the person file its own document, and
     the very next tap undid the win. Every "🏛 Issue file" control on a person
     record — the gap sheet's title, the stance tree's leaf row, the Word-vs-Action
     shape row, the mandate chip — is an <a href="/i/<key>">, and netlify.toml
     rewrote /i/* to index.html. So a reader on /p/lee who tapped Issue File
     downloaded the 2.3 MB homepage OS to read one issue's formal record: the
     homepage grids, Compare Hub, the account graph, Door 2, Your File, the
     Archive, the Locker, the 1.2 MB spotlight fuel — none of it on the page they
     asked for, all of it on the main thread.

     WHAT THIS IS. The issue dossier's own shell, served for /i/* by a single
     netlify.toml rewrite. It carries the ledger lane and nothing else:

       • the SAME promise-ledger, Firebase-boot and split-seam blocks person.html
         carries, copied VERBATIM FROM person.html rather than forked a third
         time (see the marker comment above each — scripts/test-issue-shell.mjs
         pins every one byte-identical to its source lines in person.html, so a
         fix applied to one document cannot silently skip the others);
       • the builder the dossier is already made of: pdx-issue-profile.js reads
         /i/<key> off the path, PDXDoor1.issueProfile (door1-workspace.js) builds
         the ledger, PDXIssueFile mounts it, PDXConsistency.formalPatternIndex and
         PDXIssueView.buildRanking supply the formal record behind it. No second
         issue UI is invented here and nothing is rebuilt;
       • 42 module scripts — the issue register, the formal record, the ledger and
         the gap sheet a row opens.

     WHAT IT DELIBERATELY DOES NOT CARRY. compare-hub.js, alignment-tool.js,
     like-dislike.js, journey.js, support-route.js, self-defection.js,
     my-profile.js, my-stances.js, ballot-workspace.js, archive-browse.js,
     evidence-locker.js, all-seeing-eye.js, your-file.js, voter-hub-location.js,
     account-graph.js, spotlights-data.js, issue-page.js, the homepage card and
     relevant-grid stack and the Door surfaces. It also drops two modules
     person.html keeps: profiles-full.js (593 KB of person records — a ledger row
     names a person, it does not paint one, and without it a person name in a row
     is a real cross-document navigation to /p/<pid>, which is the behaviour
     person-link.js documents as the right one) and word-action.js (424 KB — the
     dossier does not read it).

     Every reference to a dropped module from a module that DOES ship here is a
     `typeof` or `&&` optional lookup, so its absence costs the dossier a block,
     never its boot. The unguarded exceptions are exactly the ones person.html
     already answers: alignment-tool.js's issue vocabulary, answered by
     /issue-map.js, and window._pdxMandateForIssue, answered by the split-seam
     stub copied below. Door 1's DESK is not mounted here on purpose —
     door1-workspace.js's sync() returns false without its mount and paints
     nothing. .netlify/results.md lists what an issue file loses on this shell.

     THE RULE THIS DOCUMENT LIVES BY: EVERY SAME-ORIGIN PATH IS ROOT-ABSOLUTE.
     /i/* is served with HTTP 200 at a two-segment path, so `src="issue-map.js"`
     resolves to /i/issue-map.js, the rewrite catches it, and the browser is
     handed this document and told to parse HTML as JavaScript. A leading slash
     is correct at every depth. scripts/test-issue-shell.mjs fails the build on a
     relative src or href anywhere in this file.

     NO JSON-LD AND NO SCORE. index.html's WebSite/Organization block describes
     the front page and an issue file is not the front page; issue-level
     structured data belongs to the record, not to the shell, and this split does
     not invent it. Nothing here prints a percentage, a party score or a blend.

  <!-- ══ COPIED VERBATIM FROM person.html LINES 1373–1882 ═════════════════
       THE PROMISE LEDGER AND THE FIRESTORE GATE. This block is on this document
       for one narrow, unavoidable reason: firebase-boot.js reads the BARE
       identifiers `_firestoreLoaded` and `_checkAndTrigger` (lines 208, 209,
       223, 233, 234, 238, 239) and neither is declared in that file. They are
       declared here, in the same closure-free head scope index.html and
       person.html declare them in. Without this block firebase-boot.js throws on
       every /i/ address the moment the roster index lands, and the ledger's
       person names never resolve.

       The pledge helpers it also defines (`_pdxPledgeNote`, `_pdxCountsNote`,
       `_pdxDisplayScore` and the rest) have no reader on this shell — they are
       carried because the block is copied whole and byte-identical rather than
       cut down into a third fork, which is the rule this split works by. The
       header comment inside is person.html's own; the Promise % score is retired
       and nothing here prints a rate.

       COPIED FROM person.html, NOT FROM index.html. person.html already took
       this block verbatim out of index.html lines 1406–1915 and
       scripts/test-person-shell.mjs pins it there. This document pins to
       person.html, so the three copies form a chain rather than a fan and a fix
       to index.html surfaces as one test failure per document, not three forks
       drifting quietly. ═══════════════════════════════════════ -->

<script>
  // Capture DOMContentLoaded listeners to defer execution until after Firestore data is fetched
  var _deferredDomEvents = [];
  var _originalAddEventListener = document.addEventListener;
  document.addEventListener = function(type, listener, options) {
    if (type === 'DOMContentLoaded') {
      _deferredDomEvents.push({ listener: listener, options: options });
    } else {
      _originalAddEventListener.call(document, type, listener, options);
    }
  };

  var _firestoreLoaded = false;
  var _domContentLoaded = false;
  var _deferredRan = false;

  // Global cache for original states before they get overwritten by Firestore
  window._originalStates = {};

  // ── Promise ledger helpers (the Promise % score is RETIRED) ──────────────
  // PolitiDex publishes ONE integrity percentage: the ⚖️ Word vs Action score
  // (word-action.js). Promise Follow-Through used to be a second, rival rate —
  // "X% Kept Word" — and it is now retired as a scored metric everywhere. The
  // pledge ledger itself is untouched and is still shown, as COUNTS: kept,
  // broken and pending are real receipts and they feed the pledge tier of
  // Word vs Action.
  // So these helpers exist to state what is known WITHOUT a percentage:
  // `_pdxPledgeNote` / `_pdxCountsNote` / `_pdxTrackingNote` are the count
  // labels every surface should print where the rate used to sit.
  // `_pdxDisplayScore` survives only as a HAS-A-CLOSED-LEDGER state flag (a
  // number means "this record has resolved pledges", null means it does not) —
  // it must not be interpolated into markup as a figure, and `p.score` stays
  // untouched so sorting and the separate accountability model are unaffected.
  // The kept / broken tally behind the score, read from whichever shape a record
  // carries, plus the pending / partial side of the same ledger. `resolved` is
  // still kept + broken and nothing else — pending and partial are reported
  // separately so they can be SHOWN without ever entering the percentage.
  window._pdxPromiseTally = function(p) {
    if (!p) return { kept: 0, broken: 0, resolved: 0, pending: 0, partial: 0, unresolved: 0, tracked: 0 };
    var k = parseInt(p.kept, 10);   if (isNaN(k)) k = 0;
    var b = parseInt(p.broken, 10); if (isNaN(b)) b = 0;
    // Fall back to a detailed promise list / breakdown when the summary counts
    // are absent, so a profile that tracks promises only in those shapes still
    // counts as having a record.
    if (k + b === 0 && Array.isArray(p.promises)) {
      for (var i = 0; i < p.promises.length; i++) {
        var v = p.promises[i] && p.promises[i].verdict;
        if (v === 'kept') k++; else if (v === 'broken') b++;
      }
    }
    if (k + b === 0 && p.promiseBreakdown) {
      var pk = parseInt(p.promiseBreakdown.kept, 10);   if (!isNaN(pk)) k += pk;
      var pb = parseInt(p.promiseBreakdown.broken, 10); if (!isNaN(pb)) b += pb;
    }
    // The unresolved side, counted the same three ways. In the breakdown shape a
    // partial promise is stored as `compromise`. Pending and partial are gated
    // separately, unlike kept / broken: no record carries a summary `partial`
    // field, so a record with a summary pending count would otherwise lose the
    // partials sitting in its promises[] list. Each side only falls back when it
    // is still zero, so nothing is ever double counted.
    var pend = parseInt(p.pending, 10); if (isNaN(pend)) pend = 0;
    var part = parseInt(p.partial, 10); if (isNaN(part)) part = 0;
    var scanPend = (pend === 0), scanPart = (part === 0);
    if ((scanPend || scanPart) && Array.isArray(p.promises)) {
      for (var j = 0; j < p.promises.length; j++) {
        var uv = p.promises[j] && p.promises[j].verdict;
        if (scanPend && uv === 'pending') pend++;
        else if (scanPart && uv === 'partial') part++;
      }
    }
    if (p.promiseBreakdown) {
      if (pend === 0) { var bp = parseInt(p.promiseBreakdown.pending, 10);    if (!isNaN(bp)) pend += bp; }
      if (part === 0) { var bc = parseInt(p.promiseBreakdown.compromise, 10); if (!isNaN(bc)) part += bc; }
    }
    return {
      kept: k, broken: b, resolved: k + b,
      pending: pend, partial: part, unresolved: pend + part,
      tracked: k + b + pend + part
    };
  };
  window._pdxResolvedPromises = function(p) {
    return window._pdxPromiseTally(p).resolved;
  };
  window._pdxHasPromiseRecord = function(p) {
    return window._pdxResolvedPromises(p) > 0;
  };
  // ── Second honesty guard: a rate needs an INSPECTABLE ledger ──────────────
  // The guard above asks "has anything resolved?". That is necessary but not
  // sufficient. A record can carry summary `kept` / `broken` / `pending` counts
  // with no itemized promises[] behind them — 41 of the 756 roster records do —
  // and in that shape a published percentage is a number the reader cannot audit:
  // the Promise Tracker below it renders from promises[] and has nothing to show,
  // so the profile asserted "77%" while its own pledge list was empty.
  //
  // Under the one-score standard the pledge lane is a TIER of Word vs Action, not
  // a rival headline, and a tier that cannot be inspected does not get to publish
  // a rate. Counts still show — they are directly attested and useful. Only the
  // percentage is withheld, and only until an itemized ledger exists.
  //
  // Deliberately synchronous and re-read per render, and re-read is the operative
  // word. promises[] is populated from the record rather than fetched on its own,
  // but the RECORD can arrive in two passes: a cold /p/<pid> arrival now mounts the
  // full file off the bundled CMP_DATA seed and merges the Firestore document in
  // behind the paint (see window._pdxColdOpen in profiles-full.js), and a CMP_DATA
  // seed carries summary counts with no promises[] behind them. So for the length
  // of that window this returns false for a person whose itemized ledger is about
  // to land, and the pledge block reads "the individual pledges behind them are not
  // itemized yet".
  //
  // THAT IS THE RIGHT ANSWER AND NOT A PLACEHOLDER FOR ONE. It is exactly what the
  // guard is for: at that instant the ledger genuinely is not inspectable, the
  // Promise Tracker below genuinely has nothing to render, and the copy says "not
  // itemized yet" — the same sentence the 41 counts-only records get permanently,
  // with a "yet" that the merge then makes good on. No rate is published in either
  // state, so nothing is withheld on the way in and nothing is retracted on the way
  // out; the merge repaints and the ledger appears. A "still loading" variant here
  // would buy a reader nothing and would put a spinner where a true sentence is.
  // Which is why this stays synchronous: do NOT make it consult _pdxFullIds or the
  // merge promise.
  window._pdxHasItemizedPledges = function(p) {
    if (!p || !Array.isArray(p.promises)) return false;
    for (var i = 0; i < p.promises.length; i++) {
      if (p.promises[i]) return true;
    }
    return false;
  };
  // The Promise Score to DISPLAY: the stored score when there is a real record
  // AND that record is itemized enough to be checked, otherwise null (callers
  // render this as "—" / counts-only). Both guards are required — see
  // _pdxHasItemizedPledges above for why "something resolved" is not enough.
  window._pdxDisplayScore = function(p) {
    if (!p) return null;
    var s = p.score;
    if (s === null || s === undefined || s === '') return null;
    if (!window._pdxHasPromiseRecord(p)) return null;
    return window._pdxHasItemizedPledges(p) ? s : null;
  };
  // The sample size behind that percentage — "3 of 4 resolved" (long) or
  // "3/4 resolved" (short, for tight rails and table cells). Reads only the
  // kept / broken counts the score already rests on; pending and partial items
  // stay out of it, exactly as they stay out of the math. Returns '' when
  // nothing has resolved, so a no-record profile shows no percentage AND no
  // parenthetical rather than a hollow "0 of 0".
  window._pdxScoreDenominator = function(p, form) {
    var t = window._pdxPromiseTally(p);
    if (!t.resolved) return '';
    return form === 'short'
      ? t.kept + '/' + t.resolved + ' resolved'
      : t.kept + ' of ' + t.resolved + ' resolved';
  };
  // ── Four honest promise states ───────────────────────────────────────────
  // 'resolved' — something resolved AND the pledges are itemized, so a
  //              percentage is earned, checkable, and shown.
  // 'counts'   — something resolved but only as summary counts, with no
  //              inspectable promises[] behind them. Real, attested counts; no
  //              percentage. Added because withholding the rate must not cost the
  //              record its substance: a sitting member with 27 kept and 8 broken
  //              on file was falling through to the 'empty' branch and rendering
  //              "No record yet", which is a worse lie than the rate was.
  // 'tracking' — promises ARE on file but none has resolved. No percentage, and
  //              this must not look like an empty record either.
  // 'empty'    — nothing on file at all; the existing empty state stands.
  window._pdxPromiseState = function(p) {
    var t = window._pdxPromiseTally(p);
    if (t.resolved > 0) {
      return window._pdxHasItemizedPledges(p) ? 'resolved' : 'counts';
    }
    return t.unresolved > 0 ? 'tracking' : 'empty';
  };
  // The 'counts' label — what IS known, stated as counts, for the slot a
  // percentage would have filled: "27 kept · 8 broken" (short) or
  // "27 kept · 8 broken of 35 resolved" (long). '' in the other three states, so
  // a caller can render it unconditionally wherever it puts the rate.
  window._pdxCountsNote = function(p, form) {
    if (window._pdxPromiseState(p) !== 'counts') return '';
    var t = window._pdxPromiseTally(p);
    var base = t.kept + ' kept · ' + t.broken + ' broken';
    return form === 'short' ? base : base + ' of ' + t.resolved + ' resolved';
  };
  // The same counts, ungated: "27 kept · 8 broken" (short) or "27 kept · 8
  // broken of 35 resolved" (long) for ANY record with a closed pledge ledger,
  // itemized or not. This is what surfaces print where the retired Promise %
  // used to go — `_pdxCountsNote` above stays gated to the 'counts' state
  // because it also carries the "not itemized yet" caveat, but a surface that
  // simply wants the receipts, and would otherwise fall back to a percentage,
  // wants this one. '' when nothing has resolved.
  window._pdxPledgeNote = function(p, form) {
    var t = window._pdxPromiseTally(p);
    if (!t.resolved) return '';
    var base = t.kept + ' kept · ' + t.broken + ' broken';
    return form === 'short' ? base : base + ' of ' + t.resolved + ' resolved';
  };
  // Why the 'counts' state shows no percentage, in one voter-readable clause.
  // Kept next to the note above so no surface has to invent its own wording.
  window._pdxCountsWhy = function(p) {
    return window._pdxPromiseState(p) === 'counts'
      ? 'Counts are on file; the individual pledges are not itemized yet, so no rate is published.'
      : '';
  };
  // The 'tracking' label — "3 tracked · none resolved yet" (long) or
  // "3 tracked · none resolved" (short). '' in the other three states.
  window._pdxTrackingNote = function(p, form) {
    var t = window._pdxPromiseTally(p);
    if (t.resolved > 0 || !t.unresolved) return '';
    return t.tracked + ' tracked · none resolved' + (form === 'short' ? '' : ' yet');
  };
  // Unobtrusive companion to a real percentage — "+2 pending", "+1 partial" or
  // "+2 pending · 1 partial". Names what is still outstanding without implying it
  // counts toward the score. '' when nothing is outstanding.
  window._pdxPendingNote = function(p) {
    var t = window._pdxPromiseTally(p);
    var parts = [];
    if (t.pending) parts.push(t.pending + ' pending');
    if (t.partial) parts.push(t.partial + ' partial');
    return parts.length ? '+' + parts.join(' · ') : '';
  };
  // Count of tracked-but-unresolved promises, labelled for a tight slot:
  // "3 Promises" / "1 Promise".
  window._pdxTrackedCountLabel = function(p) {
    var t = window._pdxPromiseTally(p);
    if (!t.tracked) return '';
    return t.tracked + (t.tracked === 1 ? ' Promise' : ' Promises');
  };

  // ── A BLANK IS NOT AN ANSWER, AND NEVER OVERWRITES ONE ────────────────────
  // This merge used to be Object.assign(CMP_DATA[id], p), and it is where a live
  // phone lost three officeholders. `p` is the LIGHT Firestore stub, and the loop
  // above defaults every essential field on it before the merge — so a document
  // that simply does not carry `office` or `state` arrives here carrying
  // office:'' and state:'', and Object.assign wrote those two empty strings over
  // the bundled roster's "U.S. Senator" / "Utah".
  //
  // Statewide seats are resolved from exactly those two strings (see
  // _pdxStatewideSeats in voter-hub-location.js), so the consequence was not a
  // cosmetic gap: Who Represents Me painted six of six for a Layton reader with
  // John Curtis, Mike Lee and Spencer Cox, the roster pill finished, this merge
  // ran, and the same three rows became "No record on file yet — we'd rather
  // leave this blank than name the wrong person" with the count at three of six.
  //
  // So the rule is the obvious one: a live document still wins every field it
  // actually has, and an absent field loses to whatever the bundle already knew.
  // Empty string, null, undefined and an empty array are all "the payload did not
  // carry this", because after the defaulting above they are literally
  // indistinguishable from it — a deliberately-cleared field in Firestore reaches
  // this line looking exactly like a missing one, and of the two readings only
  // this one can be wrong in the direction of deleting a sitting senator.
  function _pdxMergeRosterRecord(dst, src) {
    if (!dst || !src) return dst;
    Object.keys(src).forEach(function (k) {
      var v = src[k];
      var blank = (v === '' || v === null || v === undefined ||
                   (Array.isArray(v) && !v.length));
      if (blank && !_pdxIsBlankValue(dst[k])) return;
      dst[k] = v;
    });
    return dst;
  }
  function _pdxIsBlankValue(v) {
    return v === '' || v === null || v === undefined || (Array.isArray(v) && !v.length);
  }

  function _checkAndTrigger() {
    if (_firestoreLoaded && _domContentLoaded) {
      console.log("⚡ BOTH Firestore and DOMContentLoaded are ready. Syncing data and running deferred events.");
      // Copy PROFILES to CMP_DATA if CMP_DATA is defined
      if (typeof CMP_DATA !== 'undefined') {
        // Cache original states before merging Firestore profiles
        Object.keys(CMP_DATA).forEach(function(id) {
          if (CMP_DATA[id] && CMP_DATA[id].state) {
            window._originalStates[id] = CMP_DATA[id].state;
          }
        });

        Object.keys(PROFILES).forEach(function(id) {
          var p = PROFILES[id];
          if (p) {
            // Ensure essential properties have defaults so rendering never crashes
            p.name = p.name || '';
            p.office = p.office || '';
            p.state = p.state || '';
            p.party = p.party || '';
            p.score = p.score !== undefined ? p.score : null;
            p.kept = p.kept !== undefined ? p.kept : 0;
            p.broken = p.broken !== undefined ? p.broken : 0;
            p.pending = p.pending !== undefined ? p.pending : 0;
            p.icon = p.icon || '🏛';
            
            // Normalize issues array
            var rawIssues = p.issues || p.keyIssues || [];
            if (!Array.isArray(rawIssues)) {
              if (typeof rawIssues === 'string') {
                p.issues = rawIssues.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
              } else {
                p.issues = [];
              }
            } else {
              p.issues = rawIssues;
            }
          }

          if (!CMP_DATA[id]) {
            CMP_DATA[id] = p;
          } else {
            _pdxMergeRosterRecord(CMP_DATA[id], p);
          }
        });
      }
      // ── In-file officeholders not (yet) in the live Firestore roster ──────
      // A short allow-list of current, curated officials who exist only in the
      // bundled static roster (CMP_DATA): they carry full ISSUE_STANCE_DATA and
      // Evidence Locker records here but have no politicians/ document yet. Seed
      // them into PROFILES so they show up in the public directory/search and
      // open like any other profile. Guarded on (!PROFILES[id]) so a later
      // Firestore document always wins, and safe to re-run.
      //
      // The federal block below is the National 7–10 batch: the Vice President,
      // Cabinet secretaries, congressional leadership (Speaker, floor leaders,
      // whips), key committee chairs, and high-profile members. They were wired
      // into CMP_DATA (so comparison and browse already reach them) but had no
      // Firestore document, so without this seed they never entered PROFILES and
      // were missing from the public directory, global search, and Your Ballot.
      // Each id matches its ISSUE_STANCE_DATA card, so the curated stances light
      // up on their profiles directly.
      [
        'lorene_kamalu',
        // National 7 — top of the federal ticket & congressional leaders
        'vance', 'thune', 'jeffries', 'schumer',
        // National 8 — Speaker, Cabinet, high-profile members
        'mike_johnson', 'rubio', 'bessent', 'cruz', 'aoc',
        // National 9 — Cabinet, floor leaders & whips
        'bondi', 'noem', 'lutnick', 'scalise', 'barrasso', 'emmer', 'durbin', 'kclark',
        'jim_jordan', 'jason_smith', 'burgum', 'chris_wright', 'zeldin', 'vought', 'rollins',
        // National 10 — committee chairs & influential members
        'grassley', 'rand_paul', 'graham', 'hawley', 'murkowski', 'warren', 'fetterman',
        'booker', 'crockett', 'khanna',
        // National wave 18 — administration power players & influential members (July 2026)
        'tom_homan', 'peter_navarro', 'stephen_miran', 'keith_kellogg', 'dan_crenshaw',
        'raja_krishnamoorthi', 'josh_gottheimer', 'seth_moulton', 'marie_gluesenkamp_perez', 'jon_ossoff',
        // National wave 19 — high-profile senators & influential members (July 2026)
        'ted_budd', 'kevin_hern', 'nancy_mace', 'tommy_tuberville', 'ayanna_pressley',
        'delia_ramirez', 'sarah_mcbride', 'jake_auchincloss', 'greg_landsman', 'john_cornyn',
        // // Federal-wave directory backfill (waves 2-17): federal figures added to CMP_DATA by earlier waves

       THE SPLIT SEAM. The same two stubs, unchanged, because the first of them
       is required here for the same reason and by the same file: stance-helpers
       .js ships on this document, it publishes window._pdxMandateChip, and it
       calls that chip from three places of its own (3054, 3556, 4024). The
       chip's body then calls window._pdxMandateForIssue(issueKey) with no guard
       and no try/catch, and its only real definition is index.html's People's
       Mandate block — a Door surface these splits exist to keep off these
       addresses. Unstubbed, the evidence rows behind a ledger entry throw
       mid-render.

       The second stub, _pdxPromiseInfo, has no reader here at all: its only
       caller is profiles-full.js, which this document does not ship. It is
       carried because the block is copied whole rather than cut down, and
       because both stubs install only if absent. The prose inside is
       person.html's own and names /p/ addresses; that is the cost of one copy
       instead of a third fork, and it is the cheaper cost. ══════════════ -->
  <script>
  // Almost everything this shell drops is reached through a `typeof` check, so
  // its absence costs a person file one block and nothing else. Exactly two
  // reads are not guarded, and both come from code that DOES ship here.
  //
  // _pdxMandateForIssue — stance-helpers.js ships window._pdxMandateChip, and
  //   profiles-full.js calls the chip under a `typeof` guard that PASSES. The
  //   chip's own body then calls window._pdxMandateForIssue(issueKey) with no
  //   guard and no try/catch. Its only definition is the People's Mandate block
  //   in index.html (around line 27058) — a Door surface this split exists to
  //   keep off a person file. Unstubbed, the first stance row on every /p/
  //   address throws mid-render and the file stops painting.
  //
  //   Returning [] is not a placeholder standing in for a real answer: it IS
  //   this document's answer. No citizen reform is on file on a shell that does
  //   not carry the Mandate, the chip resolves to '' on an empty list, and an
  //   issue with no reform tied to it renders exactly the same way on
  //   index.html. The person file says nothing instead of guessing.
  //
  // _pdxPromiseInfo — defined by like-dislike.js; profiles-full.js writes its
  //   name into an onclick attribute string on the Word vs Act figure. That is
  //   a click-time TypeError rather than a render throw, so the file would
  //   still paint — but the figure would be a control that visibly fails. A
  //   no-op makes it inert: the number still reads, tapping it does nothing.
  //   .netlify/results.md records that as a deliberate gap in the first split.
  //
  // Both are installed only if absent, so a later document that ships the real
  // definitions overrides these rather than fighting them.
  if (typeof window._pdxMandateForIssue !== 'function') {
    window._pdxMandateForIssue = function () { return []; };
  }
  if (typeof window._pdxPromiseInfo !== 'function') {
    window._pdxPromiseInfo = function () {};
  }
  </script>

       that person's file, and publishes the same answer for the panel's own
       close control to use. It never guesses. Absent, malformed or sentinel pid

       overlay: closing it reveals the homepage that was underneath, and
       pdx-issue-profile.js's restore() hands the address back with a
       replaceState. On THIS document there is nothing underneath — closing the
       panel would leave a reader on an empty issue shell whose address had been
       rewritten to "/", which is the "X goes to /, then pay for the homepage"
       path live smoke found. So the close has to LEAVE, and where it leaves to
       is the question this block answers: the person file when the address names
       one, the front page when it does not.

         · "← Person file" (the anchor above) and the panel's X → /p/<pid>

           other two, because "back to whose record I was reading" and "show me
           everyone" are different questions and a reader on a phone needs both.
         · The browser's own Back → wherever they actually came from.
       history.back() is PREFERRED for the X when the referrer says this document
       was opened from that same person's file, because it restores their scroll
       position in the file and spends no new history entry; the explicit href is
       the fallback for a cold open, a shared link or a referrer the browser
       withheld. Never both: the two would fight.

       THE ADDRESS IS BUILT BY THE FILE THAT OWNS IT. PDXPersonLink.href() is the
       one builder for a person address — it runs the retired-id alias hop and
       the pid shape wall, and returns '' for anything it will not advertise —
       and PDXPersonLink.PREFIX is how the referrer is recognised. No person path
       is spelled here, so this bar cannot end up linking to an address the app
       does not serve, and the referrer comparison is canonical-against-
       canonical: /p/<retired-id> as a referrer still matches ?pid=<current-id>.

       THE SHAPES IT ACCEPTS, and they are the only ones: ?pid=<pid>, ?p=<pid>,
       #p/<pid> and #/p/<pid>. All six Issue File doors on a person file emit the
       first. Reading location.search directly rather than through URLSearchParams
       keeps this working on the oldest engines the rest of the shell still
       supports; a throw here must not cost the page its boot. -->

    var href = '';
    var pid = '';
    var viaBack = false;
    try {
      var raw = '';
      var m = String(location.search || '').match(/[?&](?:pid|p)=([^&#]*)/);
      if (m) { try { raw = decodeURIComponent(m[1]); } catch (e) { raw = m[1]; } }
      if (!raw) {
        var h = String(location.hash || '').match(/^#\/?p\/([^/?&#]+)/);
        if (h) { try { raw = decodeURIComponent(h[1]); } catch (e2) { raw = h[1]; } }
      }
      var PL = window.PDXPersonLink;
      if (raw && PL && typeof PL.href === 'function') {
        href = PL.href(raw) || '';
        if (href && typeof PL.pid === 'function') pid = PL.pid(raw) || '';
      }
      // Did this document come from that same person's file? Compared as two
      // canonical addresses, both built by PDXPersonLink, so an alias spelling
      // on either side still matches.
      if (href && PL && PL.PREFIX) {
        var org = '';
        try { org = String(location.origin || (location.protocol + '//' + location.host)); } catch (e3) { org = ''; }
        var ref = String(document.referrer || '');
        var head = org + String(PL.PREFIX);

          var seg = ref.slice(head.length).split(/[/?#]/)[0];
          if (seg) {
            var dec = seg;
            try { dec = decodeURIComponent(seg); } catch (e4) { dec = seg; }
            viaBack = (PL.href(dec) || '') === href;
          }
        }
      }
      if (href) {
        var a = document.getElementById('pdx-issue-back');
        if (a) {
          a.setAttribute('href', href);
          a.removeAttribute('hidden');
        }
      }
    } catch (e) {}
    // The answer, published for pdx-issue-profile.js's restore(). Its presence is
    // also the signal that this is the ISSUE SHELL rather than the homepage with
    // an issue file open over it: index.html publishes no PDXIssueBack, so its
    // overlay keeps closing onto the page underneath exactly as before. The same
    // is true of the gap sheet on a person file — nothing here turns an in-page
    // overlay into a navigation.
    try {
      window.PDXIssueBack = {
        pid: pid,
        href: href,
        fromPerson: viaBack,
        target: function () { return href || '/'; },
        leave: function () {
          try {
            if (viaBack && typeof history !== 'undefined' && history.length > 1 &&

            }

          try { location.assign(href || '/'); return true; } catch (e2) {}
          try { location.href = href || '/'; return true; } catch (e3) {}
          return false;
        }
      };
    } catch (e) {}
  })();

  <script>

    // ── Offline status banner ───────────────────────────────────────────
    // A single, unobtrusive bottom banner. Saved team & evidence live in
    // localStorage, so they keep working offline — we just tell the voter
    // that live features (new data, sync, community) are paused.
    function ensureBanner() {
      var el = document.getElementById('pdx-offline-banner');
      if (el) return el;
      el = document.createElement('div');
      el.id = 'pdx-offline-banner';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      el.style.cssText = [
        'position:fixed', 'left:0', 'right:0', 'bottom:0', 'z-index:2147483000',
        'transform:translateY(110%)', 'transition:transform .28s ease',
        'background:linear-gradient(180deg,#141a2e,#0a0f1e)',
        'color:#e5e9f0', 'border-top:1px solid rgba(192,21,42,.55)',
        'box-shadow:0 -8px 24px rgba(0,0,0,.45)',
        'font-family:\'Barlow\',system-ui,-apple-system,sans-serif',
        'padding:calc(.7rem + env(safe-area-inset-bottom,0px)) 1rem .7rem',
        'display:flex', 'align-items:center', 'gap:.6rem', 'justify-content:center',
        'font-size:.9rem', 'line-height:1.3', 'text-align:center'
      ].join(';');
      el.innerHTML =
        '<span aria-hidden="true" style="font-size:1.05rem">📡</span>' +
        '<span><strong style="color:#fff">You’re offline</strong> — some features are limited. ' +
        'Your saved ballot &amp; evidence are still available.</span>';
      (document.body || document.documentElement).appendChild(el);
      return el;
    }

    // ── THE FALSE-OFFLINE BUG, AND WHY THE GUARD IS HERE ────────────────
    // Reported from a phone on cell data with a working connection: the 📡
    // "You're offline" banner was up while the page loaded and fetched fine.
    // It was not a network problem. It was this block's state machine.
    //
    // The banner used to be driven ENTIRELY by the `online`/`offline` event
    // pair, with `navigator.onLine` consulted once at boot. Those events are
    // edge-triggered, and on a phone the edges get dropped:
    //
    //   · A CARRIER HANDOVER (cell → wifi, tower → tower, a tunnel, a lift)
    //     fires `offline`, and the matching `online` arrives while the tab is
    //     frozen in the background. A frozen page does not run listeners and
    //     the event is not replayed on resume, so the page wakes up holding a
    //     state that stopped being true minutes ago.
    //   · A BACKGROUNDED OR BACK/FORWARD-CACHED TAB restores from the page
    //     cache with its DOM intact — banner included, still translated to
    //     Y(0) — and `pageshow` is the only notification it gets.
    //   · `showBanner()` ITSELF NEVER CHECKED. Any call from any path showed
    //     the banner unconditionally, so one stale edge was permanent: nothing
    //     in the block would take it down again until a real `online` fired.
    //
    // Two changes fix it, and both are deliberately of the "cannot be wrong"
    // kind rather than the "detects better" kind:
    //
    //   1. showBanner() IS SELF-GUARDED. `navigator.onLine === true` is the
    //      browser's own answer and it is authoritative in the one direction
    //      that matters here: the flag can be true while a captive portal eats
    //      the traffic (a false POSITIVE for connectivity), but it is not true
    //      while the radio is off. So an online flag is a hard refusal to paint
    //      the banner — the failure mode becomes "we didn't warn you", which
    //      costs a confused fetch, instead of "we told you you're offline while
    //      you're not", which costs the reader's trust in everything else on
    //      the page. Refusals are counted on window.PDXNet for the console.
    //
    //   2. THE STATE IS RE-READ, NOT REMEMBERED. `visibilitychange`,
    //      `pageshow` and `focus` all re-run the sync, because each is a moment
    //      the page may have missed an edge while it was not running. Reading a
    //      flag costs nothing; trusting an event that may never have been
    //      delivered costs the bug above.
    //
    // NO PROBE WAS ADDED. A background fetch to test the connection would be
    // the obvious "real" detector and it is the wrong tool: it spends the
    // reader's cell data to second-guess a flag that is already correct in the
    // case being fixed, and it would keep spending it on a slow connection —
    // the exact one where a timeout looks like an outage.
    var refusedWhileOnline = 0;

    function showBanner() {
      // The guard. See above: an online flag means this banner is a lie.
      if (navigator.onLine !== false) { refusedWhileOnline++; hideBanner(); return; }
      var el = ensureBanner();
      requestAnimationFrame(function () {
        // Re-checked inside the frame: the radio can come back between the call
        // and the paint, and a banner that appears one frame after the network
        // returns is the same bug with better timing.
        if (navigator.onLine !== false) { refusedWhileOnline++; hideBanner(); return; }
        el.style.transform = 'translateY(0)';
      });
    }
    function hideBanner() {
      var el = document.getElementById('pdx-offline-banner');
      if (el) el.style.transform = 'translateY(110%)';
    }

    function syncOnlineState() {
      if (navigator.onLine === false) showBanner();
      else hideBanner();
    }

    window.addEventListener('online', syncOnlineState);
    window.addEventListener('offline', syncOnlineState);
    // The three moments a page can have missed an edge while it was not
    // running. Each re-reads the flag rather than trusting what it remembers.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') syncOnlineState();
    });
    window.addEventListener('pageshow', syncOnlineState);
    window.addEventListener('focus', syncOnlineState);
    // Reflect initial state (covers reloads that start offline). Unconditional
    // now: when the flag says online this takes a restored banner back down,
    // which is the back/forward-cache case above.
    if (document.body) syncOnlineState();
    else window.addEventListener('DOMContentLoaded', syncOnlineState);
    // Expose a tiny helper so other code can query PWA/offline status if
    // needed. `falseOfflineRefusals` is the diagnostic: if it is ever above
    // zero, something asked for the offline banner while the browser said the
    // connection was up, and this block declined.
    window.PDXNet = {
      isOnline: function () { return navigator.onLine !== false; },
      falseOfflineRefusals: function () { return refusedWhileOnline; },
      _sync: syncOnlineState
    };

    // ── Service worker registration ─────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // Was this page ALREADY under a worker's control before we registered?
        // This is the only reliable way to tell a genuine shell update from a
        // first install, and getting it wrong was a real bug: sw.js calls
        // skipWaiting() on install and clients.claim() on activate, so on a
        // visitor's FIRST ever load the brand-new worker claims this
        // uncontrolled page, 'controllerchange' fires, and the old code below
        // reloaded — every first visit rebooted itself mid-read, a few seconds
        // in. The `refreshing` flag never guarded that; it only stopped a
        // second reload within the same page.
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          var refreshing = false;

          // A reload is never urgent, but it IS destructive: it throws away an
          // open profile, a half-typed composer, and the reader's place on the
          // page. So when a genuine update lands we only reload at a moment
          // where that costs nothing — otherwise we wait until the tab is
          // backgrounded and do it off-screen, or simply leave it for the next
          // navigation (the worker has already refreshed the cached shell).
          function busy() {
            try {
              if (window.PDXStability && window.PDXStability.isLocked()) return true;
              var a = document.activeElement;
              if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' ||
                        a.isContentEditable)) return true;
            } catch (e) {}
            return false;
          }
          function reloadWhenIdle() {
            if (refreshing) return;
            if (!busy()) { refreshing = true; location.reload(); return; }
            // Try again the moment the tab goes to the background.
            document.addEventListener('visibilitychange', function onHide() {
              if (document.visibilityState !== 'hidden' || refreshing) return;
              document.removeEventListener('visibilitychange', onHide);
              refreshing = true;
              location.reload();
            });
          }

          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!hadController) return;   // first install — nothing to refresh to
            reloadWhenIdle();
          });
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              // A new worker is waiting and we already control the page →
              // activate it immediately for a seamless update.
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                nw.postMessage('SKIP_WAITING');
              }
            });
          });
        }).catch(function () { /* SW unsupported/blocked — app still works */ });
      });
    }
  })();
  </script>
