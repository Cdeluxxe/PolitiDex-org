  <!-- ══ COPIED VERBATIM FROM index.html LINES 28145–28265 ═════════════════
       PDXStance — the shared four-state stance language (support / oppose /
       mixed / none), read by the profile's Key Issue Stances. Copied rather than
       re-derived so both documents speak the identical vocabulary; the Issue
       Spotlight engine that follows it in index.html is not copied.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
  // ── PDXStance — shared canonical stance language (single source of truth) ────
  // Lifted out of the Issue Spotlight "Who Stands Where" module so every surface
  // (Profile Key Issue Stances, Compare, My Priorities, Hot Topics, Evidence
  // Locker) can speak the exact same four-state language instead of maintaining
  // its own divergent copy. Read-only over existing stance records — no new data.
  //
  // Four canonical states (LOCKED — do not add a fifth):
  //   supported → teal   #4fd6b3   "Supported"
  //   opposed   → orange #ff9d84   "Opposed"
  //   mixed     → amber  #f3cb5c   "Mixed / Nuanced"
  //   none      → gray   #a4b4cc   "No Clear Position"
  //
  // Legacy/older vocabularies collapse into these on resolution:
  //   "Researching" / "On record" / tracking / unknown / missing → none
  //   "Top Priority" is NOT a stance color — it is a separate emphasis marker,
  //   surfaced via PDXStance.isTopPriority() (the visual star is handled later).
  //
  // The pill markup + colors mirror the .pdxis-stance-* CSS exactly, so callers
  // get the calm Who Stands Where look (thin border, low-saturation fill, small
  // "STANCE" caption + color dot) for free.
  (function () {
    'use strict';
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Canonical state definitions. `cls` maps to the .pdxis-stance-<cls> CSS.
    // `color` is the accent (dot + text); `fill`/`border` mirror that CSS so a
    // surface building bespoke markup can match Who Stands Where without guessing.
    var STATES = {
      supported: { key:'supported', label:'Supported',         cls:'supported', color:'#4fd6b3', fill:'rgba(45,212,164,.13)', border:'rgba(45,212,164,.42)' },
      opposed:   { key:'opposed',   label:'Opposed',           cls:'opposed',   color:'#ff9d84', fill:'rgba(248,113,90,.13)', border:'rgba(248,113,90,.42)' },
      mixed:     { key:'mixed',     label:'Mixed / Nuanced',   cls:'mixed',     color:'#f3cb5c', fill:'rgba(245,193,66,.13)', border:'rgba(245,193,66,.42)' },
      none:      { key:'none',      label:'No Clear Position', cls:'none',      color:'#a4b4cc', fill:'rgba(140,156,182,.1)', border:'rgba(140,156,182,.3)' }
    };
    var ORDER = ['supported', 'opposed', 'mixed', 'none'];

    // Raw string → canonical key. Recognizes the canonical keys/labels plus the
    // legacy vocabularies scattered across the older renderers (posMeta,
    // _prioStanceDir, STANCE_META, _POL_STANCE_META). Returns null when nothing
    // matches so callers can fall through before defaulting to `none`. Note:
    // "Top Priority"/"priority" deliberately do NOT resolve here — they are
    // emphasis, not a stance (see isTopPriority).
    var ALIASES = {
      'supported':'supported', 'support':'supported', 'supports':'supported', 'for':'supported', 'yes':'supported', 'favor':'supported', 'favors':'supported',
      'opposed':'opposed', 'oppose':'opposed', 'opposes':'opposed', 'against':'opposed', 'no':'opposed',
      'mixed':'mixed', 'nuanced':'mixed', 'mixed / nuanced':'mixed', 'mixed record':'mixed', 'partial':'mixed', 'conditional':'mixed', 'complicated':'mixed',
      'none':'none', 'no clear position':'none', 'no position':'none', 'unknown':'none', 'unclear':'none',
      'researching':'none', 'tracking':'none', 'on record':'none'
    };
    function _norm(raw) {
      if (raw == null) return null;
      var v = String(raw).trim().toLowerCase();
      if (!v) return null;
      if (STATES[v]) return v;
      return Object.prototype.hasOwnProperty.call(ALIASES, v) ? ALIASES[v] : null;
    }

    // resolveStance(record[, override]) → one of the four canonical keys.
    // `record` may be a stance record ({issueStance|pos|stance|text}) or a raw
    // string. `override` (optional) is an explicit stance pinned by the surface
    // (e.g. a Spotlight person's `stance`) and wins when recognized. Mirrors the
    // original Who Stands Where derivation exactly:
    //   explicit override → issueStance/pos → any sourced text ⇒ mixed → none.
    function resolveStance(record, override) {
      var o = _norm(override);
      if (o) return o;
      if (record == null) return 'none';
      if (typeof record === 'string') { return _norm(record) || 'none'; }
      var raw = record.issueStance || record.pos || record.stance || record.dir || '';
      var n = _norm(raw);
      if (n) return n;
      if (record.text) return 'mixed';   // a sourced position we can't cleanly classify
      return 'none';
    }

    // Full state descriptor for a record/key (label, cls, color, fill, border).
    function stanceState(keyOrRecord) {
      var key = (typeof keyOrRecord === 'string' && STATES[keyOrRecord])
        ? keyOrRecord
        : (STATES[_norm(keyOrRecord)] ? _norm(keyOrRecord) : resolveStance(keyOrRecord));
      return STATES[key] || STATES.none;
    }

    // stancePill(keyOrRecord) → the calm pill element, byte-identical to the
    // original Who Stands Where markup. Accepts a canonical key or a raw record.
    function stancePill(keyOrRecord) {
      var s = STATES[keyOrRecord] || stanceState(keyOrRecord);
      return '<span class="pdxis-stance pdxis-stance-' + s.cls + '" title="Position on this issue: ' + esc(s.label) + '">' +
        '<span class="pdxis-stance-dot" aria-hidden="true"></span>' +
        '<span class="pdxis-stance-k">Stance</span>' + esc(s.label) + '</span>';
    }

    // Emphasis marker, kept strictly separate from the stance color. Detects the
    // legacy "Top Priority" flag/label so surfaces can render a star later without
    // polluting the four-state stance vocabulary.
    function isTopPriority(record) {
      if (record == null) return false;
      if (record === true) return true;
      if (typeof record === 'object') {
        if (record.priority === true || record.topPriority === true) return true;
        record = record.priority || record.emphasis || record.stance || record.tag || record.pos || '';
      }
      return /top\s*priority/i.test(String(record));
    }

    window.PDXStance = {
      STATES: STATES,          // canonical state definitions (label/cls/color/fill/border)
      ORDER: ORDER,            // stable render order of the four states
      resolveStance: resolveStance,
      stanceState: stanceState,
      stancePill: stancePill,
      normalize: _norm,        // raw string → canonical key or null
      isTopPriority: isTopPriority,
      esc: esc
    };
  })();
  </script>

  <!-- ══ COPIED VERBATIM FROM index.html LINES 32671–32866 ═════════════════
       THE PWA RUNTIME. Same registration, same first-install guard, same
       update handling — sw.js now precaches /person.html and this document's
       module list, and serves a person address from /person.html rather than
       from the 2.3 MB shell when the reader is offline.
       ═══════════════════════════════════════════════════════════════════════ -->
  <!-- ═══════════════════════════════════════════════════════════════════
       PWA runtime — service-worker registration + offline awareness.
       Progressive enhancement only: if the browser lacks service workers or
       registration fails, the site behaves exactly as before. Registration is
       deferred to `load` so it never competes with first paint or data fetches.
       ═══════════════════════════════════════════════════════════════════ -->
  <script>
  (function () {
    'use strict';

    // ── Offline status banner ───────────────────────────────────────────
    // A single, unobtrusive bottom banner. Saved team & evidence live in
    // localStorage, so they keep working offline — we just tell the voter
    // that live features (new data, sync, community) are paused.
    function ensureBanner() {
      var el = document.getElementById('pdx-offline-banner');
      if (el) return el;
      el = document.createElement('div');
      el.id = 'pdx-offline-banner';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      el.style.cssText = [
        'position:fixed', 'left:0', 'right:0', 'bottom:0', 'z-index:2147483000',
        'transform:translateY(110%)', 'transition:transform .28s ease',
        'background:linear-gradient(180deg,#141a2e,#0a0f1e)',
        'color:#e5e9f0', 'border-top:1px solid rgba(192,21,42,.55)',
        'box-shadow:0 -8px 24px rgba(0,0,0,.45)',
        'font-family:\'Barlow\',system-ui,-apple-system,sans-serif',
        'padding:calc(.7rem + env(safe-area-inset-bottom,0px)) 1rem .7rem',
        'display:flex', 'align-items:center', 'gap:.6rem', 'justify-content:center',
        'font-size:.9rem', 'line-height:1.3', 'text-align:center'
      ].join(';');
      el.innerHTML =
        '<span aria-hidden="true" style="font-size:1.05rem">📡</span>' +
        '<span><strong style="color:#fff">You’re offline</strong> — some features are limited. ' +
        'Your saved ballot &amp; evidence are still available.</span>';
      (document.body || document.documentElement).appendChild(el);
      return el;
    }

    // ── THE FALSE-OFFLINE BUG, AND WHY THE GUARD IS HERE ────────────────
    // Reported from a phone on cell data with a working connection: the 📡
    // "You're offline" banner was up while the page loaded and fetched fine.
    // It was not a network problem. It was this block's state machine.
    //
    // The banner used to be driven ENTIRELY by the `online`/`offline` event
    // pair, with `navigator.onLine` consulted once at boot. Those events are
    // edge-triggered, and on a phone the edges get dropped:
    //
    //   · A CARRIER HANDOVER (cell → wifi, tower → tower, a tunnel, a lift)
    //     fires `offline`, and the matching `online` arrives while the tab is
    //     frozen in the background. A frozen page does not run listeners and
    //     the event is not replayed on resume, so the page wakes up holding a
    //     state that stopped being true minutes ago.
    //   · A BACKGROUNDED OR BACK/FORWARD-CACHED TAB restores from the page
    //     cache with its DOM intact — banner included, still translated to
    //     Y(0) — and `pageshow` is the only notification it gets.
    //   · `showBanner()` ITSELF NEVER CHECKED. Any call from any path showed
    //     the banner unconditionally, so one stale edge was permanent: nothing
    //     in the block would take it down again until a real `online` fired.
    //
    // Two changes fix it, and both are deliberately of the "cannot be wrong"
    // kind rather than the "detects better" kind:
    //
    //   1. showBanner() IS SELF-GUARDED. `navigator.onLine === true` is the
    //      browser's own answer and it is authoritative in the one direction
    //      that matters here: the flag can be true while a captive portal eats
    //      the traffic (a false POSITIVE for connectivity), but it is not true
    //      while the radio is off. So an online flag is a hard refusal to paint
    //      the banner — the failure mode becomes "we didn't warn you", which
    //      costs a confused fetch, instead of "we told you you're offline while
    //      you're not", which costs the reader's trust in everything else on
    //      the page. Refusals are counted on window.PDXNet for the console.
    //
    //   2. THE STATE IS RE-READ, NOT REMEMBERED. `visibilitychange`,
    //      `pageshow` and `focus` all re-run the sync, because each is a moment
    //      the page may have missed an edge while it was not running. Reading a
    //      flag costs nothing; trusting an event that may never have been
    //      delivered costs the bug above.
    //
    // NO PROBE WAS ADDED. A background fetch to test the connection would be
    // the obvious "real" detector and it is the wrong tool: it spends the
    // reader's cell data to second-guess a flag that is already correct in the
    // case being fixed, and it would keep spending it on a slow connection —
    // the exact one where a timeout looks like an outage.
    var refusedWhileOnline = 0;

    function showBanner() {
      // The guard. See above: an online flag means this banner is a lie.
      if (navigator.onLine !== false) { refusedWhileOnline++; hideBanner(); return; }
      var el = ensureBanner();
      requestAnimationFrame(function () {
        // Re-checked inside the frame: the radio can come back between the call
        // and the paint, and a banner that appears one frame after the network
        // returns is the same bug with better timing.
        if (navigator.onLine !== false) { refusedWhileOnline++; hideBanner(); return; }
        el.style.transform = 'translateY(0)';
      });
    }
    function hideBanner() {
      var el = document.getElementById('pdx-offline-banner');
      if (el) el.style.transform = 'translateY(110%)';
    }

    function syncOnlineState() {
      if (navigator.onLine === false) showBanner();
      else hideBanner();
    }

    window.addEventListener('online', syncOnlineState);
    window.addEventListener('offline', syncOnlineState);
    // The three moments a page can have missed an edge while it was not
    // running. Each re-reads the flag rather than trusting what it remembers.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') syncOnlineState();
    });
    window.addEventListener('pageshow', syncOnlineState);
    window.addEventListener('focus', syncOnlineState);
    // Reflect initial state (covers reloads that start offline). Unconditional
    // now: when the flag says online this takes a restored banner back down,
    // which is the back/forward-cache case above.
    if (document.body) syncOnlineState();
    else window.addEventListener('DOMContentLoaded', syncOnlineState);
    // Expose a tiny helper so other code can query PWA/offline status if
    // needed. `falseOfflineRefusals` is the diagnostic: if it is ever above
    // zero, something asked for the offline banner while the browser said the
    // connection was up, and this block declined.
    window.PDXNet = {
      isOnline: function () { return navigator.onLine !== false; },
      falseOfflineRefusals: function () { return refusedWhileOnline; },
      _sync: syncOnlineState
    };

    // ── Service worker registration ─────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // Was this page ALREADY under a worker's control before we registered?
        // This is the only reliable way to tell a genuine shell update from a
        // first install, and getting it wrong was a real bug: sw.js calls
        // skipWaiting() on install and clients.claim() on activate, so on a
        // visitor's FIRST ever load the brand-new worker claims this
        // uncontrolled page, 'controllerchange' fires, and the old code below
        // reloaded — every first visit rebooted itself mid-read, a few seconds
        // in. The `refreshing` flag never guarded that; it only stopped a
        // second reload within the same page.
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          var refreshing = false;

          // A reload is never urgent, but it IS destructive: it throws away an
          // open profile, a half-typed composer, and the reader's place on the
          // page. So when a genuine update lands we only reload at a moment
          // where that costs nothing — otherwise we wait until the tab is
          // backgrounded and do it off-screen, or simply leave it for the next
          // navigation (the worker has already refreshed the cached shell).
          function busy() {
            try {
              if (window.PDXStability && window.PDXStability.isLocked()) return true;
              var a = document.activeElement;
              if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' ||
                        a.isContentEditable)) return true;
            } catch (e) {}
            return false;
          }
          function reloadWhenIdle() {
            if (refreshing) return;
            if (!busy()) { refreshing = true; location.reload(); return; }
            // Try again the moment the tab goes to the background.
            document.addEventListener('visibilitychange', function onHide() {
              if (document.visibilityState !== 'hidden' || refreshing) return;
              document.removeEventListener('visibilitychange', onHide);
              refreshing = true;
              location.reload();
            });
          }

          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!hadController) return;   // first install — nothing to refresh to
            reloadWhenIdle();
          });
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              // A new worker is waiting and we already control the page →
              // activate it immediately for a seamless update.
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                nw.postMessage('SKIP_WAITING');
              }
            });
          });
        }).catch(function () { /* SW unsupported/blocked — app still works */ });
      });
    }
  })();
  </script>
