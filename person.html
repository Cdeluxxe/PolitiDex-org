<!-- ═══════════════════════════════════════════════════════════════════════════
     person.html — THE SECOND SHELL. /p/<pid> IS ITS OWN DOCUMENT.
     ───────────────────────────────────────────────────────────────────────────
     WHAT WAS WRONG. Every address on this site was index.html: 2.3 MB of markup
     and ~114 script tags totalling ~11.9 MB, because netlify.toml rewrote /p/*,
     /issue/*, /vote/*, /i/*, /d/*, /b/* and /locker to the one document. A reader
     who tapped a shared person link downloaded the whole civic OS — the homepage
     grids, the Alignment engine, Compare Hub, the account graph, Door 1, Door 2,
     Your File, the Archive, the Evidence Locker — to read one person's record.
     None of it was on the page they asked for and all of it was on the main
     thread. Account, location and Your File froze the tab on a person file
     because the homepage was always running underneath it.

     WHAT THIS IS. The person file's own shell, served for /p/* by a single
     netlify.toml rewrite. It carries the person-file lane and nothing else:

       • the SAME cold-open prefetch, PDXStore, promise-ledger, PDXLazy, Firebase
         boot, finance and PDXStance blocks index.html carries, copied VERBATIM
         from it (see the marker comment above each — scripts/test-person-shell.mjs
         pins every one of them byte-identical to its source lines in index.html,
         so a fix applied to one document cannot silently skip the other);
       • the profile modal's DOM, which is what a person file paints into;
       • 59 module scripts — the renderer, the record, the brief and the three
         lanes a /p/ address can name (member, executive, judicial).

     WHAT IT DELIBERATELY DOES NOT CARRY. compare-hub.js, alignment-tool.js,
     like-dislike.js, my-stances.js, ballot-workspace.js, archive-browse.js,
     evidence-locker.js, all-seeing-eye.js, your-file.js, voter-hub-location.js,
     the homepage card/relevant-grid stack and the Door surfaces. Every reference
     to those from a module that DOES ship here is a `typeof` optional lookup, so
     their absence costs the file a block, never its boot. The two exceptions —
     alignment-tool.js's issue vocabulary, which the brief reads unguarded, and
     two functions the shipped modules call without a guard — are answered by
     /issue-map.js and by the one small stub block at the end of this head.
     .netlify/results.md lists what a person file loses on this shell.

     THE RULE THIS DOCUMENT LIVES BY: EVERY SAME-ORIGIN PATH IS ROOT-ABSOLUTE.
     /p/* is served with HTTP 200 at a two-segment path, so `src="person-file.js"`
     resolves to /p/person-file.js, the rewrite catches it, and the browser is
     handed this document and told to parse HTML as JavaScript. A leading slash is
     correct at every depth. scripts/test-person-shell.mjs fails the build on a
     relative src or href anywhere in this file.
     ═══════════════════════════════════════════════════════════════════════════ -->

  <!-- ══ COPIED VERBATIM FROM index.html LINES 89–241 ══════════════════════
       THE COLD-OPEN PREFETCH. This is the earliest executable moment in the
       document and it exists for exactly this address: read /p/<pid> out of
       location.pathname, resolve it through the mirrored alias table, and put
       /api/voting-record in flight before a single module has been parsed. On a
       shared link that fetch is the long pole of the formal brief, so starting
       it here rather than in voting-record.js is worth more on this document
       than it ever was on index.html. window.__pdxVRPrefetch is the box the
       later module drains; PDXPerf is the mark ledger the same module writes to.

       The alias tables inside are deliberate mirrors of stance-helpers.js's
       PDX_PID_ALIASES and profile-evidence.js's PDX_PROFILE_ALIAS, because both
       of those are deferred and arrive far too late to answer "which pid is
       this really". scripts/test-person-file-perf.mjs fails the build if a
       mirror ever disagrees with its source — and it now reads this copy too,
       so the two documents cannot drift apart. ══════════════════════════════ -->
<script>
(function () {
  // ── PDXPerf: the clock ────────────────────────────────────────────────────
  // Defined here rather than in pdx-perf.js because the first marks worth
  // having are laid before any external script has executed. pdx-perf.js
  // (deferred, first in the chain) attaches the reporting surface to THIS
  // object; it never replaces it, so no mark is lost.
  var P = window.PDXPerf;
  if (!P) {
    P = window.PDXPerf = {
      marks: {},        // name -> ms since navigation start (first write wins)
      order: [],        // the order they were laid, for the waterfall report
      mark: function (name, at) {
        if (!name || this.marks[name] !== undefined) return this.marks[name];
        var t;
        try { t = (at === undefined) ? performance.now() : at; } catch (e) { t = at || 0; }
        this.marks[name] = t;
        this.order.push(name);
        return t;
      },
      // ms between two marks, or null when either is missing. Used by the
      // report; kept here so a console poke works before pdx-perf.js lands.
      between: function (a, b) {
        var x = this.marks[a], y = this.marks[b];
        return (x === undefined || y === undefined) ? null : (y - x);
      }
    };
  }
  P.mark('head');

  // ── The prefetch ──────────────────────────────────────────────────────────
  var m;
  try { m = String(location.pathname).match(/^\/p\/([A-Za-z0-9_]+)\/?$/); } catch (e) { m = null; }
  if (!m) return;
  // /p/null is not a person. encodeURIComponent(null) === 'null', so a missing
  // pid somewhere upstream arrives here as a word that matches the path shape —
  // and the record endpoint must never be asked for a member named null. Bail
  // before any request is opened; person-file.js takes the address off the bar.
  if (/^(?:null|undefined|nan)$/i.test(m[1])) return;

  // Mirror of PDX_PROFILE_ALIAS (profile-evidence.js) — "which id has a roster
  // record". Applied FIRST, because that is the order the arrival path resolves
  // in: PDXPerson.resolve() canonicalises the address before it warms anything,
  // so /p/scott_chew opens chew_h68's file and a prefetch of scott_chew's pack
  // would warm a cache key nobody reads.
  var PROFILE_ALIASES = {
    kivory: 'ivory_h39', wharper: 'harper_s16', seliason: 'eliason_h45',
    klisonbee: 'lisonbee_h14', dmccay: 'mccay_s11', jteuscher: 'teuscher_h44',
    ken_ivory: 'ivory_h39', eliason: 'eliason_h45', teuscher: 'teuscher_h44',
    lisonbee: 'lisonbee_h14', mccay: 'mccay_s11', bridger_bolinder: 'bolinder_h68',
    casey_snider: 'snider_h5', cory_maloy: 'cory_maloy_h52', curt_bramble: 'cbramble',
    don_ipson: 'dipson', jerry_stevenson: 'jstevenson', jill_koford: 'koford_h10',
    luz_escamilla: 'lescamilla', matthew_gwynn: 'gwynn_h6', nate_blouin: 'blouin_s13',
    phil_lyman: 'lyman', scott_chew: 'chew_h68', scott_sandall: 'ssandall',
    stephen_l_whyte: 'whyte_h63', stuart_adams: 'sadams', tiara_auxier: 'auxier_h4',
    todd_weiler: 'tweiler', troy_shelley: 'shelley_h66'
  };
  // Mirror of PDX_PID_ALIASES (stance-helpers.js) / db/vr-pid-aliases.json — the
  // voting-record retirements, which is the id the endpoint itself is keyed by.
  var ALIASES = {
    susan_collins: 'collins', kennedy_rfk: 'rfkjr', cullimore_s19: 'kcullimore',
    calbrecht: 'carl_albrecht', derek_brown: 'derek_brown_ut'
  };
  var pid = PROFILE_ALIASES[m[1]] || m[1];
  pid = ALIASES[pid] || pid;
  var qs = '?pageSize=100';
  var url = '/api/voting-record/member/' + encodeURIComponent(pid) + qs;
  // Key format + TTL are owned by voting-record.js (PDXVotingRecord._ssKey /
  // _ssTtlMs) and asserted identical to these two lines by the perf test.
  var ssKey = 'pdxvr1:' + pid + qs;
  var ssTtl = 300000;

  // A session hit costs no request. The parse is pushed off the parser's own
  // task so a 60KB payload cannot stall the head; a missing, stale or corrupt
  // entry rejects and the network attempt takes over, so there is exactly ONE
  // promise on __pdxVRPrefetch and it cannot be adopted in a dead state.
  var netCtl = null;
  function fromSession() {
    return new Promise(function (resolve, reject) {
      var raw = null;
      try { raw = sessionStorage.getItem(ssKey); } catch (e) { raw = null; }
      if (!raw) { reject(new Error('vr session miss')); return; }
      setTimeout(function () {
        try {
          var box = JSON.parse(raw);
          if (box && box.d && box.t && (Date.now() - box.t) < ssTtl) {
            P.mark('vr-session-hit');
            resolve(box.d);
            return;
          }
        } catch (e) {}
        reject(new Error('vr session stale'));
      }, 0);
    });
  }

  function fromNetwork(isFallback) {
    // The same 12s deadline PDXVotingRecord._timeoutMs applies to its own
    // requests: a stalled connection never resolves and never rejects, and the
    // promise handed to fetchMember must not be able to hang a caller forever.
    var ctl = null;
    try { if (typeof AbortController === 'function') ctl = new AbortController(); } catch (e) { ctl = null; }
    netCtl = ctl;   // so box.abandon() below can drop a request for the wrong member
    var init = { headers: { accept: 'application/json' } };
    if (ctl) init.signal = ctl.signal;
    var timer = null;
    try {
      timer = setTimeout(function () { try { if (ctl) ctl.abort(); } catch (e) {} }, 12000);
    } catch (e) { timer = null; }
    var clear = function () { if (timer) { try { clearTimeout(timer); } catch (e) {} timer = null; } };

    P.mark(isFallback ? 'vr-prefetch-retry' : 'vr-prefetch-start');
    return fetch(url, init).then(function (r) {
      P.mark('vr-prefetch-headers');
      if (!r.ok) throw new Error('voting-record ' + r.status);
      return r.json();
    }).then(function (d) {
      clear();
      P.mark('vr-prefetch-json');
      return d;
    }, function (e) { clear(); throw e; });
  }

  // One box, one promise, published synchronously so a module that executes a
  // moment later cannot miss it. `session` records WHICH way the answer came:
  // voting-record.js must not re-write (and so renew) a session copy it was
  // just served from, or one entry could live past its five minutes forever.
  //
  // `abandon` is the other half of "one request per person". The alias tables
  // above resolve every id the app itself carries a bridge for, but not the
  // display-name spellings the roster only knows after it loads — /p/mike_lee is
  // `lee`, and no table in this document says so. When person-file.js works that
  // out (it has the roster, or the edge's own stamp in the body) and the answer is
  // NOT the member this block asked for, it claims the box and calls this: the
  // wrong member's request stops competing for the connection with the right
  // one, on the one page load where that connection is the whole wait. Claimed
  // first, so nothing can adopt a promise that is being aborted.
  var box = { pid: pid, url: url, promise: null, session: false };
  box.abandon = function () {
    try { if (netCtl) netCtl.abort(); } catch (e) {}
  };
  box.promise = fromSession().then(function (d) {
    box.session = true;
    return d;
  }, function () {
    return fromNetwork(true);
  });
  // Adoption may be a second or more away; nothing here may surface as an
  // unhandled rejection in the meantime.
  box.promise.catch(function () {});
  window.__pdxVRPrefetch = box;
})();
</script>

  <!-- ══ COPIED VERBATIM FROM index.html LINES 312–1295 ════════════════════
       PDXStore / PDXTeam / PDXTeamV2 — the storage seam. Every module that
       remembers anything goes through it, and several shipped here read it
       without a guard because on index.html it is always present this early.
       It touches localStorage and nothing else: no DOM, no network, no account.
       ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';
  if (window.PDXStore) return; // idempotent — never redefine

  // ─── Sync-state persistence ──────────────────────────────────────────────
  // One small record tracking, per collection, whether the local data has
  // un-pushed changes. Kept separate from the data itself so clearing/marking
  // dirty never risks the actual user content.
  var SYNC_KEY = 'pdx_sync_state';
  var SYNC_VERSION = 1;

  // ─── Backends ─────────────────────────────────────────────────────────────
  // A backend is the thing that actually holds bytes. Only the raw string I/O
  // differs between backends; JSON handling and dirty tracking sit above them.
  function makeLocalBackend() {
    return {
      name: 'local',
      isAvailable: function () {
        try {
          var t = '__pdx_probe__';
          localStorage.setItem(t, '1'); localStorage.removeItem(t);
          return true;
        } catch (e) { return false; }
      },
      getRaw: function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
      setRaw: function (key, str) { try { localStorage.setItem(key, str); return true; } catch (e) { return false; } },
      removeRaw: function (key) { try { localStorage.removeItem(key); return true; } catch (e) { return false; } }
    };
  }

  // The active data backend. Swappable later (see setBackend) — e.g. a backend
  // that reads/writes localStorage AND queues an upstream push. For now it is
  // always the plain local backend, so behaviour is unchanged.
  var _backend = makeLocalBackend();

  // The OPTIONAL remote backend (account sync). Null until setRemoteBackend()
  // is called, so out of the box there is no network and no auth — the app is
  // pure localStorage. When set, it unlocks push()/pull() without changing any
  // local read/write path. See the contract doc block near window.PDXStore.
  var _remote = null;
  var _remoteOpts = {};
  var _pushing = {};   // collection name -> in-flight push Promise (de-dupes concurrent pushes)

  // ─── Collection registry ────────────────────────────────────────────────
  // logical name → { keys:[localStorage keys it owns], label }
  // Used to (a) know which collection a key write should dirty, and (b) let a
  // future sync engine enumerate exactly what belongs to each syncable set.
  var _collections = {};
  var _keyToCollection = {};

  function defineCollection(name, opts) {
    if (!name) return;
    opts = opts || {};
    var keys = (opts.keys || []).slice();
    _collections[name] = { name: name, keys: keys, label: opts.label || name };
    for (var i = 0; i < keys.length; i++) { _keyToCollection[keys[i]] = name; }
    // Make sure a sync-state slot exists for it.
    var st = _loadSync();
    if (!st.collections[name]) {
      st.collections[name] = { dirty: false, lastLocalChangeAt: 0, lastSyncedAt: 0, revision: 0 };
      _saveSync(st);
    }
    return _collections[name];

  // Register (or extend) the localStorage keys a collection owns — so keys that
  // are only known deep inside a later <script> can still be attached to their
  // collection for dirty tracking.

    else {
      for (var i = 0; i < keys.length; i++) {

        _keyToCollection[keys[i]] = name;
      }
    }
  }

  // ─── Sync-state helpers ───────────────────────────────────────────────────
  function _loadSync() {
    var raw = _backend.getRaw(SYNC_KEY);
    var st = null;
    try { st = raw ? JSON.parse(raw) : null; } catch (e) { st = null; }
    if (!st || typeof st !== 'object') st = { version: SYNC_VERSION, collections: {} };
    if (!st.collections || typeof st.collections !== 'object') st.collections = {};
    return st;
  }
  function _saveSync(st) {
    try { _backend.setRaw(SYNC_KEY, JSON.stringify(st)); } catch (e) {}
  }
  function _now() {
    // Timestamps are best-effort ordering hints for a future sync engine; a
    // missing clock must never break a write.
    try { return Date.now(); } catch (e) { return 0; }
  }
  function _emit(name, detail) {
    try { window.dispatchEvent(new CustomEvent(name, { detail: detail || {} })); } catch (e) {}
  }

  function markDirty(collection) {
    if (!collection) return;
    var st = _loadSync();
    var c = st.collections[collection] || (st.collections[collection] = { dirty: false, lastLocalChangeAt: 0, lastSyncedAt: 0, revision: 0 });
    c.dirty = true;
    c.lastLocalChangeAt = _now();
    c.revision = (c.revision || 0) + 1;
    _saveSync(st);
    _emit('pdx-sync-state-change', { collection: collection, dirty: true });

  // Called by a future sync engine after a successful push, to record that the
  // local copy is now in agreement with the server as of `syncedAt`.
  function clearDirty(collection, syncedAt) {
    if (!collection) return;
    var st = _loadSync();
    var c = st.collections[collection];
    if (!c) return;
    c.dirty = false;
    c.lastSyncedAt = syncedAt || _now();
    _saveSync(st);
    _emit('pdx-sync-state-change', { collection: collection, dirty: false });

  function isDirty(collection) {
    var st = _loadSync();
    if (collection) return !!(st.collections[collection] && st.collections[collection].dirty);
    // No arg → is ANYTHING pending?

  function pendingCollections() {

      var c = st.collections[k];
      out.collections[k] = { dirty: !!c.dirty, lastLocalChangeAt: c.lastLocalChangeAt || 0, lastSyncedAt: c.lastSyncedAt || 0, revision: c.revision || 0 };

  // These are the calls features make. `read`/`write` are JSON-typed (the
  // common case); `readRaw`/`writeRaw` handle plain strings (e.g. a mode flag).
  // Any write to a key owned by a collection auto-marks that collection dirty,
  // so features get change-tracking for free just by routing through here.

  // ─── Collection snapshots (the payload a push sends upstream) ──────────────
  // A "snapshot" is the complete, serializable state of one collection — exactly
  // what a remote backend receives in push() and would return from pull(). A
  // feature registers a shaped provider for its collection (see PDXSaved and
  // PDXTeam.snapshot). Collections without a registered provider fall back to a
  // raw { ownedKey: parsedValue } map, which is enough for any single-key set.
  var _snapshotProviders = {};
  function registerSnapshot(collection, fn) {
    if (collection && typeof fn === 'function') _snapshotProviders[collection] = fn;
  }
  function snapshot(collection) {
    var fn = _snapshotProviders[collection];
    if (fn) { try { return fn(); } catch (e) { return null; } }
    var c = _collections[collection];
    if (!c) return null;

    for (var i = 0; i < c.keys.length; i++) { out[c.keys[i]] = read(c.keys[i], null); }
    return out;
  }

  // ─── Collection reconcilers (the pull-side counterpart to registerSnapshot) ─
  // registerSnapshot() shapes what a collection PUSHES up; a reconciler decides
  // how a PULLED server snapshot is MERGED back into local state. It is the one
  // place that knows a collection's data shape well enough to combine two
  // versions safely, so PDXStore itself stays data-agnostic. Both personal
  // collections now register one ('saved' and 'team'); a collection WITHOUT a
  // reconciler is never pulled — pullCollection() no-ops for it — so any future
  // push-only collection keeps exactly its current behavior and is never at risk
  // of being clobbered by server data.
  var _reconcilers = {};
  function registerReconciler(collection, fn) {
    if (collection && typeof fn === 'function') _reconcilers[collection] = fn;
  }


  function read(key, fallback) {
    var raw = _backend.getRaw(key);
    if (raw == null) return (fallback === undefined ? null : fallback);
    try { return JSON.parse(raw); } catch (e) { return (fallback === undefined ? null : fallback); }
  }

    try { ok = _backend.setRaw(key, JSON.stringify(value)); } catch (e) { ok = false; }

    return ok;

  function readRaw(key) { return _backend.getRaw(key); }
  function writeRaw(key, str, opts) {
    var ok = _backend.setRaw(key, String(str == null ? '' : str));
    _afterWrite(key, opts);
    return ok;
  }
  function remove(key, opts) {
    var ok = _backend.removeRaw(key);
    _afterWrite(key, opts);
    return ok;
  }

    if (col && !(opts && opts.dirty === false)) markDirty(col);
    // Dual-write mirror (Phase 1 of the team refactor): whenever a legacy
    // team-membership store changes locally, refresh the single-source-of-truth
    // politidex_team_v2 mirror so both shapes stay in agreement during the
    // transition. Guarded by opts.__v2 so a v2 write can never re-trigger itself,

  // this from their canonical save function keeps dirty tracking honest.

  // Register the OPTIONAL remote backend. Registering it does NOT touch any
  // local read/write path — it only unlocks push()/pull(). Identity is the
  // backend's own concern: build it closing over whatever user id the caller
  // already has (this layer never authenticates). See the contract doc block
  // near window.PDXStore for the exact shape a backend must implement.
  //   opts.userId        optional id, echoed to the backend in push meta
  //   opts.autoPush      opt-in: debounce-push a collection after it goes dirty
  //   opts.autoPushDelay ms to wait before an auto-push (default 1500)
  function setRemoteBackend(backend, opts) {
    _remote = backend || null;
    _remoteOpts = opts || {};
    _emit('pdx-remote-change', { active: !!_remote, name: _remote && _remote.name });
    if (_remote && _remoteOpts.autoPush) _enableAutoPush();
    return _remote;
  }
  function getRemoteBackend() { return _remote; }

  // Push one collection's current snapshot upstream. ALWAYS resolves (never
  // rejects) with a small result object so callers can safely fire-and-forget:
  //   { pushed:true,  result }  → the backend accepted the snapshot
  //   { pushed:false, reason }  → nothing to do (no remote registered / clean)
  //   { pushed:false, error }   → the backend failed; the collection STAYS
  //                               dirty, so a later push retries it. A failed
  //                               push can never lose or corrupt local data.
  function pushCollection(name) {
    if (!name) return Promise.resolve({ pushed: false, reason: 'no-collection' });
    if (!_remote || typeof _remote.push !== 'function') {
      return Promise.resolve({ pushed: false, reason: 'no-remote' });
    }
    if (!isDirty(name)) return Promise.resolve({ pushed: false, reason: 'not-dirty' });
    if (_pushing[name]) return _pushing[name]; // coalesce concurrent pushes

    // Capture the revision as it stands NOW. If a local write bumps it while the
    // push is in flight, we must NOT clear the dirty flag afterwards — the newer
    // change hasn't been sent — so the next push still picks it up.
    var st = _loadSync();
    var startRev = (st.collections[name] && st.collections[name].revision) || 0;
    var snap = snapshot(name);
    var meta = { revision: startRev, userId: _remoteOpts.userId || null };

    var p = Promise.resolve()
      .then(function () { return _remote.push(name, snap, meta); })
      .then(function (res) {
        res = res || {};
        var cur = _loadSync().collections[name];
        var curRev = (cur && cur.revision) || 0;
        // Only mark clean if nothing changed locally during the push.
        if (curRev === startRev) clearDirty(name, res.syncedAt);
        _emit('pdx-sync-push', { collection: name, ok: true });
        return { pushed: true, result: res };
      })
      .catch(function (err) {
        // Offline / server error: leave the collection dirty for a later retry.
        _emit('pdx-sync-error', { collection: name, error: String((err && err.message) || err) });
        return { pushed: false, error: err };
      })
      .then(function (out) { delete _pushing[name]; return out; });

    _pushing[name] = p;
    return p;
  }

  // Push every collection that currently has un-synced local changes.
  function pushPending() { return Promise.all(pendingCollections().map(pushCollection)); }

  // Pull one collection's snapshot from the remote backend and merge it into the
  // local state via that collection's registered reconciler. Like pushCollection,
  // it ALWAYS resolves (never rejects) so callers can fire-and-forget on startup:
  //   { pulled:true,  ... }      → merged (the reconciler reports what changed)
  //   { pulled:false, reason }   → nothing to do (no remote / no pull() / no
  //                                reconciler registered for this collection)
  //   { pulled:false, error }    → the pull or merge failed; LOCAL DATA IS LEFT
  //                                EXACTLY AS IT WAS, so the app simply keeps
  //                                working from local storage. A failed pull can
  //                                never lose or corrupt local data.
  //
  // Pull is intentionally gated on a registered reconciler: without a merge
  // strategy we must NOT blindly overwrite local data with the server's, so an
  // un-reconciled collection is never pulled. Both 'saved' and 'team' register
  // one, so both sync two-way.
  function pullCollection(name) {
    if (!name) return Promise.resolve({ pulled: false, reason: 'no-collection' });
    if (!_remote || typeof _remote.pull !== 'function') {
      return Promise.resolve({ pulled: false, reason: 'no-remote' });
    }
    var reconcile = _reconcilers[name];
    if (typeof reconcile !== 'function') {
      return Promise.resolve({ pulled: false, reason: 'no-reconciler' });
    }

    // Capture dirtiness BEFORE the merge. A dirty collection has local edits that
    // haven't reached the server yet; the reconciler uses this to let those
    // un-pushed edits win ties so a pull can never quietly undo them.
    var wasDirty = isDirty(name);

    return Promise.resolve()
      .then(function () { return _remote.pull(name); })
      .then(function (res) {
        // res is { snapshot, syncedAt, revision } or null when the server has
        // no snapshot for this user+collection yet.
        var serverSnapshot = (res && res.snapshot) ? res.snapshot : null;
        var info = reconcile(serverSnapshot, {
          dirty: wasDirty,
          syncedAt: res && res.syncedAt,
          revision: res && res.revision
        }) || {};
        _emit('pdx-sync-pull', { collection: name, ok: true, changed: !!info.changed });
        return { pulled: true, hadServer: !!serverSnapshot, info: info };
      })
      .catch(function (err) {
        // Offline / server error / malformed payload: leave local data untouched.
        _emit('pdx-sync-error', { collection: name, error: String((err && err.message) || err) });
        return { pulled: false, error: err };
      });
  }

  // Optional, opt-in convenience: debounce-push a collection shortly after it
  // goes dirty. OFF by default so the baseline contract stays strictly
  // "push on request" — a caller that wants automatic pushes asks for them via
  // setRemoteBackend(backend, { autoPush: true }).
  //
  // opts.collections (optional) narrows auto-push to a specific allow-list. The
  // server accepts 'saved' and 'team', so both auto-push; any other dirty
  // collection is tracked locally but never auto-pushed (it would 404). Omitting
  // the list auto-pushes every dirty collection.
  var _autoPushOn = false, _autoTimers = {};
  function _enableAutoPush() {
    if (_autoPushOn) return;
    _autoPushOn = true;
    window.addEventListener('pdx-sync-state-change', function (e) {
      var col = e && e.detail && e.detail.collection;
      if (!col || !e.detail.dirty || !_remote) return;
      var allow = _remoteOpts.collections;
      if (allow && allow.indexOf(col) === -1) return;   // not in the allow-list
      if (_autoTimers[col]) { try { clearTimeout(_autoTimers[col]); } catch (x) {} }
      _autoTimers[col] = setTimeout(function () { pushCollection(col); }, _remoteOpts.autoPushDelay || 1500);
    });
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  REMOTE BACKEND CONTRACT — how to implement a future backend
  // ──────────────────────────────────────────────────────────────────────────
  //  A remote backend is a plain object. Register it with:
  //      PDXStore.setRemoteBackend(backend, { userId, autoPush });
  //  Nothing else in the app needs to change — collections already route every
  //  read/write through PDXStore, and push() reads the collection's snapshot.
  //
  //  A backend MUST implement (all data methods are async — return a Promise):
  //
  //    name : string
  //        A short id for logs/UI, e.g. 'netlify'.
  //
  //    push(collection, snapshot, meta) -> Promise<{ syncedAt?, revision? }>
  //        Persist `snapshot` (the full serializable state of `collection`) for
  //        the active user, upstream. Resolve on success (optionally returning
  //        the server's syncedAt/revision); REJECT/throw on any failure
  //        (network down, auth expired, 5xx). On rejection PDXStore keeps the
  //        collection dirty so the next push retries — so a backend should make
  //        push idempotent (a full-snapshot upsert keyed by user + collection).
  //        `meta` carries { revision, userId } — non-sensitive hints only.
  //
  //    pull(collection) -> Promise<{ snapshot, syncedAt?, revision? } | null>
  //        Fetch the latest upstream snapshot (null when the server has none).
  //        NOT used by the push-only flow yet; implement it now so the future
  //        sync loop can adopt it without a backend change.
  //
  //    getLastSynced(collection) -> Promise<number|null>
  //        The server's last-synced timestamp (ms) for this user+collection, or
  //        null. A future sync loop uses it for cheap change detection and
  //        conflict ordering. Safe to return null until the server tracks it.
  //
  //    isAvailable?() -> boolean | Promise<boolean>   (optional)
  //        Fast reachability/auth hint the sync loop can check before pushing.
  //
  //  REFERENCE IMPLEMENTATION — this is now REAL: the endpoint exists (Netlify
  //  Function at /api/pdx-sync backed by Netlify Database) and the working
  //  backend is implemented just below as makeNetlifyRemoteBackend(). The sketch
  //  below is kept as a compact contract example; the live version adds an
  //  optional getToken hook and defensive error handling.

  //      var BASE = '/api/pdx-sync';                       // future Function
  //      function req(method, path, body) {
  //        return Promise.resolve(getToken && getToken()).then(function (tok) {
  //          return fetch(BASE + path, {
  //            method: method,
  //            headers: Object.assign(
  //              { 'content-type': 'application/json' },
  //              tok ? { authorization: 'Bearer ' + tok } : {}
  //            ),
  //            body: body ? JSON.stringify(body) : undefined
  //          });
  //        }).then(function (r) {
  //          if (!r.ok) throw new Error('pdx-sync ' + method + ' ' + path + ' -> ' + r.status);
  //          return r.status === 204 ? null : r.json();
  //        });
  //      }
  //      return {
  //        name: 'netlify',
  //        push: function (collection, snapshot, meta) {
  //          return req('PUT', '/' + encodeURIComponent(collection),
  //                     { userId: userId, snapshot: snapshot, revision: meta && meta.revision });
  //        },
  //        pull: function (collection) { return req('GET', '/' + encodeURIComponent(collection)); },
  //        getLastSynced: function (collection) {
  //          return req('GET', '/' + encodeURIComponent(collection) + '/meta')
  //            .then(function (m) { return (m && m.syncedAt) || null; });
  //        }
  //      };
  //    }
  //    // PDXStore.setRemoteBackend(makeNetlifyRemoteBackend({ userId: uid, getToken: fn }));
  // ══════════════════════════════════════════════════════════════════════════

  // ─── makeNetlifyRemoteBackend — the real backend for /api/pdx-sync ──────────
  // Implements the REMOTE BACKEND CONTRACT above against the live Netlify
  // Function at /api/pdx-sync (backed by Netlify Database). It does two-way sync:
  // push()/pull()/getLastSynced() are all wired (see enableAccountSync's startup
  // pull-then-push).
  //
  // AUTH IS REAL. Identity is the caller's Firebase account, proved by the ID
  // token that `getToken` returns; the server verifies that token and derives the
  // user id from it (see the Function's AUTHENTICATION note). `getToken` is
  // therefore REQUIRED: every request sends its result as `Authorization: Bearer
  // <token>`, and a request without a valid token is rejected server-side.
  // `userId` is optional and purely a client-side hint (logging / push meta) — the
  // server ignores any id the client sends and trusts only the token, so a client
  // can never read or write another user's data.
  function makeNetlifyRemoteBackend(cfg) {
    cfg = cfg || {};
    var userId = cfg.userId;                  // optional hint only; server ignores it
    var getToken = cfg.getToken;              // required: () -> token | Promise<token>
    var BASE = cfg.base || '/api/pdx-sync';   // overridable for tests
    if (typeof getToken !== 'function') {
      throw new Error('makeNetlifyRemoteBackend: getToken is required (real auth)');
    }

    function req(method, path, body) {
      return Promise.resolve(getToken()).then(function (tok) {
        // No token → not signed in (or the token couldn't be minted). Fail loudly
        // so PDXStore keeps the collection dirty and retries later; never send an
        // unauthenticated request that the server will just 401.
        if (!tok) throw new Error('pdx-sync: no auth token (not signed in)');
        return fetch(BASE + path, {
          method: method,
          headers: {
            'content-type': 'application/json',
            'authorization': 'Bearer ' + tok
          },
          body: body ? JSON.stringify(body) : undefined
        });
      }).then(function (r) {
        // Any non-2xx MUST throw: the contract keeps the collection dirty on a
        // rejected push, so the next push retries. Never swallow a failure into
        // a fake success or local data would be silently treated as synced.
        if (!r.ok) throw new Error('pdx-sync ' + method + ' ' + path + ' -> ' + r.status);
        return r.status === 204 ? null : r.json();   // 204 = server has none
      });
    }

    return {
      name: 'netlify',
      // push(collection, snapshot, meta) — full-snapshot upsert. Body shape is
      // exactly what the Function expects: { userId, snapshot, revision }. It
      // echoes back { syncedAt, revision }, which PDXStore uses to stamp the
      // collection clean. Idempotent server-side, so a retried push is safe.
      push: function (collection, snapshot, meta) {
        return req('PUT', '/' + encodeURIComponent(collection), {
          userId: userId,
          snapshot: snapshot,
          revision: meta && meta.revision
        });
      },
      // pull(collection) — fetch the latest server snapshot for this user. Now
      // wired into the startup sync loop (see pullCollection + enableAccountSync):
      // the result is merged with local state by the collection's reconciler.
      // Resolves null when the server has none (HTTP 204).
      pull: function (collection) {
        return req('GET', '/' + encodeURIComponent(collection));
      },
      getLastSynced: function (collection) {
        return req('GET', '/' + encodeURIComponent(collection) + '/meta')
          .then(function (m) { return (m && m.syncedAt) || null; });
      }
    };
  }

  // ─── Account-sync activation (connect the client ↔ /api/pdx-sync) ───────────
  // REAL IDENTITY — sync is now gated on a real, signed-in Firebase account.
  // enableAccountSync({ userId, getToken }) is called from the Firebase
  // auth-state handler (search "PDXStore.enableAccountSync" in the auth script)
  // the moment a non-anonymous user is present; disableAccountSync() is called on
  // sign-out (or for anonymous/guest sessions) to drop back to local-only.
  //
  // LOCAL-ONLY GUARANTEE (unchanged for anyone who never signs in) — until a real
  // user signs in, NO remote backend is registered, so nothing ever leaves this
  // browser: the app is the exact byte-for-byte pure-localStorage experience it
  // has always been. Even after sign-in, enabling sync only REGISTERS the backend;
  // a push happens solely when 'saved' actually goes dirty (via autoPush) or on
  // the one-time startup flush below. And if sync is disabled (localStorage
  // 'pdx_sync_disabled' = '1') or anything here throws, the backend is left
  // unregistered and the app stays local-only.
  var SYNC_DISABLED_KEY = 'pdx_sync_disabled';

  // The user id sync is currently wired for, so a repeat sign-in event for the
  // same account is a cheap no-op and a switch to a different account re-wires.
  var _syncUserId = null;

  // ─── Per-account local-storage context (isolation) ──────────────────────────
  // Which signed-in user "owns" the local data right now. This is purely a
  // LOCAL-STORAGE isolation concern, deliberately kept SEPARATE from network
  // sync: it decides which namespaced localStorage key a per-account collection
  // (currently only 'saved') reads and writes, so two people sharing one browser
  // never see — or accidentally merge — each other's saves.
  //
  //   _accountUserId === null   → guest / signed-out: the shared, legacy keyspace
  //                               (byte-for-byte the pre-isolation behavior).
  //   _accountUserId === <uid>  → signed in: that account's private namespace.
  //
  // WHY SEPARATE FROM SYNC: isolation is a privacy guarantee that must hold even
  // when the network is never touched — e.g. a user who opted sync out
  // ('pdx_sync_disabled'), or is offline, or is signed in before a token is
  // available. So the account context is established the moment a real user is
  // known and cleared on sign-out, regardless of whether push/pull ever run.
  // Collections don't reach in here; they listen for the 'pdx-account-change'
  // event and switch their active key (see PDXSaved's activeKey()).
  var _accountUserId = null;
  function getAccount() { return _accountUserId; }
  function _setAccount(uid) {
    var next = uid || null;
    if (next === _accountUserId) return;   // idempotent — no spurious re-render events
    _accountUserId = next;
    _emit('pdx-account-change', { userId: next });
  }

  // Turn on authenticated two-way sync for `identity` = { userId, getToken }:
  //   userId   the signed-in Firebase uid (a hint for logging/meta; the server
  //            derives the authoritative id from the token, not from this)
  //   getToken () -> Promise<idToken|null>, used for the Authorization header
  function enableAccountSync(identity) {
    try {
      identity = identity || {};
      var uid = identity.userId;

      // LOCAL ISOLATION FIRST — bind this account's private localStorage namespace
      // as soon as we know who signed in, BEFORE any sync decision. Keeping one
      // user's local saves out of another's is a privacy guarantee that must hold
      // even when network sync is opted out below, no token is available, or the
      // device is offline — so it happens unconditionally on a known uid. Per-
      // account collections switch their active key off this (see PDXSaved).
      if (uid) _setAccount(uid);

      if (_backend.getRaw(SYNC_DISABLED_KEY) === '1') return;   // explicit opt-out (data still isolated locally)
      if (!uid || typeof identity.getToken !== 'function') return;  // need real auth for network sync
      if (_remote && _syncUserId === uid) return;               // already wired for this user

      _syncUserId = uid;
      setRemoteBackend(makeNetlifyRemoteBackend({ userId: uid, getToken: identity.getToken }), {
        userId: uid,
        autoPush: true,                  // debounce-push a collection ~1.5s after it goes dirty
        collections: ['saved', 'team', 'evidence', 'impact', 'stances', 'yourFile']   // all personal collections sync (server allow-list)
      });
      // One-time startup sync of each synced collection, after the page has settled
      // (snapshot providers + reconcilers register during initial parse). We PULL
      // first, then PUSH, per collection:
      //   1. pull(col) fetches the server snapshot and merges it into local state
      //      (union + last-write-wins, tombstone-aware; un-pushed local edits are
      //      preserved because the collection is still dirty at merge time). This is
      //      what brings changes made on another device down onto this one.
      //   2. push(col) then sends the merged union back up, so the server converges
      //      too. It only sends when the collection is actually dirty.
      // Pull-before-push matters: a push is a full-snapshot overwrite, so pushing
      // FIRST could clobber another device's data this browser hadn't seen yet.
      // Both steps resolve gracefully and never throw — if the pull fails
      // (offline/error/no server data) local data is left exactly as-is.
      setTimeout(function () {
        ['saved', 'team', 'evidence', 'impact', 'stances', 'yourFile'].forEach(function (col) {
          try {
            pullCollection(col).then(function () {
              try { pushCollection(col); } catch (e) {}
            });
          } catch (e) {}
        });
      }, 2500);
    } catch (e) {
      // Sync wiring must never break the local app: fall back to local-only.
      _remote = null;
      _syncUserId = null;
    }
  }

  // Turn sync back OFF and return to local-only: called on sign-out and for
  // anonymous/guest sessions. Local data is untouched and stays fully usable;
  // this only stops the client from talking to the server so a signed-out (or
  // never-signed-in) user creates no server traffic and no server rows.
  function disableAccountSync() {
    try {
      // Drop the local per-account context FIRST so per-account collections fall
      // back to the shared guest keyspace (a clean local-only state) and never
      // keep showing the signed-out user's data. Their items are left untouched
      // in their own namespace — isolated, so they're still there if that same
      // account signs back in on this device, and never visible to the next user.
      _setAccount(null);
      if (!_remote && !_syncUserId) return;   // already local-only (network side)
      _syncUserId = null;
      setRemoteBackend(null);
    } catch (e) { /* local-only is the safe default; never throw */ }
  }

  window.PDXStore = {
    // data
    read: read, write: write, readRaw: readRaw, writeRaw: writeRaw, remove: remove,
    // collections
    defineCollection: defineCollection, attachKeys: attachKeys,
    collections: function () { return _collections; },
    registerSnapshot: registerSnapshot, snapshot: snapshot,
    registerReconciler: registerReconciler,
    // dirty / sync
    markDirty: markDirty, clearDirty: clearDirty, isDirty: isDirty,
    pendingCollections: pendingCollections, getSyncState: getSyncState, touch: touch,
    // local backend (storage medium)
    setBackend: setBackend, getBackend: getBackend,
    // remote backend (account sync) — optional; no-op until one is registered
    setRemoteBackend: setRemoteBackend, getRemoteBackend: getRemoteBackend,
    makeNetlifyRemoteBackend: makeNetlifyRemoteBackend,
    // account sync activation — driven by the Firebase auth-state handler:
    // enable on real (non-anonymous) sign-in, disable on sign-out/anonymous.
    enableAccountSync: enableAccountSync, disableAccountSync: disableAccountSync,
    // per-account local-storage context (isolation). getAccount() lets a
    // collection adopt the already-established account if it parses AFTER sign-in
    // resolved (auth can fire before late feature scripts run); setAccount() is
    // exposed for completeness/testing — normal flow drives it via enable/disable.
    getAccount: getAccount, setAccount: _setAccount,
    push: pushCollection, pushPending: pushPending, pull: pullCollection,
    get remote() { return _remote; },
    set remote(v) { setRemoteBackend(v); },
    SYNC_KEY: SYNC_KEY
  };

  // Declare the two personal collections up front so their sync slots exist
  // from first paint. Individual keys are attached by each feature's script
  // block as it defines them (see PDXSaved and PDXTeam).
  defineCollection('saved', { keys: ['pdx_my_saved'], label: 'Saved evidence, tags & notes' });
  defineCollection('team', {
    keys: [
      'politidex_my_team',            // active/visible 6-slot ballot map
      'politidex_home_base',          // protected "My Home Team" snapshot
      'politidex_team_mode',          // 'home' | 'research'
      'politidex_my_politicians',     // saved politicians roster
      'politidex_saved_teams_v1',     // named/multi saved teams
      'politidex_active_team_v1'      // which saved team is being edited
    ],
    label: 'My Team, ballot, roster & saved teams'
  });
  // 'evidence' — the Evidence Locker's saved collections (folders of receipts).
  // Its single owned key is the long-standing nested store; PDXEvidenceSync (near
  // PDXTeamSync, later in the file) is the thin wrapper that gives it the same
  // tombstone + watermark + field-level-merge sync saved/team already have.
  defineCollection('evidence', { keys: ['politidex_evidence_collections'], label: 'Saved evidence collections' });

  // 'votingPrefs' — the visitor's durable Voting Record view preferences (sort +
  // hide-procedural), so the profile Voting Record section opens the way they last
  // left it. Small and personal; syncs through the same PDXStore slot as the rest.
  defineCollection('votingPrefs', { keys: ['pdx_voting_prefs'], label: 'Voting Record view preferences' });

  // 'bills' — bills the visitor is following (Phase 3, Legislation library). Keyed
  // by stable congress+number, local-first, and account-synced like the rest.
  defineCollection('bills', { keys: ['politidex_followed_bills'], label: 'Followed bills' });

  // 'learn' — which in-context teaching notes the visitor has dismissed (see
  // pdx-learn.js). Purely "don't tell me this again" state: nothing here affects
  // what the product shows about any politician. Synced so a note dismissed on a
  // phone stays dismissed on a laptop.
  defineCollection('learn', { keys: ['pdx_learn_prefs'], label: 'Explainer notes seen' });

  // 'firstRun' — whether this visitor has completed one meaningful first task,
  // and which one (see first-run.js). Two fields and nothing else: `done` and
  // `via` ('record' | 'seat'). It is NOT an account flag and it is deliberately
  // not settable by signing up — the brief for this surface is explicit that
  // success means "has seen a sourced formal pattern OR completed one seat pick",
  // not "account created". Synced so the homepage does not restart a stranger's
  // onboarding on their second device.
  defineCollection('firstRun', { keys: ['pdx_first_run'], label: 'First-run progress' });

  // ─── PDXTeam — one named facade over the whole My Team / ballot family ──────
  // The team data is written from several long-standing <script> closures
  // (ballot builder, Home Base, saved-teams, roster). Rather than reroute every
  // scattered call site, those closures' CANONICAL save helpers now go through
  // PDXStore.write (so the 'team' collection dirty-tracks). PDXTeam gives a
  // FUTURE sync engine — and any new feature — a single, stable place to read
  // the whole team snapshot and its sync status without knowing those internals.
  var TEAM_KEYS = {
    ballot: 'politidex_my_team',
    homeBase: 'politidex_home_base',
    mode: 'politidex_team_mode',
    roster: 'politidex_my_politicians',
    savedTeams: 'politidex_saved_teams_v1',
    activeTeam: 'politidex_active_team_v1'
  };
  window.PDXTeam = {
    KEYS: TEAM_KEYS,
    COLLECTION: 'team',
    // A complete, serializable snapshot of everything that makes up "My Team".
    // This is exactly the payload a future backend would push/pull.
    snapshot: function () {
      return {
        ballot: read(TEAM_KEYS.ballot, {}),
        homeBase: read(TEAM_KEYS.homeBase, null),
        mode: readRaw(TEAM_KEYS.mode) || 'research',
        roster: read(TEAM_KEYS.roster, []),
        savedTeams: read(TEAM_KEYS.savedTeams, []),
        activeTeam: readRaw(TEAM_KEYS.activeTeam) || null
      };
    },
    isDirty: function () { return isDirty('team'); },
    markChanged: function () { markDirty('team'); },
    clearDirty: function (syncedAt) { clearDirty('team', syncedAt); }
  };

  // ─── PDXTeamV2 — the single source of truth for team membership ────────────

    function buildFTMPie(sectors) {
      var entries = Object.entries(sectors).sort(function(a, b) { return b[1] - a[1]; });

    function ftmHasSector(p, sector) {
      if (sector === 'all') return true;
      if (sector === 'others') {
        var standardKeywords = ['real estate','finance','energy','tech','pharma','defense','securities','oil','gas','software'];
        return p.topDonors.some(function(d) {
          if (d.type !== 'industry') return false;
          var n = d.name.toLowerCase();
          return !standardKeywords.some(function(kw) { return n.indexOf(kw) !== -1; });
        });
      }
      var map = { tech:'Tech', finance:'Finance', realestate:'Real Estate', energy:'Energy', pharma:'Pharma', defense:'Defense' };
      var key = map[sector];
      return key && p.sectors[key] && p.sectors[key] > 0;
    }

    function renderFTM() {
      var filtered = FTM_DATA.filter(function(p) { return ftmHasSector(p, ftmCurrentSector); });
      filtered.sort(function(a, b) { return b.totalRaised - a.totalRaised; });
      var grid = document.getElementById('ftm-grid');
      grid.innerHTML = filtered.map(function(p, i) { return buildFTMCard(p, i); }).join('');
      document.getElementById('ftm-count').textContent = filtered.length + ' politicians tracked';
      var asofEl = document.getElementById('ftm-asof');
      if (asofEl) asofEl.textContent = '🕒 Data last reviewed ' + FTM_AS_OF;

      var sectors = ['all','tech','finance','realestate','energy','pharma','defense','others'];
      sectors.forEach(function(s) {
        var btn = document.getElementById('ftm-sec-' + s);
        if (!btn) return;
        if (s === ftmCurrentSector) {
          btn.style.background = 'rgba(74,222,128,0.18)';
          btn.style.borderColor = 'rgba(74,222,128,0.35)';
          btn.style.color = '#4ade80';
        } else {
          btn.style.background = 'transparent';
          btn.style.borderColor = 'rgba(255,255,255,0.1)';
          btn.style.color = '#7596c0';
        }
      });
    }

    window.setFTMSector = function(sector) {
      ftmCurrentSector = sector;
      renderFTM();
    };

    // ── Compact funding summary, keyed by politician id ───────────────────────
    // The Side-by-Side Comparison surfaces "who bankrolls each pick" as one of its
    // decision rows. The rich cards above are keyed the same way the compare table
    // is (the FTM `id` matches the compare `pid` for these figures), so we expose a
    // small, read-only lookup that distils each record down to the three things a
    // voter actually weighs: how much they raised, their single biggest funder, and
    // how grassroots vs. big-money that support is. Returns null when a pick has no
    // funding on file, so the table can honestly render "Not on file" rather than a
    // fabricated figure — the same calm-gap pattern used for missing scores.
    var _FTM_BY_ID = {};
    FTM_DATA.forEach(function(p) { _FTM_BY_ID[p.id] = p; });

    // ── ONE FILING, WHATEVER ID THE PERSON FILE IS OPEN UNDER ────────────────
    // Two of the thirteen filings are stored under a SHORT KEY that the roster
    // does not use. The funding seed calls them `bking` and `gleich`; the person
    // file for the same two people opens as `brian_king` (a live cmp-data record,
    // "Brian S. King", former UT House District 23) and `caroline_gleich` (the
    // Caroline Gleich stance block's key). Every pid-keyed reader below dipped
    // straight into `_FTM_BY_ID`, so those two profiles printed "No money file on
    // hand" in the letterhead AND an empty 💰 Money & Funding section while the
    // dollars sat one alias away — the site holding a filing and telling the
    // reader it did not have one, which is the exact failure the coverage
    // sentence exists to prevent.
    //
    // A SECOND KEY IS NOT A SECOND PERSON, and this table is the only place that
    // is asserted for money. It is the same shape as the bridges the rest of the
    // product keeps (PDX_PROFILE_ALIAS in profile-evidence.js, the stance keys in
    // db/vr-pid-aliases.json): profile id on the left, the id the data is filed
    // under on the right, and no new figure anywhere.
    //   PDX_PROFILE_ALIAS itself is deliberately NOT the door here.
    // test-identity-integrity §11 holds that table to "every value is a live
    // cmp-data record, and no key is one", and `caroline_gleich` has no cmp-data
    // record — so bridging her there would either fail that fence or force a
    // roster claim this pass has no business making. The filing index is the
    // narrower and more honest place to say "this money belongs to that file".
    //
    // COUNTS ARE UNAFFECTED. Aliases resolve at LOOKUP time and are never added
    // to the index, so `_pdxFinanceIds()` still returns the 13 keys that carry a
    // filing and the coverage sentence still counts 13 people, not 15 keys. Two
    // ids reaching one record is one filing, the same way two addresses reaching
    // one profile is one person.
    var FTM_ID_ALIAS = {
      brian_king:      'bking',
      caroline_gleich: 'gleich'
    };

    // The one resolver. Every pid-keyed finance accessor in this file goes
    // through it, which is what keeps the letterhead chip (via
    // `_pdxFinanceFiling`) and the money section (via `_pdxFinanceSignal`) from
    // ever disagreeing about whether a person has a file — the failure mode this
    // lane has already shipped once and is fenced against by
    // scripts/test-finance-id-alias.mjs.
    function _ftmRecord(pid) {
      if (!pid) return null;
      var direct = _FTM_BY_ID[pid];
      if (direct) return direct;
      var key = FTM_ID_ALIAS[pid];
      return (key && _FTM_BY_ID[key]) ? _FTM_BY_ID[key] : null;
    }

    // Published read-only, for finance-lane.js's second lookup seam: the lane
    // falls back to the raw index when this file's accessors are absent (a test
    // harness, a future ingest), and that fallback has to resolve the same ids
    // this one does or the two seams would answer differently for the same pid.
    window.PDX_FINANCE_ID_ALIAS = Object.assign({}, FTM_ID_ALIAS);

    // ── THE INDEX HAS TO LEAVE THIS CLOSURE ─────────────────────────────────
    // `_FTM_BY_ID` is a `var` inside this IIFE, so it is not a global and never
    // was. finance-lane.js — which owns the letterhead 💰 chip, the coverage
    // sentence and the money lane's one composition read — looked it up as
    // `window._FTM_BY_ID`, found undefined in every browser, and therefore
    // reported "no money file" for EVERY person on the site and a coverage count
    // of 0 filings. Mike Lee's profile printed "No money file" in the letterhead
    // directly above a money section drawing his full $8.6M composition, because
    // that section reads `window._pdxFinanceSignal` instead, which IS exposed.
    // The fences never caught it: both test files attach their own
    // `win._FTM_BY_ID` before booting the lane, so they were testing a wiring
    // that only existed in the harness.
    //
    // Exposed as ACCESSORS rather than as the raw object, for the reason
    // `_pdxFinanceRecord` above already gives: a display module should not be
    // able to mutate the record it is reporting on. `_pdxFinanceFiling` hands
    // back a shallow copy with the funding buckets attached; `_pdxFinanceIds`
    // hands back the ids that actually carry a filing, which is the numerator in
    // the coverage sentence and must be counted from the shipped data rather
    // than typed into it.
    window._pdxFinanceFiling = function(pid) {
      var p = _ftmRecord(pid);
      if (!p) return null;
      return {
        id: p.id, name: p.name || '', office: p.office || '',
        totalRaised: p.totalRaised || 0,
        topDonors: (p.topDonors || []).map(function(d) {
          return { name: d.name, amount: d.amount, type: d.type };
        }),
        sectors: Object.assign({}, p.sectors || {}),
        funding: p.funding ? Object.assign({}, p.funding) : null,
        source: p.source || ''
      };
    };
    window._pdxFinanceIds = function() {
      return Object.keys(_FTM_BY_ID).filter(function(id) {
        return !!(_FTM_BY_ID[id] && _FTM_BY_ID[id].funding);
      });
    };

    function _fmtMoney(n) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      var abs = Math.abs(n);
      if (abs >= 1e9) return '$' + (n / 1e9).toFixed(n % 1e9 === 0 ? 0 : 1) + 'B';
      if (abs >= 1e6) return '$' + (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1) + 'M';
      if (abs >= 1e3) return '$' + Math.round(n / 1e3) + 'K';
      return '$' + n;
    }

    // How much of the money is small-dollar / grassroots vs. institutional (PACs and
    // industry). Small individual contributions are the clearest grassroots signal,
    // so a donor row counts as grassroots when it is an individual whose label reads
    // "small"/"grassroots"; everything else (named mega-donors, PACs, industries) is
    // treated as big-money for this at-a-glance read.
    function _fundingCharacter(p) {
      var raised = p.totalRaised || 0;
      var grass = 0;
      (p.topDonors || []).forEach(function(d) {
        var isSmall = d.type === 'individual' && /small|grass|grassroot/i.test(d.name || '');
        if (isSmall) grass += (d.amount || 0);
      });
      var pct = raised > 0 ? Math.round(100 * grass / raised) : null;
      // ONE GLYPH, NOT A LADDER. This used to hand back a different emoji per
      // level — 🌱 sprout for grassroots, ⚖️ scales for mixed, 🏦 bank for
      // big-money — which is a three-step ranking that happens to be drawn in
      // pictures instead of hexes. It also read as a verdict on the person when
      // the underlying number is a property of a filing. The ⚖️ in the middle was
      // worse than the ramp itself: that glyph is Word vs Action's badge, so a
      // donor mix had borrowed the vocabulary of a promise-keeping measure.
      //   Every state now returns 💰, the money lane's one mark. The mix is
      // still reported — in `label`, in words, with its percentage — and callers
      // still get `kind` for anything that needs the category in text. What no
      // longer exists is a channel that grades it at a glance.
      var kind, label, icon = '💰';
      if (pct === null) { kind = 'unknown'; label = 'Funding mix unavailable'; }
      else if (pct >= 40) { kind = 'grassroots'; label = pct + '% small-dollar'; }
      else if (pct >= 15) { kind = 'mixed'; label = pct + '% small-dollar'; }
      else { kind = 'bigmoney'; label = 'Mostly big-money'; }
      return { grassrootsPct: pct, kind: kind, label: label, icon: icon };
    }

    // The single largest funder — the headline "who's behind them" fact.
    function _topFunder(p) {
      var list = (p.topDonors || []).slice().sort(function(a, b) { return (b.amount || 0) - (a.amount || 0); });
      if (!list.length) return null;
      var d = list[0];
      return { name: d.name, type: d.type, amount: d.amount || 0, amountFmt: _fmtMoney(d.amount || 0) };
    }

    window._pdxFunding = function(pid) {
      var p = _ftmRecord(pid);
      if (!p) return null;
      return {
        id: p.id,
        name: p.name,
        raised: p.totalRaised || 0,
        raisedFmt: _fmtMoney(p.totalRaised || 0),
        topFunder: _topFunder(p),
        character: _fundingCharacter(p),
        whyItMatters: p.whyItMatters || '',
        signal: _financeSignal(p),
        source: p.source || 'https://www.opensecrets.org',
      };
    };

    // Small escapers so the funding UI is safe to build from record text.
    function _pdxFEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function _pdxFAttr(s) { return _pdxFEsc(s).replace(/"/g, '&quot;'); }

    // Human word for a funding-base kind, matching the Compare page's language.
    function _pdxFundWord(kind) {
      return kind === 'grassroots' ? 'Grassroots'
        : kind === 'bigmoney' ? 'Big-money'
        : kind === 'mixed' ? 'Mixed' : 'Unclassified';
    }
    function _pdxFundCls(kind) {
      return kind === 'grassroots' ? 'is-grass'
        : kind === 'bigmoney' ? 'is-big'
        : kind === 'mixed' ? 'is-mixed' : 'is-unknown';
    }

    // ── Compact funding chip — the at-a-glance "who funds them" indicator ────
    // A single reusable pill for cards (Home Team ballot today; search / evidence
    // later). Always returns something for a card: the filing's dollar figure when
    // a record is on file, or the words "Not on file" otherwise — never nothing,
    // never noisy. Reuses window._pdxFunding, so it stays in sync with Compare
    // automatically.
    //   Both states wear the same green-and-gold pill at the same weight. The chip
    // is a door to the money lane, and a door does not change colour depending on
    // what is behind it — an undigitised filing is a fact about the archive, and
    // dimming the pill would report it as a fact about the person.
    window._pdxFundingChip = function (pid) {
      var f = window._pdxFunding(pid);
      if (!f) {
        return '<span class="pdx-fchip is-none" title="No campaign-finance record on file yet">'
          + '<span class="pdx-fchip-ico">💰</span><b>Funding</b>'
          + '<span class="pdx-fchip-word">Not on file</span></span>';
      }
      var c = f.character || {};
      var kind = c.kind || 'unknown';
      var word = _pdxFundWord(kind);
      var top = f.topFunder ? (' · Top funder: ' + f.topFunder.name + ' (' + f.topFunder.amountFmt + ')') : '';
      var title = word + '-funded · ' + f.raisedFmt + ' raised' + (c.label ? ' · ' + c.label : '') + top;
      return '<span class="pdx-fchip ' + _pdxFundCls(kind) + '" title="' + _pdxFAttr(title) + '">'
        + '<span class="pdx-fchip-ico">' + (c.icon || '💰') + '</span>'
        + '<b>' + _pdxFEsc(f.raisedFmt) + '</b>'
        + '<span class="pdx-fchip-word">' + _pdxFEsc(word) + '</span></span>';
    };

    // ── Full profile "Money & Funding" section ──────────────────────────────
    // The richer read shown on a politician profile. Same lookup and the same
    // words as Compare, laid out for one person. Renders a calm "Not on file"
    // state (never an empty gap or a fabricated figure) when there's no record.
    window._pdxFundingSection = function (pid, p) {
      p = p || {};
      var first = p.name ? String(p.name).split(' ')[0] : 'this official';
      var f = window._pdxFunding(pid);
      var head = '<span id="pdxsec-funding" class="pdx-nav-anchor" aria-hidden="true"></span>'
        + '<div class="modal-section pdx-fund" id="modal-funding">'
        + '<div class="modal-section-title pdx-money-h">'
        +   '<span class="pdx-money-h-ico">💰</span> Money &amp; Funding</div>';

      // ── THE EMPTY STATE IS COVERAGE COPY, AND IT NAMES THE GAP ──────────
      // This used to read "Not on file — No campaign-finance record for Lee YET.
      // This section fills in automatically as filings are added." Three problems,
      // and all three were about who the sentence was describing.
      //   "Yet" describes a queue. It tells a reader the file is on its way, which
      // implies somebody looked and the archive is still loading. For most of this
      // roster nobody has looked and no ingest is scheduled to look.
      //   "Fills in automatically" promised a pipeline that does not exist. There is
      // no live FEC ingest and Utah publishes no API; a curator transcribes filings
      // by hand. A promise the site cannot keep is worse than a blank.
      //   And it named no source, so the blank could not be told apart from a search
      // that came back clean. PDXFinanceLane.sourceGapHtml names the archive the
      // filing would have come from — the FEC, Utah's state disclosure system, or
      // plainly "none opened" — in one line, derived from the office string alone.
      // No donor, committee or figure is invented anywhere in this branch.
      if (!f) {
        var _gap = (window.PDXFinanceLane && typeof window.PDXFinanceLane.sourceGapHtml === 'function')
          ? window.PDXFinanceLane.sourceGapHtml(pid, p) : '';
        var _cov = (window.PDXFinanceLane && typeof window.PDXFinanceLane.coverageHtml === 'function')
          ? window.PDXFinanceLane.coverageHtml() : '';
        return head
          + '<p class="modal-section-sub">Who bankrolls ' + _pdxFEsc(first) + ' — from public disclosure filings. This is a coverage statement, not a finding.</p>'
          + '<div class="pdx-fund-none">'
          +   '<div class="pdx-fund-none-ico">💰</div>'
          +   '<div><div class="pdx-fund-none-t">No money file on hand</div>'
          +   '<div class="pdx-fund-none-s">PolitiDex holds no itemized campaign-finance filing for '
          +     _pdxFEsc(first) + '. That is missing data on our side — it is not a finding about '
          +     _pdxFEsc(first) + ', and nothing here reads it as one.</div>'
          +   _gap + '</div>'
          + '</div>'
          + _cov
          + '</div>';
      }

      // ── THE LEAD IS COMPOSITION AS COUNTS ───────────────────────────────
      // Deleted from this branch, deliberately:
      //
      //   THE DONOR-MIX WORD. `_pdxFundWord(kind)` printed "Grassroots" /
      // "Mixed" / "Big-money" in a pill with an explanatory line under it
      // ("Leans on named mega-donors, PACs and industries"). That is the retired
      // Constituents-First grade — its three levels, its cut-offs, its
      // characterisation of a person — surviving as prose after the arithmetic,
      // the colour ramp and the glyph ladder were each deleted in turn. A level
      // written in words is still a level, and this one led the money lane.
      //   ITS PERCENTAGE. `c.label` was "38% small-dollar" — a bare 0–100 on the
      // first line of the section, detached from the bucket it was a share of.
      // The shares are still published, one block down in the composition, each
      // one attached to its own bucket and its own dollar figure, which is the
      // only arrangement in which a percentage here is composition rather than a
      // grade.
      //   THE SIZE TIER. "Large war chest" above $10M and "Modest war chest"
      // below $500K is a three-step ranking of a dollar figure that is already
      // printed in full an inch away. The comment defending it said more money
      // "isn't a virtue, just context" — which is exactly the argument for
      // printing the figure and stopping.
      //
      // What leads instead is PDXFinanceLane.countsHtml: reported sources, named
      // contributors, industry sectors and self-funding, as counts, plus an
      // explicit line saying in-state vs out-of-state giving is absent from the
      // records we hold rather than absent from the filing.
      var _ftmRec = _FTM_BY_ID[pid] || null;
      var countsLead = (window.PDXFinanceLane && typeof window.PDXFinanceLane.countsHtml === 'function')
        ? window.PDXFinanceLane.countsHtml(f.signal, _ftmRec) : '';

      var topBlock = f.topFunder
        ? '<div class="pdx-fund-stat"><div class="pdx-fund-stat-label">Top Funder</div>'
          + '<div class="pdx-fund-top-name">' + _pdxFEsc(f.topFunder.name) + '</div>'
          + '<div class="pdx-fund-top-amt">' + _pdxFEsc(f.topFunder.amountFmt) + (f.topFunder.type ? ' · ' + _pdxFEsc(f.topFunder.type) : '') + '</div></div>'
        : '<div class="pdx-fund-stat"><div class="pdx-fund-stat-label">Top Funder</div><div class="pdx-fund-top-name pdx-fund-dim">Not itemized</div></div>';

      return head
        + '<p class="modal-section-sub">Who bankrolls ' + _pdxFEsc(first) + ' — from public FEC / OpenSecrets filings. Donations are legal and don\'t imply corruption; this is about <em>who has financial access</em>.</p>'
        + '<div class="pdx-fund-grid">'
        +   '<div class="pdx-fund-stat"><div class="pdx-fund-stat-label">Total Raised</div>'
        +     '<div class="pdx-fund-raised">' + _pdxFEsc(f.raisedFmt) + '</div></div>'
        +   topBlock
        + '</div>'
        + countsLead
        + (f.signal ? window._pdxFinanceSignalHTML(f.signal) : '')
        + (f.whyItMatters ? '<p class="pdx-fund-why"><strong>Why it matters:</strong> ' + _pdxFEsc(f.whyItMatters) + '</p>' : '')
        + '<div class="pdx-fund-actions">'
        +   '<a class="pdx-fund-src" href="' + _pdxFAttr(f.source) + '" target="_blank" rel="noopener noreferrer">📄 FEC / OpenSecrets ↗</a>'
        +   '<button type="button" class="pdx-fund-cmp" onclick="window._pdxCompareWith && window._pdxCompareWith(\'' + _pdxFAttr(pid) + '\', event)">⚖️ Compare funding</button>'
        + '</div>'
        + '</div>';
    };

    // One-tap path from a funding indicator into a real side-by-side: select
    // this person, pull in their race peers (so the comparison isn't a dead-end
    // of one), and open the Compare tool. Closes any open profile modal first so
    // the Compare view is actually visible.
    window._pdxCompareWith = function (pid, ev) {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      if (!pid) return;
      try { if (typeof window.closeModal === 'function') window.closeModal(); } catch (e) {}
      setTimeout(function () {
        try {
          if (window._cmpSelected && typeof window._cmpSelected.add === 'function') window._cmpSelected.add(pid);
          if (typeof window.cmpAddRacePeers === 'function') { try { window.cmpAddRacePeers(pid); } catch (e) {} }
          if (typeof window.openCompare === 'function') window.openCompare();
        } catch (e) {}
      }, 60);
    };
  })();
  </script>
