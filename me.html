  <!-- ═══════════════════════════════════════════════════════════════════════════════
       /me — THE VOTER'S OWN FILE. ONE DOCUMENT, ONE ADDRESS, ONE EDITOR.
       ──────────────────────────────────────────────────────────────────────────────
       WHAT THIS ADDRESS FIXES. This account had two names and two surfaces. The
       account menu's "Your File" was the hash #your-file on the homepage; its
       "My Views" was a scroll to a very long My Stances region on that same
       homepage. Ballot picks were a third place — the /ballot desk — and starred
       issues a fourth. One person, four addresses, none of them shareable or
       bookmarkable, and Back from any of them meant "the front page, roughly
       where you were." Two editors of the same eight answers is a pair that can
       drift; four addresses for one desk is a thing nobody can link to.

       So /me is the desk, /me is the ONLY address for it, and the homepage keeps
       no editor of record. netlify.toml rewrites /me and /me/ to this file, and
       both account-menu controls now assign('/me') instead of setting a hash.
       #your-file still WORKS — it replace-hops here once, because a bookmark a
       reader made last year is not a thing to break — but it is no longer a
       place where the eight answers can be edited.

       WHAT IS ON IT. Seven regions, described where they are built (me-desk.js),
       and not one of them is a product: who this account is, the eight-issue
       editor, the starred issues, a snapshot of the ballot, the saved evidence,
       three text links to the tools that own the real work, and this reader's
       standing with the district board. It is a desk. It summarizes and it hands
       off. The board itself, like the ballot workspace, lives at its own
       address.

       WHAT IS DELIBERATELY NOT ON IT.
         · NO SCORE FOR THE VOTER, of any kind. No percentage, no grade, no
           completeness figure, no "80% aligned with Utah". Every count on this
           page is the length of a real list written as a sentence.
         · NO SECOND EDITOR. Region b is your-file.js's own renderer painted into
           a host this document supplies. Same module, same store, same eight
           rows, same set(). There is nothing here for the panel to drift from.
         · NO BALLOT. The snapshot lists seats and names picks. It cannot make
           one, it carries no field of candidates, and ballot-workspace.js is not
           on this document. /ballot is one link away and owns all of that.
         · NO PARTY CHIP ON THE VOTER, and no party metric anywhere.
         · NOBODY ELSE'S FILE. This document reads this browser's own account and
           has no path that can address another. It is noindex.
         · NO ENGINE. alignment-tool.js, the consistency lane, the voting-record
           prefetch, compare-hub.js and profiles-full.js are all absent. A desk
           that summarizes what you hold does not need the machine that compares
           it — and a reader who wants that machine has a link to it.
         · NO DISTRICT BOARD. Region g says which of three standings this reader
           has with District Voice and offers the one control that standing can
           honour. It holds no thread, no take, no poll, no count and no feed of
           bills; it reads no formal-record module; it enters neither the match
           nor the ballot order; and district-voice.css is not loaded, so the
           board's own shapes cannot arrive on this document by accident.

       THE CRITICAL PATH, AND WHY EACH FILE IS ON IT. Four inline blocks and
       eight scripts, which is the whole document:
         PDXStore        the storage seam every store below writes through.
         the ledger      firebase-boot.js reads _firestoreLoaded and
                         _checkAndTrigger as BARE identifiers, so this block is a
                         hard dependency of the roster load, not a convenience.
         firebase        MANDATORY HERE, and this is the reason the whole pass
                         exists: your-file.js keys its store per account
                         (pdx_your_file_v1__u_<uid>) and learns the uid from the
                         pdx-account-change event that firebase-boot.js's auth
                         handler causes. Without Firebase on this document /me
                         would read the un-namespaced key while the homepage read
                         the per-account one — two files for one reader, which is
                         the exact defect being closed. It is also the only name
                         source region d has (see browse-photos below).
         PDXSaved        region e's store. It already existed; this lists it.
         person-link.js  one owner of "what is this person's URL", so a pick's
                         name links to the same /p/ address everywhere else does.
         browse-photos   faces for the picks, and nothing else — 114 KB of map
                         instead of cmp-data.js's 384 KB of records, because a
                         row needs a portrait and a name, the roster index above
                         carries the name, and this carries the portrait.
         issue-map.js    the issue register. my-stances.js drops any answer whose
                         key is not in it, so without this region c is empty for
                         every reader.
         voter-hub-loc.  the one owner of where this account votes AND of
                         TEAM_POSITIONS, the slate regions a and d both read.
                         Flagged in .netlify/results.md as the one file here that
                         is outside the brief's minimal list: the alternative is
                         a second per-state slate table and a second location
                         reader inside me-desk.js, which is the drift this pass
                         exists to end.
         my-stances.js   the stars store, and _msPriorityWeight — the SAME hook
                         the match engine weights with. Loaded without its
                         section: init() bails on a missing #ms-body and leaves
                         itself uninitialised, so a later PDXStances.open() on
                         the homepage still mounts normally.
         your-file.js    the positions editor of record, painted inline here.
         district-voice  the one owner of District Voice's seat allow-list, of
                         the seat a saved ballot location names, of the board's
                         address and of the sentence that frames what the board
                         is. Region g asks it and decides nothing; the
                         alternative is a second copy of that allow-list here.
                         Inert on this document: no mount, no host, no fetch.
         me-desk.js      the desk.

       WHAT IS NOT HERE THAT THE OTHER SHELLS CARRY. No app.css (986 KB of
       homepage cascade for seven regions), no PWA runtime and no service-worker
       registration, no /manifest.json, no pdx-perf.js, no share furniture beyond
       the tags below, no JSON-LD. ballot.html is the precedent for every one of
       those, and for the same reason: a private workspace is not the front page.

       EVERY SAME-ORIGIN PATH IN THIS DOCUMENT IS ROOT-ABSOLUTE, with no
       exceptions and this is not a style preference. /me is served from a path
       with no trailing segment, but /me/ is rewritten to this same file, and on
       THAT address a bare src="me-desk.js" resolves to /me/me-desk.js — which
       the rewrite answers with this HTML document. The browser then parses HTML
       as JavaScript, every module is silently absent, and the page renders a
       blank desk with no error that names the cause.
       ═══════════════════════════════════════════════════════════════════════════════ -->

  <style>
    /* THE FIXED CHROME, MEASURED ONCE. Same contract person.html, issue.html,
       spotlight.html and ballot.html answer for their own chrome, and for the
       same reason: a custom property that is never declared invalidates every
       calc() that reads it. This document's chrome is ONE row and no search, so
       the number is the height of the bar declared below. The @supports guard is
       the one all four carry — a custom property accepts any token sequence, so
       an engine that cannot parse env() would swallow the declaration and
       invalidate every calc() reading it; an engine without env() also has no
       notch. */
    :root { --pdx-chrome: 3.25rem; color-scheme: dark; }
    @supports (padding-top: env(safe-area-inset-top)) {
      :root { --pdx-chrome: calc(3.25rem + env(safe-area-inset-top, 0px)); }
    }
    /* No app.css here, so the page's own ground colour is declared rather than
       inherited from a 986 KB stylesheet this document does not load. */
    html, body { background: #070b16; color: #e7eefb; }
    body {
      margin: 0;
      font-family: 'Barlow', system-ui, -apple-system, sans-serif;
      padding-top: calc(var(--pdx-chrome) + 0.75rem);
    }

    /* The one-row shell bar. Static: no search field, no account menu, no layout
       observer, no measurement pass, nothing that reads the viewport. The
       account menu is absent on purpose — this document IS the thing that menu
       points at, and a menu here would be a door back into the room you are
       standing in. */
    .pdx-me-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1200;
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; height: 3.25rem; padding: env(safe-area-inset-top, 0px) 1rem 0;
      background: rgba(10, 15, 30, 0.86); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .pdx-me-bar a { text-decoration: none; }
    .pdx-me-wordmark {
      font-family: 'Bebas Neue', 'Barlow Condensed', sans-serif;
      font-size: 1.15rem; letter-spacing: 0.12em; color: #fff;

    .pdx-me-wordmark span { color: #e0273f; }
    .pdx-me-links { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
    .pdx-me-home {
      font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem;
      letter-spacing: 0.14em; text-transform: uppercase; color: #9fb4d4;

  <!-- ══ THE FLAG — ONE DECLARATION, READ THROUGH ONE ACCESSOR ═══════════════
       This is the first script on the document, before any module can look for
       it, and it is the ONLY place the flag is set. Two modules read it:

         me-desk.js  refuses to boot unless it is true, so a stray script tag on
                     the homepage cannot paint a second desk over the real one.
         your-file.js reads it to decide what #your-file MEANS. On this document
                     the eight rows are already on the page, so the hash and the
                     account-menu click are satisfied by scrolling to region b.
                     On every other document they are an ADDRESS: the module
                     replace-hops to /me once and the overlay never opens.

       ONE FLAG, NO HEURISTICS. Neither module sniffs location.pathname, and
       nothing else in the app is allowed to either — a path test is a second
       answer to "which document is this", and /me, /me/ and a local preview
       server's /me.html are three spellings of one document that a path test
       gets differently.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>window.__PDX_ME_DOC = true;</script>

  <!-- ══ COPIED VERBATIM FROM person.html LINES 288–1271 ════════════════════════
       PDXStore / PDXTeam / PDXTeamV2 — the storage seam. Every store on this
       document writes through it: your-file.js's eight answers, my-stances.js's
       stars, PDXSaved below, and the ballot map region d reads. It touches
       localStorage and nothing else: no DOM, no network, no account.

       IT IS ALSO WHY REGION d AND /ballot CANNOT DISAGREE. PDXStore.read() is a
       plain getRaw on the LITERAL key — the store namespaces nothing itself,
       each feature that wants an account key builds its own — so
       'politidex_my_team' is the same string here, on the homepage, and in
       ballot-breakdown.js's _ballotLoad, which reads it raw on /ballot because
       that shell carries no store at all.
       ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';
  if (window.PDXStore) return; // idempotent — never redefine

  // ─── Sync-state persistence ──────────────────────────────────────────────
  // One small record tracking, per collection, whether the local data has
  // un-pushed changes. Kept separate from the data itself so clearing/marking
  // dirty never risks the actual user content.
  var SYNC_KEY = 'pdx_sync_state';
  var SYNC_VERSION = 1;

  // ─── Backends ─────────────────────────────────────────────────────────────
  // A backend is the thing that actually holds bytes. Only the raw string I/O
  // differs between backends; JSON handling and dirty tracking sit above them.
  function makeLocalBackend() {
    return {
      name: 'local',
      isAvailable: function () {
        try {
          var t = '__pdx_probe__';
          localStorage.setItem(t, '1'); localStorage.removeItem(t);
          return true;
        } catch (e) { return false; }
      },
      getRaw: function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
      setRaw: function (key, str) { try { localStorage.setItem(key, str); return true; } catch (e) { return false; } },
      removeRaw: function (key) { try { localStorage.removeItem(key); return true; } catch (e) { return false; } }
    };
  }

  // The active data backend. Swappable later (see setBackend) — e.g. a backend
  // that reads/writes localStorage AND queues an upstream push. For now it is
  // always the plain local backend, so behaviour is unchanged.
  var _backend = makeLocalBackend();

  // The OPTIONAL remote backend (account sync). Null until setRemoteBackend()
  // is called, so out of the box there is no network and no auth — the app is
  // pure localStorage. When set, it unlocks push()/pull() without changing any
  // local read/write path. See the contract doc block near window.PDXStore.
  var _remote = null;
  var _remoteOpts = {};
  var _pushing = {};   // collection name -> in-flight push Promise (de-dupes concurrent pushes)

  // ─── Collection registry ────────────────────────────────────────────────
  // logical name → { keys:[localStorage keys it owns], label }
  // Used to (a) know which collection a key write should dirty, and (b) let a
  // future sync engine enumerate exactly what belongs to each syncable set.
  var _collections = {};
  var _keyToCollection = {};

  function defineCollection(name, opts) {
    if (!name) return;
    opts = opts || {};
    var keys = (opts.keys || []).slice();
    _collections[name] = { name: name, keys: keys, label: opts.label || name };
    for (var i = 0; i < keys.length; i++) { _keyToCollection[keys[i]] = name; }
    // Make sure a sync-state slot exists for it.
    var st = _loadSync();
    if (!st.collections[name]) {
      st.collections[name] = { dirty: false, lastLocalChangeAt: 0, lastSyncedAt: 0, revision: 0 };
      _saveSync(st);
    }
    return _collections[name];
  }

  // Register (or extend) the localStorage keys a collection owns — so keys that
  // are only known deep inside a later <script> can still be attached to their
  // collection for dirty tracking.
  function attachKeys(name, keys) {
    if (!_collections[name]) defineCollection(name, { keys: keys });
    else {
      for (var i = 0; i < keys.length; i++) {
        if (_collections[name].keys.indexOf(keys[i]) === -1) _collections[name].keys.push(keys[i]);
        _keyToCollection[keys[i]] = name;
      }
    }
  }

  // ─── Sync-state helpers ───────────────────────────────────────────────────
  function _loadSync() {
    var raw = _backend.getRaw(SYNC_KEY);
    var st = null;
    try { st = raw ? JSON.parse(raw) : null; } catch (e) { st = null; }
    if (!st || typeof st !== 'object') st = { version: SYNC_VERSION, collections: {} };
    if (!st.collections || typeof st.collections !== 'object') st.collections = {};
    return st;
  }
  function _saveSync(st) {
    try { _backend.setRaw(SYNC_KEY, JSON.stringify(st)); } catch (e) {}
  }
  function _now() {
    // Timestamps are best-effort ordering hints for a future sync engine; a
    // missing clock must never break a write.
    try { return Date.now(); } catch (e) { return 0; }
  }
  function _emit(name, detail) {
    try { window.dispatchEvent(new CustomEvent(name, { detail: detail || {} })); } catch (e) {}
  }

  function markDirty(collection) {
    if (!collection) return;
    var st = _loadSync();
    var c = st.collections[collection] || (st.collections[collection] = { dirty: false, lastLocalChangeAt: 0, lastSyncedAt: 0, revision: 0 });
    c.dirty = true;
    c.lastLocalChangeAt = _now();
    c.revision = (c.revision || 0) + 1;
    _saveSync(st);
    _emit('pdx-sync-state-change', { collection: collection, dirty: true });
  }

  // Called by a future sync engine after a successful push, to record that the
  // local copy is now in agreement with the server as of `syncedAt`.
  function clearDirty(collection, syncedAt) {
    if (!collection) return;
    var st = _loadSync();
    var c = st.collections[collection];
    if (!c) return;
    c.dirty = false;
    c.lastSyncedAt = syncedAt || _now();
    _saveSync(st);
    _emit('pdx-sync-state-change', { collection: collection, dirty: false });
  }

  function isDirty(collection) {
    var st = _loadSync();
    if (collection) return !!(st.collections[collection] && st.collections[collection].dirty);
    // No arg → is ANYTHING pending?
    for (var k in st.collections) { if (st.collections[k] && st.collections[k].dirty) return true; }
    return false;
  }

  function pendingCollections() {
    var st = _loadSync(), out = [];
    for (var k in st.collections) { if (st.collections[k] && st.collections[k].dirty) out.push(k); }
    return out;
  }

  function getSyncState() {
    // Deep-ish clone so callers can read but not mutate the persisted record.
    var st = _loadSync(), out = { version: st.version || SYNC_VERSION, collections: {} };
    for (var k in st.collections) {
      var c = st.collections[k];
      out.collections[k] = { dirty: !!c.dirty, lastLocalChangeAt: c.lastLocalChangeAt || 0, lastSyncedAt: c.lastSyncedAt || 0, revision: c.revision || 0 };
    }
    return out;
  }

  // ─── Data read / write primitives ─────────────────────────────────────────
  // These are the calls features make. `read`/`write` are JSON-typed (the
  // common case); `readRaw`/`writeRaw` handle plain strings (e.g. a mode flag).
  // Any write to a key owned by a collection auto-marks that collection dirty,
  // so features get change-tracking for free just by routing through here.
  function _collectionForKey(key) { return _keyToCollection[key] || null; }

  // ─── Collection snapshots (the payload a push sends upstream) ──────────────
  // A "snapshot" is the complete, serializable state of one collection — exactly
  // what a remote backend receives in push() and would return from pull(). A
  // feature registers a shaped provider for its collection (see PDXSaved and
  // PDXTeam.snapshot). Collections without a registered provider fall back to a
  // raw { ownedKey: parsedValue } map, which is enough for any single-key set.
  var _snapshotProviders = {};
  function registerSnapshot(collection, fn) {
    if (collection && typeof fn === 'function') _snapshotProviders[collection] = fn;
  }
  function snapshot(collection) {
    var fn = _snapshotProviders[collection];
    if (fn) { try { return fn(); } catch (e) { return null; } }
    var c = _collections[collection];
    if (!c) return null;
    var out = {};
    for (var i = 0; i < c.keys.length; i++) { out[c.keys[i]] = read(c.keys[i], null); }
    return out;
  }

  // ─── Collection reconcilers (the pull-side counterpart to registerSnapshot) ─
  // registerSnapshot() shapes what a collection PUSHES up; a reconciler decides
  // how a PULLED server snapshot is MERGED back into local state. It is the one
  // place that knows a collection's data shape well enough to combine two
  // versions safely, so PDXStore itself stays data-agnostic. Both personal
  // collections now register one ('saved' and 'team'); a collection WITHOUT a
  // reconciler is never pulled — pullCollection() no-ops for it — so any future
  // push-only collection keeps exactly its current behavior and is never at risk
  // of being clobbered by server data.
  var _reconcilers = {};
  function registerReconciler(collection, fn) {
    if (collection && typeof fn === 'function') _reconcilers[collection] = fn;
  }


  function read(key, fallback) {
    var raw = _backend.getRaw(key);
    if (raw == null) return (fallback === undefined ? null : fallback);
    try { return JSON.parse(raw); } catch (e) { return (fallback === undefined ? null : fallback); }
  }
  function write(key, value, opts) {
    var ok = false;
    try { ok = _backend.setRaw(key, JSON.stringify(value)); } catch (e) { ok = false; }
    _afterWrite(key, opts);
    return ok;
  }
  function readRaw(key) { return _backend.getRaw(key); }
  function writeRaw(key, str, opts) {
    var ok = _backend.setRaw(key, String(str == null ? '' : str));
    _afterWrite(key, opts);
    return ok;
  }
  function remove(key, opts) {
    var ok = _backend.removeRaw(key);
    _afterWrite(key, opts);
    return ok;
  }
  function _afterWrite(key, opts) {
    // opts.dirty === false lets a caller persist without flagging a push
    // (e.g. writing data that just came DOWN from the server).
    var col = (opts && opts.collection) || _collectionForKey(key);
    if (col && !(opts && opts.dirty === false)) markDirty(col);
    // Dual-write mirror (Phase 1 of the team refactor): whenever a legacy
    // team-membership store changes locally, refresh the single-source-of-truth
    // politidex_team_v2 mirror so both shapes stay in agreement during the
    // transition. Guarded by opts.__v2 so a v2 write can never re-trigger itself,
    // and by a typeof check so writes that happen before the v2 module is defined
    // (during this IIFE's own init) are simply skipped.
    if (!(opts && opts.__v2) &&
        (key === 'politidex_my_team' || key === 'politidex_my_politicians') &&
        typeof _v2SyncFromLegacy === 'function') {
      try { _v2SyncFromLegacy(); } catch (e) {}
    }
  }

  // Explicitly mark a collection changed without going through write() — for
  // features whose scattered legacy writes are hard to fully reroute. Calling
  // this from their canonical save function keeps dirty tracking honest.
  function touch(collection) { markDirty(collection); }

  // ─── Backend management (for the future account phase) ─────────────────────
  function setBackend(b) { if (b && typeof b.getRaw === 'function') _backend = b; }
  function getBackend() { return _backend; }

  // ─── Remote backend (account sync) ─────────────────────────────────────────
  // Register the OPTIONAL remote backend. Registering it does NOT touch any
  // local read/write path — it only unlocks push()/pull(). Identity is the
  // backend's own concern: build it closing over whatever user id the caller
  // already has (this layer never authenticates). See the contract doc block
  // near window.PDXStore for the exact shape a backend must implement.
  //   opts.userId        optional id, echoed to the backend in push meta
  //   opts.autoPush      opt-in: debounce-push a collection after it goes dirty
  //   opts.autoPushDelay ms to wait before an auto-push (default 1500)
  function setRemoteBackend(backend, opts) {
    _remote = backend || null;
    _remoteOpts = opts || {};
    _emit('pdx-remote-change', { active: !!_remote, name: _remote && _remote.name });
    if (_remote && _remoteOpts.autoPush) _enableAutoPush();
    return _remote;
  }
  function getRemoteBackend() { return _remote; }

  // Push one collection's current snapshot upstream. ALWAYS resolves (never
  // rejects) with a small result object so callers can safely fire-and-forget:
  //   { pushed:true,  result }  → the backend accepted the snapshot
  //   { pushed:false, reason }  → nothing to do (no remote registered / clean)
  //   { pushed:false, error }   → the backend failed; the collection STAYS
  //                               dirty, so a later push retries it. A failed
  //                               push can never lose or corrupt local data.
  function pushCollection(name) {
    if (!name) return Promise.resolve({ pushed: false, reason: 'no-collection' });
    if (!_remote || typeof _remote.push !== 'function') {
      return Promise.resolve({ pushed: false, reason: 'no-remote' });
    }
    if (!isDirty(name)) return Promise.resolve({ pushed: false, reason: 'not-dirty' });
    if (_pushing[name]) return _pushing[name]; // coalesce concurrent pushes

    // Capture the revision as it stands NOW. If a local write bumps it while the
    // push is in flight, we must NOT clear the dirty flag afterwards — the newer
    // change hasn't been sent — so the next push still picks it up.
    var st = _loadSync();
    var startRev = (st.collections[name] && st.collections[name].revision) || 0;
    var snap = snapshot(name);
    var meta = { revision: startRev, userId: _remoteOpts.userId || null };

    var p = Promise.resolve()
      .then(function () { return _remote.push(name, snap, meta); })
      .then(function (res) {
        res = res || {};
        var cur = _loadSync().collections[name];
        var curRev = (cur && cur.revision) || 0;
        // Only mark clean if nothing changed locally during the push.
        if (curRev === startRev) clearDirty(name, res.syncedAt);
        _emit('pdx-sync-push', { collection: name, ok: true });
        return { pushed: true, result: res };
      })
      .catch(function (err) {
        // Offline / server error: leave the collection dirty for a later retry.
        _emit('pdx-sync-error', { collection: name, error: String((err && err.message) || err) });
        return { pushed: false, error: err };
      })
      .then(function (out) { delete _pushing[name]; return out; });

    _pushing[name] = p;
    return p;
  }

  // Push every collection that currently has un-synced local changes.
  function pushPending() { return Promise.all(pendingCollections().map(pushCollection)); }

  // Pull one collection's snapshot from the remote backend and merge it into the
  // local state via that collection's registered reconciler. Like pushCollection,
  // it ALWAYS resolves (never rejects) so callers can fire-and-forget on startup:
  //   { pulled:true,  ... }      → merged (the reconciler reports what changed)
  //   { pulled:false, reason }   → nothing to do (no remote / no pull() / no
  //                                reconciler registered for this collection)
  //   { pulled:false, error }    → the pull or merge failed; LOCAL DATA IS LEFT
  //                                EXACTLY AS IT WAS, so the app simply keeps
  //                                working from local storage. A failed pull can
  //                                never lose or corrupt local data.
  //
  // Pull is intentionally gated on a registered reconciler: without a merge
  // strategy we must NOT blindly overwrite local data with the server's, so an
  // un-reconciled collection is never pulled. Both 'saved' and 'team' register
  // one, so both sync two-way.
  function pullCollection(name) {
    if (!name) return Promise.resolve({ pulled: false, reason: 'no-collection' });
    if (!_remote || typeof _remote.pull !== 'function') {
      return Promise.resolve({ pulled: false, reason: 'no-remote' });
    }
    var reconcile = _reconcilers[name];
    if (typeof reconcile !== 'function') {
      return Promise.resolve({ pulled: false, reason: 'no-reconciler' });
    }

    // Capture dirtiness BEFORE the merge. A dirty collection has local edits that
    // haven't reached the server yet; the reconciler uses this to let those
    // un-pushed edits win ties so a pull can never quietly undo them.
    var wasDirty = isDirty(name);

    return Promise.resolve()
      .then(function () { return _remote.pull(name); })
      .then(function (res) {
        // res is { snapshot, syncedAt, revision } or null when the server has
        // no snapshot for this user+collection yet.
        var serverSnapshot = (res && res.snapshot) ? res.snapshot : null;
        var info = reconcile(serverSnapshot, {
          dirty: wasDirty,
          syncedAt: res && res.syncedAt,
          revision: res && res.revision
        }) || {};
        _emit('pdx-sync-pull', { collection: name, ok: true, changed: !!info.changed });
        return { pulled: true, hadServer: !!serverSnapshot, info: info };
      })
      .catch(function (err) {
        // Offline / server error / malformed payload: leave local data untouched.
        _emit('pdx-sync-error', { collection: name, error: String((err && err.message) || err) });
        return { pulled: false, error: err };
      });
  }

  // Optional, opt-in convenience: debounce-push a collection shortly after it
  // goes dirty. OFF by default so the baseline contract stays strictly
  // "push on request" — a caller that wants automatic pushes asks for them via
  // setRemoteBackend(backend, { autoPush: true }).
  //
  // opts.collections (optional) narrows auto-push to a specific allow-list. The
  // server accepts 'saved' and 'team', so both auto-push; any other dirty
  // collection is tracked locally but never auto-pushed (it would 404). Omitting
  // the list auto-pushes every dirty collection.
  var _autoPushOn = false, _autoTimers = {};
  function _enableAutoPush() {
    if (_autoPushOn) return;
    _autoPushOn = true;
    window.addEventListener('pdx-sync-state-change', function (e) {
      var col = e && e.detail && e.detail.collection;
      if (!col || !e.detail.dirty || !_remote) return;
      var allow = _remoteOpts.collections;
      if (allow && allow.indexOf(col) === -1) return;   // not in the allow-list
      if (_autoTimers[col]) { try { clearTimeout(_autoTimers[col]); } catch (x) {} }
      _autoTimers[col] = setTimeout(function () { pushCollection(col); }, _remoteOpts.autoPushDelay || 1500);
    });
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  REMOTE BACKEND CONTRACT — how to implement a future backend
  // ──────────────────────────────────────────────────────────────────────────
  //  A remote backend is a plain object. Register it with:
  //      PDXStore.setRemoteBackend(backend, { userId, autoPush });
  //  Nothing else in the app needs to change — collections already route every
  //  read/write through PDXStore, and push() reads the collection's snapshot.
  //
  //  A backend MUST implement (all data methods are async — return a Promise):
  //
  //    name : string
  //        A short id for logs/UI, e.g. 'netlify'.
  //
  //    push(collection, snapshot, meta) -> Promise<{ syncedAt?, revision? }>
  //        Persist `snapshot` (the full serializable state of `collection`) for
  //        the active user, upstream. Resolve on success (optionally returning
  //        the server's syncedAt/revision); REJECT/throw on any failure
  //        (network down, auth expired, 5xx). On rejection PDXStore keeps the
  //        collection dirty so the next push retries — so a backend should make
  //        push idempotent (a full-snapshot upsert keyed by user + collection).
  //        `meta` carries { revision, userId } — non-sensitive hints only.
  //
  //    pull(collection) -> Promise<{ snapshot, syncedAt?, revision? } | null>
  //        Fetch the latest upstream snapshot (null when the server has none).
  //        NOT used by the push-only flow yet; implement it now so the future
  //        sync loop can adopt it without a backend change.
  //
  //    getLastSynced(collection) -> Promise<number|null>
  //        The server's last-synced timestamp (ms) for this user+collection, or
  //        null. A future sync loop uses it for cheap change detection and
  //        conflict ordering. Safe to return null until the server tracks it.
  //
  //    isAvailable?() -> boolean | Promise<boolean>   (optional)
  //        Fast reachability/auth hint the sync loop can check before pushing.
  //
  //  REFERENCE IMPLEMENTATION — this is now REAL: the endpoint exists (Netlify
  //  Function at /api/pdx-sync backed by Netlify Database) and the working
  //  backend is implemented just below as makeNetlifyRemoteBackend(). The sketch
  //  below is kept as a compact contract example; the live version adds an
  //  optional getToken hook and defensive error handling.
  //

  //      var BASE = '/api/pdx-sync';                       // future Function
  //      function req(method, path, body) {
  //        return Promise.resolve(getToken && getToken()).then(function (tok) {
  //          return fetch(BASE + path, {
  //            method: method,
  //            headers: Object.assign(
  //              { 'content-type': 'application/json' },
  //              tok ? { authorization: 'Bearer ' + tok } : {}
  //            ),
  //            body: body ? JSON.stringify(body) : undefined
  //          });
  //        }).then(function (r) {
  //          if (!r.ok) throw new Error('pdx-sync ' + method + ' ' + path + ' -> ' + r.status);
  //          return r.status === 204 ? null : r.json();
  //        });
  //      }
  //      return {
  //        name: 'netlify',
  //        push: function (collection, snapshot, meta) {
  //          return req('PUT', '/' + encodeURIComponent(collection),
  //                     { userId: userId, snapshot: snapshot, revision: meta && meta.revision });
  //        },
  //        pull: function (collection) { return req('GET', '/' + encodeURIComponent(collection)); },
  //        getLastSynced: function (collection) {
  //          return req('GET', '/' + encodeURIComponent(collection) + '/meta')
  //            .then(function (m) { return (m && m.syncedAt) || null; });
  //        }
  //      };
  //    }
  //    // PDXStore.setRemoteBackend(makeNetlifyRemoteBackend({ userId: uid, getToken: fn }));
  // ══════════════════════════════════════════════════════════════════════════

  // ─── makeNetlifyRemoteBackend — the real backend for /api/pdx-sync ──────────
  // Implements the REMOTE BACKEND CONTRACT above against the live Netlify
  // Function at /api/pdx-sync (backed by Netlify Database). It does two-way sync:
  // push()/pull()/getLastSynced() are all wired (see enableAccountSync's startup
  // pull-then-push).
  //
  // AUTH IS REAL. Identity is the caller's Firebase account, proved by the ID
  // token that `getToken` returns; the server verifies that token and derives the
  // user id from it (see the Function's AUTHENTICATION note). `getToken` is
  // therefore REQUIRED: every request sends its result as `Authorization: Bearer
  // <token>`, and a request without a valid token is rejected server-side.
  // `userId` is optional and purely a client-side hint (logging / push meta) — the
  // server ignores any id the client sends and trusts only the token, so a client
  // can never read or write another user's data.
  function makeNetlifyRemoteBackend(cfg) {
    cfg = cfg || {};
    var userId = cfg.userId;                  // optional hint only; server ignores it
    var getToken = cfg.getToken;              // required: () -> token | Promise<token>
    var BASE = cfg.base || '/api/pdx-sync';   // overridable for tests
    if (typeof getToken !== 'function') {
      throw new Error('makeNetlifyRemoteBackend: getToken is required (real auth)');
    }

    function req(method, path, body) {
      return Promise.resolve(getToken()).then(function (tok) {
        // No token → not signed in (or the token couldn't be minted). Fail loudly
        // so PDXStore keeps the collection dirty and retries later; never send an
        // unauthenticated request that the server will just 401.
        if (!tok) throw new Error('pdx-sync: no auth token (not signed in)');
        return fetch(BASE + path, {
          method: method,
          headers: {
            'content-type': 'application/json',
            'authorization': 'Bearer ' + tok
          },
          body: body ? JSON.stringify(body) : undefined
        });
      }).then(function (r) {
        // Any non-2xx MUST throw: the contract keeps the collection dirty on a
        // rejected push, so the next push retries. Never swallow a failure into
        // a fake success or local data would be silently treated as synced.
        if (!r.ok) throw new Error('pdx-sync ' + method + ' ' + path + ' -> ' + r.status);
        return r.status === 204 ? null : r.json();   // 204 = server has none
      });
    }

    return {
      name: 'netlify',
      // push(collection, snapshot, meta) — full-snapshot upsert. Body shape is
      // exactly what the Function expects: { userId, snapshot, revision }. It
      // echoes back { syncedAt, revision }, which PDXStore uses to stamp the
      // collection clean. Idempotent server-side, so a retried push is safe.
      push: function (collection, snapshot, meta) {
        return req('PUT', '/' + encodeURIComponent(collection), {
          userId: userId,
          snapshot: snapshot,
          revision: meta && meta.revision
        });
      },
      // pull(collection) — fetch the latest server snapshot for this user. Now
      // wired into the startup sync loop (see pullCollection + enableAccountSync):
      // the result is merged with local state by the collection's reconciler.
      // Resolves null when the server has none (HTTP 204).
      pull: function (collection) {
        return req('GET', '/' + encodeURIComponent(collection));
      },
      getLastSynced: function (collection) {
        return req('GET', '/' + encodeURIComponent(collection) + '/meta')
          .then(function (m) { return (m && m.syncedAt) || null; });
      }
    };
  }

  // ─── Account-sync activation (connect the client ↔ /api/pdx-sync) ───────────
  // REAL IDENTITY — sync is now gated on a real, signed-in Firebase account.
  // enableAccountSync({ userId, getToken }) is called from the Firebase
  // auth-state handler (search "PDXStore.enableAccountSync" in the auth script)
  // the moment a non-anonymous user is present; disableAccountSync() is called on
  // sign-out (or for anonymous/guest sessions) to drop back to local-only.
  //
  // LOCAL-ONLY GUARANTEE (unchanged for anyone who never signs in) — until a real
  // user signs in, NO remote backend is registered, so nothing ever leaves this
  // browser: the app is the exact byte-for-byte pure-localStorage experience it
  // has always been. Even after sign-in, enabling sync only REGISTERS the backend;
  // a push happens solely when 'saved' actually goes dirty (via autoPush) or on
  // the one-time startup flush below. And if sync is disabled (localStorage
  // 'pdx_sync_disabled' = '1') or anything here throws, the backend is left
  // unregistered and the app stays local-only.
  var SYNC_DISABLED_KEY = 'pdx_sync_disabled';

  // The user id sync is currently wired for, so a repeat sign-in event for the
  // same account is a cheap no-op and a switch to a different account re-wires.
  var _syncUserId = null;

  // ─── Per-account local-storage context (isolation) ──────────────────────────
  // Which signed-in user "owns" the local data right now. This is purely a
  // LOCAL-STORAGE isolation concern, deliberately kept SEPARATE from network
  // sync: it decides which namespaced localStorage key a per-account collection
  // (currently only 'saved') reads and writes, so two people sharing one browser
  // never see — or accidentally merge — each other's saves.
  //
  //   _accountUserId === null   → guest / signed-out: the shared, legacy keyspace
  //                               (byte-for-byte the pre-isolation behavior).
  //   _accountUserId === <uid>  → signed in: that account's private namespace.
  //
  // WHY SEPARATE FROM SYNC: isolation is a privacy guarantee that must hold even
  // when the network is never touched — e.g. a user who opted sync out
  // ('pdx_sync_disabled'), or is offline, or is signed in before a token is
  // available. So the account context is established the moment a real user is
  // known and cleared on sign-out, regardless of whether push/pull ever run.
  // Collections don't reach in here; they listen for the 'pdx-account-change'
  // event and switch their active key (see PDXSaved's activeKey()).
  var _accountUserId = null;
  function getAccount() { return _accountUserId; }
  function _setAccount(uid) {
    var next = uid || null;
    if (next === _accountUserId) return;   // idempotent — no spurious re-render events
    _accountUserId = next;
    _emit('pdx-account-change', { userId: next });
  }

  // Turn on authenticated two-way sync for `identity` = { userId, getToken }:
  //   userId   the signed-in Firebase uid (a hint for logging/meta; the server
  //            derives the authoritative id from the token, not from this)
  //   getToken () -> Promise<idToken|null>, used for the Authorization header
  function enableAccountSync(identity) {
    try {
      identity = identity || {};
      var uid = identity.userId;

      // LOCAL ISOLATION FIRST — bind this account's private localStorage namespace
      // as soon as we know who signed in, BEFORE any sync decision. Keeping one
      // user's local saves out of another's is a privacy guarantee that must hold
      // even when network sync is opted out below, no token is available, or the
      // device is offline — so it happens unconditionally on a known uid. Per-
      // account collections switch their active key off this (see PDXSaved).
      if (uid) _setAccount(uid);

      if (_backend.getRaw(SYNC_DISABLED_KEY) === '1') return;   // explicit opt-out (data still isolated locally)
      if (!uid || typeof identity.getToken !== 'function') return;  // need real auth for network sync
      if (_remote && _syncUserId === uid) return;               // already wired for this user

      _syncUserId = uid;
      setRemoteBackend(makeNetlifyRemoteBackend({ userId: uid, getToken: identity.getToken }), {
        userId: uid,
        autoPush: true,                  // debounce-push a collection ~1.5s after it goes dirty
        collections: ['saved', 'team', 'evidence', 'impact', 'stances', 'yourFile']   // all personal collections sync (server allow-list)
      });
      // One-time startup sync of each synced collection, after the page has settled
      // (snapshot providers + reconcilers register during initial parse). We PULL
      // first, then PUSH, per collection:
      //   1. pull(col) fetches the server snapshot and merges it into local state
      //      (union + last-write-wins, tombstone-aware; un-pushed local edits are
      //      preserved because the collection is still dirty at merge time). This is
      //      what brings changes made on another device down onto this one.
      //   2. push(col) then sends the merged union back up, so the server converges
      //      too. It only sends when the collection is actually dirty.
      // Pull-before-push matters: a push is a full-snapshot overwrite, so pushing
      // FIRST could clobber another device's data this browser hadn't seen yet.
      // Both steps resolve gracefully and never throw — if the pull fails
      // (offline/error/no server data) local data is left exactly as-is.
      setTimeout(function () {
        ['saved', 'team', 'evidence', 'impact', 'stances', 'yourFile'].forEach(function (col) {
          try {
            pullCollection(col).then(function () {
              try { pushCollection(col); } catch (e) {}
            });
          } catch (e) {}
        });
      }, 2500);
    } catch (e) {
      // Sync wiring must never break the local app: fall back to local-only.
      _remote = null;
      _syncUserId = null;
    }
  }

  // Turn sync back OFF and return to local-only: called on sign-out and for
  // anonymous/guest sessions. Local data is untouched and stays fully usable;
  // this only stops the client from talking to the server so a signed-out (or
  // never-signed-in) user creates no server traffic and no server rows.
  function disableAccountSync() {
    try {
      // Drop the local per-account context FIRST so per-account collections fall
      // back to the shared guest keyspace (a clean local-only state) and never
      // keep showing the signed-out user's data. Their items are left untouched
      // in their own namespace — isolated, so they're still there if that same
      // account signs back in on this device, and never visible to the next user.
      _setAccount(null);
      if (!_remote && !_syncUserId) return;   // already local-only (network side)
      _syncUserId = null;
      setRemoteBackend(null);
    } catch (e) { /* local-only is the safe default; never throw */ }
  }

  window.PDXStore = {
    // data
    read: read, write: write, readRaw: readRaw, writeRaw: writeRaw, remove: remove,
    // collections
    defineCollection: defineCollection, attachKeys: attachKeys,
    collections: function () { return _collections; },
    registerSnapshot: registerSnapshot, snapshot: snapshot,
    registerReconciler: registerReconciler,
    // dirty / sync
    markDirty: markDirty, clearDirty: clearDirty, isDirty: isDirty,
    pendingCollections: pendingCollections, getSyncState: getSyncState, touch: touch,
    // local backend (storage medium)
    setBackend: setBackend, getBackend: getBackend,
    // remote backend (account sync) — optional; no-op until one is registered
    setRemoteBackend: setRemoteBackend, getRemoteBackend: getRemoteBackend,
    makeNetlifyRemoteBackend: makeNetlifyRemoteBackend,
    // account sync activation — driven by the Firebase auth-state handler:
    // enable on real (non-anonymous) sign-in, disable on sign-out/anonymous.
    enableAccountSync: enableAccountSync, disableAccountSync: disableAccountSync,
    // per-account local-storage context (isolation). getAccount() lets a
    // collection adopt the already-established account if it parses AFTER sign-in
    // resolved (auth can fire before late feature scripts run); setAccount() is
    // exposed for completeness/testing — normal flow drives it via enable/disable.
    getAccount: getAccount, setAccount: _setAccount,
    push: pushCollection, pushPending: pushPending, pull: pullCollection,
    get remote() { return _remote; },
    set remote(v) { setRemoteBackend(v); },
    SYNC_KEY: SYNC_KEY
  };

  // Declare the two personal collections up front so their sync slots exist
  // from first paint. Individual keys are attached by each feature's script
  // block as it defines them (see PDXSaved and PDXTeam).
  defineCollection('saved', { keys: ['pdx_my_saved'], label: 'Saved evidence, tags & notes' });
  defineCollection('team', {
    keys: [
      'politidex_my_team',            // active/visible 6-slot ballot map
      'politidex_home_base',          // protected "My Home Team" snapshot
      'politidex_team_mode',          // 'home' | 'research'
      'politidex_my_politicians',     // saved politicians roster
      'politidex_saved_teams_v1',     // named/multi saved teams
      'politidex_active_team_v1'      // which saved team is being edited
    ],
    label: 'My Team, ballot, roster & saved teams'
  });
  // 'evidence' — the Evidence Locker's saved collections (folders of receipts).
  // Its single owned key is the long-standing nested store; PDXEvidenceSync (near
  // PDXTeamSync, later in the file) is the thin wrapper that gives it the same
  // tombstone + watermark + field-level-merge sync saved/team already have.
  defineCollection('evidence', { keys: ['politidex_evidence_collections'], label: 'Saved evidence collections' });

  // 'votingPrefs' — the visitor's durable Voting Record view preferences (sort +
  // hide-procedural), so the profile Voting Record section opens the way they last
  // left it. Small and personal; syncs through the same PDXStore slot as the rest.
  defineCollection('votingPrefs', { keys: ['pdx_voting_prefs'], label: 'Voting Record view preferences' });

  // 'bills' — bills the visitor is following (Phase 3, Legislation library). Keyed
  // by stable congress+number, local-first, and account-synced like the rest.
  defineCollection('bills', { keys: ['politidex_followed_bills'], label: 'Followed bills' });

  // 'learn' — which in-context teaching notes the visitor has dismissed (see
  // pdx-learn.js). Purely "don't tell me this again" state: nothing here affects
  // what the product shows about any politician. Synced so a note dismissed on a
  // phone stays dismissed on a laptop.
  defineCollection('learn', { keys: ['pdx_learn_prefs'], label: 'Explainer notes seen' });

  // 'firstRun' — whether this visitor has completed one meaningful first task,
  // and which one (see first-run.js). Two fields and nothing else: `done` and
  // `via` ('record' | 'seat'). It is NOT an account flag and it is deliberately
  // not settable by signing up — the brief for this surface is explicit that
  // success means "has seen a sourced formal pattern OR completed one seat pick",
  // not "account created". Synced so the homepage does not restart a stranger's
  // onboarding on their second device.
  defineCollection('firstRun', { keys: ['pdx_first_run'], label: 'First-run progress' });

  // ─── PDXTeam — one named facade over the whole My Team / ballot family ──────
  // The team data is written from several long-standing <script> closures
  // (ballot builder, Home Base, saved-teams, roster). Rather than reroute every
  // scattered call site, those closures' CANONICAL save helpers now go through

  // keep it fresh after cross-device pulls. The mirror always persists dirty:false
  // (see _v2Write), so simply loading the page never manufactures a pending push.

  // Firebase isn't initialized yet at this point in the page, so wiring here would
  // be premature; leaving it to the auth handler keeps unauthenticated visitors
  // strictly local-only (no backend registered, no server traffic).

      // key→collection map (only the base 'pdx_my_saved' is registered), so dirty
      // tracking would otherwise miss a signed-in user's writes. Naming 'saved'
      // here keeps push/pull working identically for guest and per-account keys.
      if (window.PDXStore) { window.PDXStore.write(k, arr, { collection: 'saved' }); }  // writes + marks 'saved' dirty
      else { try { localStorage.setItem(k, JSON.stringify(arr)); } catch (e) {} }
      try { window.dispatchEvent(new CustomEvent('pdx-saved-change', { detail: { count: arr.length } })); } catch (e) {}
    }
    // A stable identity for a saved thing: its type + its key. Two saves of the
    // same receipt collapse to one entry (idempotent), so "Save" is a safe toggle.
    function idOf(type, key) { return String(type || '') + '::' + String(key || ''); }
    // Normalize a set of user tags into a clean array of strings. Accepts an
    // array, a single string, or a comma-separated string (and array elements may
    // themselves be comma-separated). Each tag is trimmed, lowercased, length-
    // capped and de-duplicated, with empties dropped — so tagging stays tidy and
    // "Housing", " housing " and "housing" all collapse to one tag.
    function normTags(tags) {
      var arr;
      if (Array.isArray(tags)) arr = tags;
      else if (tags == null) arr = [];
      else arr = [tags];
      var out = [], seen = {};
      for (var i = 0; i < arr.length; i++) {
        var parts = String(arr[i] == null ? '' : arr[i]).split(',');
        for (var j = 0; j < parts.length; j++) {
          var t = parts[j].trim().toLowerCase();
          if (!t) continue;
          if (t.length > 40) t = t.slice(0, 40);
          if (Object.prototype.hasOwnProperty.call(seen, t)) continue;
          seen[t] = 1; out.push(t);
        }
      }
      return out;
    }
    function indexOf(arr, type, key) {
      var id = idOf(type, key);
      for (var i = 0; i < arr.length; i++) { if (idOf(arr[i].type, arr[i].key) === id) return i; }
      return -1;
    }

    // ── Bind to the shared, collection-agnostic sync core ────────────────────
    // All merge / tombstone / watermark / reconcile logic lives in PDXSyncCore
    // (see the block above). 'saved' is now a THIN WRAPPER: it supplies a tiny
    // config — its identity function and its two independently-editable fields
    // (note, tags) — and the storage layer below; everything else is the core.
    var CORE = window.PDXSyncCore;
    var COL = CORE.createCollection({
      idOf: idOf,                                       // classic type::key identity
      fields: [
        { field: 'note', tsField: 'noteUpdatedAt' },   // free-text note  (field-level LWW)
        { field: 'tags', tsField: 'tagsUpdatedAt' }     // user tag array  (field-level LWW)
      ]
    });

    // ── Tombstones: tracked deletions so removals survive a union merge ───────
    // Stored in a SEPARATE per-account localStorage key beside the items key (so
    // per-account isolation applies identically) and ride along in the pushed
    // snapshot under `tombstones` so every device learns every deletion. The map's
    // shape and merge/GC rules are the core's; here we only persist it. Normalizing
    // on read (CORE.readTombs) keeps old, tombstone-free snapshots merging fine.
    function tombKey() { return activeKey() + '__tomb'; }
    function loadTombs() {
      var k = tombKey();
      var raw;
      if (window.PDXStore) raw = window.PDXStore.read(k, null);
      else { try { raw = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { raw = null; } }
      return CORE.readTombs(raw);
    }
    // Persist the tombstone map. Routed through PDXStore with an explicit
    // collection: like the namespaced items key, tombKey() isn't in the store's
    // key→collection map, so naming 'saved' is what marks the collection dirty so
    // a recorded deletion actually gets pushed. Direct-localStorage fallback keeps
    // deletions tracked even if the store is unavailable.
    function persistTombs(map) {
      var k = tombKey();
      if (window.PDXStore) { window.PDXStore.write(k, map, { collection: 'saved' }); }
      else { try { localStorage.setItem(k, JSON.stringify(map)); } catch (e) {} }
    }

    // ── Device watermarks: safe, bounded tombstone garbage-collection ─────────
    // A watermark is "how far has this device synced" — a per-device timestamp
    // `{ [deviceId]: ms }` carried in the snapshot beside items and tombstones, so
    // a tombstone can be GC'd only once every known device has synced strictly past
    // it (see CORE.reconcile / CORE.pruneTombstones) — never risking resurrection on
    // a long-offline device. The map's shape, forward-only union and stale-device
    // retirement are all the core's; here we only persist it per account. The device
    // id itself is the core's single shared per-browser identity (CORE.deviceId).
    function wmKey() { return activeKey() + '__wm'; }
    function loadWatermarks() {
      var k = wmKey(), raw;
      if (window.PDXStore) raw = window.PDXStore.read(k, null);
      else { try { raw = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { raw = null; } }
      return CORE.readWatermarks(raw);
    }
    // Persist the watermark map. Routed through PDXStore naming 'saved' (same
    // reason as persistTombs): the namespaced key isn't in the store's key→
    // collection map, so naming the collection is what marks it dirty and lets the
    // advanced watermark get pushed so other devices can see it.
    function persistWatermarks(map) {
      var k = wmKey();
      if (window.PDXStore) { window.PDXStore.write(k, map, { collection: 'saved' }); }
      else { try { localStorage.setItem(k, JSON.stringify(map)); } catch (e) {} }
    }
    // ── Reconciliation / merge for the 'saved' collection ────────────────────
    // The merge STRATEGY is entirely the core's: union of local ∪ server items,
    // field-level last-write-wins resolving note vs tags independently (a note edit
    // on one device and a tag edit on another never clobber each other), tombstones
    // winning ties + anything older, and watermark-gated GC. COL.mergeItems /
    // COL.reconcile (built above from this collection's idOf + note/tags spec) carry
    // all of it; reconcileFromServer below is the only 'saved'-specific glue — it
    // loads local state, calls COL.reconcile, and persists whatever actually changed
    // (so a no-op pull never re-dirties). Backward compat is unchanged: an old
    // tombstone-/watermark-free snapshot normalizes its missing maps to {} and merges
    // exactly like the original union. COL.mergeItems / COL.mergeOne are also exported
    // on window.PDXSaved for reuse/testing.

    // The reconciler PDXStore invokes on pull(): merge the server snapshot into
    // the local list and persist the result — but ONLY when the merge actually
    // changed something, so a no-op pull doesn't needlessly re-dirty and re-push.
    // Persisting marks 'saved' dirty, which lets the merged UNION get pushed back
    // up, so every device converges to the same combined list.
    function reconcileFromServer(serverSnapshot, ctx) {
      ctx = ctx || {};
      // `now` and `deviceId` are injectable (ctx) so the merge simulation can
      // drive a deterministic timeline; in the app they fall back to the real
      // wall clock and this browser's stable device id.
      var now = ctx.now != null ? ctx.now : Date.now();
      var myDevice = ctx.deviceId || CORE.deviceId();

      var localItems = load();
      var localTombs = loadTombs();
      var localWm = loadWatermarks();
      var serverItems = (serverSnapshot && Array.isArray(serverSnapshot.items))
        ? serverSnapshot.items : [];
      // Old snapshots have no `tombstones` / `watermarks` field → readTombs and
      // readWatermarks yield {} → this merges exactly like before (backward compat).
      var serverTombs = CORE.readTombs(serverSnapshot && serverSnapshot.tombstones);
      var serverWm = CORE.readWatermarks(serverSnapshot && serverSnapshot.watermarks);

      // The whole merge is the shared core's: union tombstones + watermarks,
      // field-merge items (note vs tags) against them, advance THIS device's own
      // watermark (heartbeat that lets other devices GC what it has acknowledged),
      // retire stale devices, and GC tombstones every device has synced past.
      var result = COL.reconcile({
        localItems: localItems, serverItems: serverItems,
        localTombs: localTombs, serverTombs: serverTombs,
        localWm: localWm, serverWm: serverWm,
        dirty: ctx.dirty, now: now, deviceId: myDevice
      });
      var merged = result.items, prunedTombs = result.tombstones, wm = result.watermarks;

      // Only persist what actually changed, so a no-op pull doesn't needlessly
      // re-dirty and re-push. persist()/persistTombs()/persistWatermarks() all mark
      // 'saved' dirty, which lets the merged UNION (items + tombstones + the
      // advanced watermarks) flow back up so every device converges.
      var itemsChanged = !CORE.sameItems(localItems, merged);
      var tombsChanged = !CORE.sameMap(localTombs, prunedTombs);
      var wmChanged = !CORE.sameMap(localWm, wm);
      if (tombsChanged) persistTombs(prunedTombs);
      if (wmChanged) persistWatermarks(wm);
      if (itemsChanged) persist(merged);   // persist() marks 'saved' dirty + emits pdx-saved-change
      return {
        changed: itemsChanged || tombsChanged || wmChanged,
        count: merged.length,
        fromServer: serverItems.length,
        tombstones: Object.keys(prunedTombs).length,
        watermarks: Object.keys(wm).length
      };
    }

    window.PDXSaved = {
      // Newest first — the natural reading order for a growing collection.
      list: function () {
        return load().slice().sort(function (a, b) { return (b.savedAt || 0) - (a.savedAt || 0); });
      },
      count: function () { return load().length; },
      has: function (type, key) { return indexOf(load(), type, key) !== -1; },
      get: function (type, key) { var a = load(); var i = indexOf(a, type, key); return i === -1 ? null : a[i]; },
      // item: { type, key, title, sub, icon, nav, ...snapshot }. Stamps savedAt.
      // A saved item may also grow optional `note` / `tags` plus their
      // independent `noteUpdatedAt` / `tagsUpdatedAt` edit stamps (see
      // setNote/setTags and the field-level merge in mergeOne).
      add: function (item) {
        if (!item || !item.type || item.key == null) return false;
        var a = load();
        if (indexOf(a, item.type, item.key) !== -1) return false;
        var rec = {};
        for (var k in item) { if (Object.prototype.hasOwnProperty.call(item, k)) rec[k] = item[k]; }
        rec.savedAt = Date.now();
        a.push(rec);
        persist(a);
        // Re-saving is an explicit, intentional resurrection: drop any tombstone
        // for this id so a stale deletion (here or on another device) can't remove
        // the freshly re-added item on the next merge. (Its new savedAt would beat
        // an equal-or-older tombstone anyway; clearing it keeps the set tidy.)
        var t = loadTombs(), id = idOf(item.type, item.key);
        if (Object.prototype.hasOwnProperty.call(t, id)) { delete t[id]; persistTombs(t); }
        return true;
      },
      remove: function (type, key) {
        var a = load(); var i = indexOf(a, type, key);
        var removed = false;
        if (i !== -1) { a.splice(i, 1); removed = true; }
        // Record a tombstone so this deletion PROPAGATES: without it a union merge
        // would resurrect the item as soon as another device (which still has it)
        // pushed its copy back up. deletedAt (now) orders the delete against any
        // save of the same id. Written even if the item wasn't in the local list,
        // so an intended deletion is still tracked and pushed.
        var t = loadTombs();
        t[idOf(type, key)] = Date.now();
        persistTombs(t);
        if (removed) persist(a);
        return removed;
      },
      // Attach (or clear, with '') a personal note — "why I saved this" — to an
      // existing saved item. A no-op if the item isn't in the collection.
      // Notes may be multi-line: internal newlines are preserved (only the
      // leading/trailing whitespace is trimmed), and the whole thing is capped
      // at NOTE_MAX_LEN so a runaway paste can't bloat localStorage.
      setNote: function (type, key, note) {
        var a = load(); var i = indexOf(a, type, key);
        if (i === -1) return false;
        var n = String(note == null ? '' : note).replace(/\r\n/g, '\n').trim().slice(0, NOTE_MAX_LEN);
        if (n) a[i].note = n; else delete a[i].note;
        // Stamp the NOTE's own edit time and bump savedAt (overall ordering +
        // backward compat). tagsUpdatedAt is left untouched, so a concurrent tag
        // edit on another device merges in independently (see mergeOne).
        var now = Date.now();
        a[i].noteUpdatedAt = now;
        a[i].savedAt = now;
        persist(a); return true;
      },
      // Expose the tag normalizer so callers can dedupe/merge before saving.
      normTags: normTags,
      // The note length cap, so the editor and the store agree on one number.
      NOTE_MAX_LEN: NOTE_MAX_LEN,
      // Replace the user-chosen tags on an existing saved item with a clean,
      // normalized array (see normTags). A no-op if the item isn't in the
      // collection. Passing an empty/blank set clears tags entirely.
      setTags: function (type, key, tags) {
        var a = load(); var i = indexOf(a, type, key);
        if (i === -1) return false;
        var t = normTags(tags);
        if (t.length) a[i].tags = t; else delete a[i].tags;
        // Stamp the TAGS' own edit time and bump savedAt (overall ordering +
        // backward compat). noteUpdatedAt is left untouched, so a concurrent
        // note edit on another device merges in independently (see mergeOne).
        var now = Date.now();
        a[i].tagsUpdatedAt = now;
        a[i].savedAt = now;
        persist(a); return true;
      },
      // Returns true when the item is now saved, false when it was just removed.
      toggle: function (item) {
        if (!item || !item.type || item.key == null) return false;
        if (this.has(item.type, item.key)) { this.remove(item.type, item.key); return false; }
        this.add(item); return true;
      },
      clear: function () {
        // Tombstone every current item first so "clear" propagates as real
        // deletions instead of being undone by another device's union re-push.
        var a = load(), t = loadTombs(), now = Date.now();
        for (var i = 0; i < a.length; i++) {
          if (a[i] && a[i].type != null && a[i].key != null) t[idOf(a[i].type, a[i].key)] = now;
        }
        persistTombs(t);
        persist([]);
      },
      // The full serializable state of the 'saved' collection — receipts,
      // issues/Spotlights, their tags and notes, PLUS the tombstones (tracked
      // deletions) and the device watermarks (how far each device has synced, for
      // safe tombstone GC). This is exactly the payload a remote backend receives
      // in push('saved') and would return from pull(). version 3 signals watermark
      // support; older v1 (tombstone-free) and v2 (no-watermark) snapshots still
      // merge correctly (readTombs/readWatermarks normalize the missing fields).
      snapshot: function () { return { key: KEY, version: 3, items: load(), tombstones: loadTombs(), watermarks: loadWatermarks() }; },
      // Sync status helpers, mirroring PDXTeam, so any surface can show/trigger
      // a push/pull without reaching into PDXStore internals.
      isDirty: function () { return !!(window.PDXStore && window.PDXStore.isDirty('saved')); },
      push: function () { return window.PDXStore ? window.PDXStore.push('saved') : Promise.resolve({ pushed: false, reason: 'no-store' }); },
      // Pull the server's 'saved' snapshot and merge it into local state (see the
      // merge strategy note above). Graceful no-op when no backend is registered.
      pull: function () { return window.PDXStore ? window.PDXStore.pull('saved') : Promise.resolve({ pulled: false, reason: 'no-store' }); },
      // The pure merge function (local ∪ server, field-level LWW per item,
      // minus tombstoned ids), exposed for reuse/testing. Now the shared core's,
      // bound to this collection's note/tags spec. Does not touch storage.
      mergeItems: COL.mergeItems,
      // The pure per-item field merger (note vs tags resolved independently),
      // exposed for reuse/testing. Does not touch storage.
      mergeOne: COL.mergeOne,
      // The pure tombstone-union helper (newest deletedAt per id), exposed for
      // reuse/testing. Does not touch storage.
      mergeTombstones: CORE.mergeTombstones,
      // The pure watermark-union helper (newest ms per device), exposed for
      // reuse/testing. Does not touch storage.
      mergeWatermarks: CORE.mergeWatermarks,
      // The pure, safe tombstone GC (drop only those every device synced past),
      // exposed for reuse/testing. Does not touch storage.
      pruneTombstones: CORE.pruneTombstones,
      // The collection-agnostic normalizers + watermark retirement. These now live
      // in PDXSyncCore; re-exposed here for backward compatibility with any caller
      // that reached for them via window.PDXSaved. All pure.
      readTombs: CORE.readTombs,
      readWatermarks: CORE.readWatermarks,
      pruneWatermarks: CORE.pruneWatermarks,
      // This browser's stable device id (the shared core identity; used as the
      // watermark map key).
      deviceId: CORE.deviceId,
      // A snapshot copy of the current account's tombstone map, for inspection.
      tombstones: function () { return loadTombs(); },
      // A snapshot copy of the current account's device-watermark map.
      watermarks: function () { return loadWatermarks(); }
    };

    // Register this collection's shaped snapshot with PDXStore so a remote
    // backend can push it. Guarded so the store staying local-only (or absent)
    // never breaks: with no PDXStore, PDXSaved keeps its localStorage fallback.
    if (window.PDXStore && typeof window.PDXStore.registerSnapshot === 'function') {
      window.PDXStore.registerSnapshot('saved', function () {
        return { key: KEY, version: 3, items: load(), tombstones: loadTombs(), watermarks: loadWatermarks() };
      });
    }

    // Register the pull-side reconciler so PDXStore can merge a server snapshot
    // into local state (see mergeItems above). Only 'saved' registers one, which
    // is what scopes two-way sync to this collection. Guarded so a store that is
    // absent or lacks the API leaves the local-only path untouched.
    if (window.PDXStore && typeof window.PDXStore.registerReconciler === 'function') {
      window.PDXStore.registerReconciler('saved', reconcileFromServer);
    }

    // ── React to account switches (the isolation switch) ─────────────────────
    // PDXStore fires 'pdx-account-change' with { userId } whenever the signed-in
    // account changes: a uid on sign-in, null on sign-out / anonymous. We repoint
    // activeKey() at the new context and emit a 'pdx-saved-change' so any open
    // surface immediately re-renders from the NEW user's data. The OUTGOING user's
    // items are left untouched in their own namespaced key — isolated, never
    // cleared — so signing back in on this device restores them and the next
    // person never sees them.
    //
    // EDGE CASE — auth resolves before this late <script> parses: the auth handler
    // near the top of the file may have already called enableAccountSync (setting
    // the account context) before this block ran, so its one-shot event was missed.
    // We therefore also ADOPT whatever account context is already established, via
    // getAccount(), on init. Between the two we can't miss a context.
    //
    // NOTE ON GUEST → ACCOUNT: we intentionally do NOT auto-migrate the shared
    // guest buffer ('pdx_my_saved') into an account on first sign-in. On a shared
    // browser the guest buffer may belong to someone else, so adopting it is the
    // very leak this change exists to prevent. A signed-in account's data lives in
    // its own namespace and syncs via the server instead. (An explicit, opt-in
    // "import your guest saves?" prompt is noted as a future improvement.)
    function applyAccount(uid) {
      var next = uid || null;
      if (next === _uid) return;   // no real change → no wasteful re-render
      _uid = next;
      // The underlying list changed wholesale (different key): tell surfaces to re-read.
      try { window.dispatchEvent(new CustomEvent('pdx-saved-change', { detail: { count: load().length } })); } catch (e) {}
    }
    try {
      window.addEventListener('pdx-account-change', function (e) {
        applyAccount(e && e.detail && e.detail.userId);
      });
      if (window.PDXStore && typeof window.PDXStore.getAccount === 'function') {
        applyAccount(window.PDXStore.getAccount());   // adopt an already-established context
      }
    } catch (e) { /* isolation is best-effort; a listener failure must not break saving */ }
  })();
  </script>

  <!-- ══ THE DEFERRED CRITICAL PATH — EIGHT FILES, IN THIS ORDER ════════════
       Deferred scripts run in document order after the parse, so this list is a
       dependency chain and not a preference:

         person-link.js      synchronous, like ballot.html's, because it is the
                             one owner of a person's URL and the desk's first
                             paint links picks.
         browse-photos.js    the portrait map region d reads.
         issue-map.js        the issue register my-stances.js filters against.
         voter-hub-location  location + TEAM_POSITIONS. Its own boot tail calls
                             window._vhBallotRerender(), which on the homepage
                             and on /ballot belongs to ballot-breakdown.js and
                             HERE belongs to the desk — which is why me-desk.js
                             claims that name before this file can call it.
         my-stances.js       the stars store and _msPriorityWeight.
         your-file.js        must define PDXYourFile.inline before the desk mounts
                             region b into it.
         district-voice.js   the ONE owner of District Voice: which seat a saved
                             ballot location names, whether the board is open in
                             it, the board's address, and the sentence that says
                             what the board is. Region g asks it all four and
                             decides none of them — the alternative is a second
                             copy of the seat allow-list on this document, which
                             is a second answer. Inert here: it mounts nothing
                             without a host, fetches nothing until a board asks
                             it to, and this document never gives it either.
                             district-voice.css is deliberately NOT loaded — the
                             board's own shapes have no business on a desk.
         me-desk.js          last, and it renders synchronously at parse time:
                             signed out, unplaced and empty, this document still
                             has seven honest regions, so the honest arrival is
                             the immediate one.
       ══════════════════════════════════════════════════════════════════════ -->
  <script src="/person-link.js"></script>
  <script defer src="/browse-photos.js"></script>
  <script defer src="/issue-map.js"></script>
  <script defer src="/voter-hub-location.js"></script>
  <script defer src="/my-stances.js"></script>
  <script defer src="/your-file.js"></script>
  <script defer src="/district-voice.js"></script>
  <script defer src="/me-desk.js"></script>

</head>
<body>

  <!-- ══ THE SHELL BAR — THIS DOCUMENT'S ONLY CHROME ════════════════════════
       index.html's nav is two fixed rows, a search field, the account menu and a
       layout observer. None of that belongs on an address whose whole job is to
       show one reader what they already hold. Two controls: whose site this is,
       and the way home.

       "← HOME" IS THE SHELL CLOSE RULE, COPIED FROM ballot.html. It is a real
       navigation with a plain <a href="/">, not a history.back(): the reader may
       have arrived here cold from the account menu on a freshly-opened tab, from
       a bookmark, or from a #your-file link in an old email, in which case there
       is either no history to go back through or the entry behind them was
       consumed by the redirect. An assign leaves an entry, so the browser's own
       Back still returns them to the document they came from — which is the
       brief's rule for this address, and it needs no handler to be correct.
       ══════════════════════════════════════════════════════════════════════ -->
  <header class="pdx-me-bar">
    <a href="/" class="pdx-me-wordmark" aria-label="PolitiDex home">POLITI<span>DEX</span></a>
    <span class="pdx-me-links">
      <a href="/" class="pdx-me-home" id="pdx-me-home">← Home</a>
    </span>
  </header>

  <!-- ══ THE MOUNT ══════════════════════════════════════════════════════════
       me-desk.js paints seven regions in here and NOTHING is pre-rendered: an
       empty region shipped in the markup would be a shape that looks like data
       to a reader whose JavaScript failed, and every region's honest state is a
       sentence the desk writes. So the markup carries the note instead, the desk
       replaces it wholesale, and a reader with no JavaScript reads what this
       address is rather than looking at seven empty boxes.
       ══════════════════════════════════════════════════════════════════════ -->
  <main id="me-desk" aria-label="Your file">
    <p class="pdx-me-note" id="pdx-me-note">
      Loading your file — your positions, the issues you rank harder, your ballot
      so far, and the evidence you saved. If it does not appear,
      <a href="/">go to PolitiDex</a>.
    </p>
  </main>

</body>
</html>
