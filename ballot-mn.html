<!-- ══════════════════════════════════════════════════════════════════════════════
     ballot-mn.html — /ballot/mn: your Minnesota legislative ballot, Nov. 3, 2026
     ────────────────────────────────────────────────────────────────────────────
     ONE VIEW, FOUR STEPS. The reader's saved location (set in /find) → the
     State Senate and State House races on their ballot → each name, with a
     link to their file and every formal act on file under it, each act with
     its one effect line → the seat's District Voice board where one is open.

     WHERE EACH FACT COMES FROM. mn-ballot-2026.js holds the races, the acts
     and the effect lines, each act with the chamber's own page that records
     its floor vote (the roll call on house.mn.gov, the Journal of the Senate
     on senate.mn). The seats come from the one resolver (window.pdxRepsForMe) over the
     roster in cmp-data.js; a seat the roster names nobody for says "District N
     — no member on file yet", as Who Represents Me does.

     Every same-origin path below is root-absolute, because netlify.toml serves
     this document at /ballot/mn/ too.
     ════════════════════════════════════════════════════════════════════════════════ -->
